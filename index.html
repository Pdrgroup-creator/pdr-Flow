    function CountryPicker({ selectedCode, onSelect, lang, placeholder }) {
      const [isOpen, setIsOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState("");
      const dropdownRef = useRef(null);

      const currentCountry = useMemo(() => {
        return EUROPEAN_COUNTRIES.find(c => c.code === selectedCode) || EUROPEAN_COUNTRIES[0];
      }, [selectedCode]);

      const filtered = useMemo(() => {
        if (!searchQuery.trim()) return EUROPEAN_COUNTRIES;
        const q = searchQuery.toLowerCase().trim();
        return EUROPEAN_COUNTRIES.filter(c => {
          const cName = (c.name[lang] || c.name.EN).toLowerCase();
          return cName.includes(q) || c.code.toLowerCase().includes(q) || c.dial.includes(q);
        });
      }, [searchQuery, lang]);

      useEffect(() => {
        const handleClickOutside = (e) => {
          if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
            setIsOpen(false);
          }
        };
        document.addEventListener("mousedown", handleClickOutside);
        return () => document.removeEventListener("mousedown", handleClickOutside);
      }, []);

      return (
        <div className="relative" ref={dropdownRef}>
          <button
            type="button"
            onClick={() => { setIsOpen(!isOpen); setSearchQuery(""); }}
            className="w-full bg-gray-900 border border-gray-700 hover:border-amber-500 rounded p-1.5 text-xs text-white flex justify-between items-center"
          >
            <span className="flex items-center gap-1.5 truncate">
              <span className="text-base">{currentCountry.flag}</span>
              <span className="font-bold">{currentCountry.name[lang] || currentCountry.name.EN}</span>
              <span className="text-[10px] text-gray-400 font-mono">({currentCountry.dial})</span>
            </span>
            <i className={`fa-solid ${isOpen ? "fa-chevron-up" : "fa-chevron-down"} text-[10px] text-gray-400`}></i>
          </button>

          {isOpen && (
            <div className="absolute top-full left-0 right-0 z-50 mt-1 bg-gray-950 border border-amber-500/60 rounded-xl shadow-2xl p-2 space-y-1.5 max-h-56 flex flex-col">
              <input
                type="text"
                autoFocus
                value={searchQuery}
                onChange={e => setSearchQuery(e.target.value)}
                placeholder={placeholder}
                className="w-full bg-gray-900 border border-gray-700 rounded p-1 text-xs text-white font-medium"
              />
              <div className="overflow-y-auto flex-1 space-y-0.5">
                {filtered.length === 0 ? (
                  <p className="p-2 text-center text-xs text-gray-500">No match</p>
                ) : (
                  filtered.map(c => (
                    <button
                      key={c.code}

                      className={`w-full text-left p-1.5 rounded flex items-center justify-between text-xs hover:bg-amber-500/20 ${c.code === selectedCode ? "bg-amber-500/30 text-amber-300 font-bold" : "text-gray-200"}`}
                    >

                        <span className="text-base">{c.flag}</span>
                        <span>{c.name[lang] || c.name.EN}</span>

                      <span className="text-[10px] font-mono text-gray-400">{c.dial}</span>
                    </button>
                  ))
                )}
              </div>
            </div>
          )}
        </div>
      );

    const compressImage = (file) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const maxDim = 1600;
            let width = img.width;
            let height = img.height;

            if (width > maxDim || height > maxDim) {
              if (width > height) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              } else {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }

            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob(
              (blob) => {
                if (blob) resolve(blob);
                else reject(new Error("Canvas error"));
              },
              "image/jpeg",
              0.78
            );
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    };

    const detectDominantColor = (file) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");
            canvas.width = 100;
            canvas.height = 100;

            const sx = img.width * 0.35;
            const sy = img.height * 0.35;
            const sw = img.width * 0.30;
            const sh = img.height * 0.30;

            ctx.drawImage(img, sx, sy, sw, sh, 0, 0, 100, 100);
            const imgData = ctx.getImageData(0, 0, 100, 100).data;

            let rTot = 0, gTot = 0, bTot = 0, count = 0;
            for (let i = 0; i < imgData.length; i += 16) {
              rTot += imgData[i];
              gTot += imgData[i + 1];
              bTot += imgData[i + 2];
              count++;
            }

            const r = rTot / count;
            const g = gTot / count;
            const b = bTot / count;

            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            const d = max - min;
            let h = 0;
            const s = max === 0 ? 0 : d / max;
            const v = max / 255;

            if (max !== min) {
              if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
              else if (max === g) h = (b - r) / d + 2;
              else if (max === b) h = (r - g) / d + 4;
              h /= 6;
            }

            const deg = h * 360;
            let matchedId = "grey";

            if (v < 0.16) matchedId = "black";
            else if (s < 0.12 && v > 0.82) matchedId = "white";
            else if (s < 0.20 && v > 0.50) matchedId = "silver";
            else if (s < 0.20) matchedId = "grey";
            else {
              if (deg >= 345 || deg < 12) matchedId = "red";
              else if (deg >= 12 && deg < 38) matchedId = "orange";
              else if (deg >= 38 && deg < 65) matchedId = "gold_bronze";
              else if (deg >= 65 && deg < 165) matchedId = "green";
              else if (deg >= 165 && deg < 265) matchedId = "blue";
              else if (deg >= 265 && deg < 345) matchedId = "burgundy";
            }

            resolve(matchedId);
          };
          img.onerror = () => resolve("grey");
        };
        reader.onerror = () => resolve("grey");
      });
    };

          if (repClientFilter !== "all") {

            if (!project || project.client_id !== repClientFilter) return false;
          }
          if (repProjectFilter !== "all" && v.project_id !== repProjectFilter) return false;

          const vDate = new Date(v.created_at);
          const now = new Date();

          if (repDateRange === "7days") {
            const d = new Date(); d.setDate(d.getDate() - 7);
            if (vDate < d) return false;
          } else if (repDateRange === "this_month") {
            if (vDate.getMonth() !== now.getMonth() || vDate.getFullYear() !== now.getFullYear()) return false;
          } else if (repDateRange === "last_month") {

            if (vDate.getMonth() !== lastM.getMonth() || vDate.getFullYear() !== lastM.getFullYear()) return false;

            if (vDate.getMonth() !== parseInt(repSelectedMonth, 10) || vDate.getFullYear() !== parseInt(repSelectedYear, 10)) return false;

                          <span className="text-[9px] bg-green-500/20 text-green-300 font-bold px-1.5 py-0.5 rounded">{t.partnerBadge}</span>

                      <button
                        key={l}
                        type="button"
                        onClick={() => handleSetLanguage(l)}
                        className={`py-1.5 text-xs font-bold rounded ${lang === l ? "bg-amber-500 text-black font-black" : "text-gray-400 hover:text-white"}`}

                    {t.updatePasswordBtn}
                  </button>
                </form>
              </div>
            </div>

              <div className="relative max-w-md mx-auto left-0 right-0 w-full bg-gray-900 border-t border-amber-500/50 rounded-t-2xl p-5 shadow-2xl z-10 bottom-sheet max-h-[88vh] overflow-y-auto space-y-3">

                <div className="flex justify-between items-center border-b border-gray-800 pb-2">
                  <span className="text-[10px] font-bold text-amber-400 uppercase">
                    {activeBottomSheet.type === "client" ? t.clientCardTitle : t.locationDetailTitle}

                  <div className="flex gap-2">
                    <button 
                      onClick={() => setIsEditingSheet(!isEditingSheet)} 
                      className="text-xs bg-gray-800 border border-gray-700 text-amber-400 px-2.5 py-0.5 rounded font-bold"

                      {isEditingSheet ? t.cancelBtn : t.editBtn}

                    <button onClick={() => { setActiveBottomSheet(null); setIsEditingSheet(false); }} className="text-gray-400 hover:text-white p-1">

                        onSelect={(c) => {
                          let ph = sheetEditData.phone || "";

                          setSheetEditData({ ...sheetEditData, country_code: c.code, phone: ph });

                        placeholder={t.countryPlaceholder}

                      <label className="text-[9px] text-gray-400 uppercase">{t.clientNamePlaceholder}</label>
                      <input type="text" value={sheetEditData.name || ""} onChange={e => setSheetEditData({ ...sheetEditData, name: e.target.value })} className="w-full bg-gray-950 border border-gray-700 rounded p-1.5 text-white" />
                    </div>

                    <div className="grid grid-cols-3 gap-2">
                      <div className="col-span-2">
                        <label className="text-[9px] text-gray-400 uppercase">{t.clientAddressPlaceholder}</label>
                        <input type="text" value={sheetEditData.address || ""} onChange={e => setSheetEditData({ ...sheetEditData, address: e.target.value })} className="w-full bg-gray-950 border border-gray-700 rounded p-1.5 text-white" />

                      <div>
                        <label className="text-[9px] text-gray-400 uppercase">{t.postalCodePlaceholder}</label>
                        <input type="text" value={sheetEditData.postal_code || ""} onChange={e => setSheetEditData({ ...sheetEditData, postal_code: e.target.value })} className="w-full bg-gray-950 border border-gray-700 rounded p-1.5 text-white uppercase font-mono" />

                        <input type="text" value={sheetEditData.phone || ""} onChange={e => setSheetEditData({ ...sheetEditData, phone: e.target.value })} className="w-full bg-gray-950 border border-gray-700 rounded p-1.5 text-white font-mono" />

                    </div>

                    {activeBottomSheet.type === "client" && (

                          <label className="text-[9px] text-gray-400">{t.defaultPdrPercentLabel}</label>

                        <div>
                          <label className="text-[9px] text-gray-400">{t.defaultRiPercentLabel}</label>

                        </div>
                      </div>
                    )}

                    {activeBottomSheet.type === "project" && (

                          <div>
                            <label className="text-[9px] text-gray-400">% PDR</label>
                            <input type="number" inputMode="decimal" value={sheetEditData.tech_pdr_percent ?? ""} onChange={e => setSheetEditData({ ...sheetEditData, tech_pdr_percent: e.target.value })} className="w-full bg-gray-950 border border-gray-700 rounded p-1.5 text-amber-400 font-bold" />

                          <div>
                            <label className="text-[9px] text-gray-400">% R&I</label>
                            <input type="number" inputMode="decimal" value={sheetEditData.tech_ri_percent ?? ""} onChange={e => setSheetEditData({ ...sheetEditData, tech_ri_percent: e.target.value })} className="w-full bg-gray-950 border border-gray-700 rounded p-1.5 text-amber-400 font-bold" />

                        </div>

                        <div>
                          <label className="text-[9px] text-gray-400 uppercase">{t.pricingModeLabel}</label>
                          <div className="grid grid-cols-3 gap-1 mt-0.5">

                              <button key={m} type="button" onClick={() => setSheetEditData({ ...sheetEditData, pricing_mode: m })} className={`py-1 text-[9px] font-bold rounded uppercase border ${sheetEditData.pricing_mode === m ? "bg-amber-500 text-black border-amber-400" : "bg-gray-950 text-gray-300 border-gray-700"}`}>

                      </button>
                      <button type="button" onClick={() => setShowNewClientForm(false)} className="text-gray-400 hover:text-white">
                        <i className="fa-solid fa-xmark"></i>
                      </button>
                    </div>
                  </div>

                  <div>
                    <span className="text-[8px] text-gray-400 uppercase">Country</span>
                    <CountryPicker 
                      selectedCode={newClientCountry} 
                      onSelect={(c) => {
                        setNewClientCountry(c.code);
                        setNewClientPhone(c.dial + " ");
                      }} 
                      lang={lang} 
                      placeholder={t.countryPlaceholder} 
                    />
                  </div>

                  <input type="text" value={newClientName} onChange={e => setNewClientName(e.target.value)} placeholder={t.clientNamePlaceholder} className="w-full bg-gray-900 border border-gray-600 rounded p-1.5 text-xs text-white font-bold" required />
                  
                  <div className="grid grid-cols-3 gap-2">
                    <input type="text" value={newClientAddress} onChange={e => setNewClientAddress(e.target.value)} placeholder={t.clientAddressPlaceholder} className="col-span-2 bg-gray-900 border border-gray-700 rounded p-1.5 text-xs text-gray-200" />
                    <input type="text" value={newClientPostalCode} onChange={e => setNewClientPostalCode(e.target.value)} placeholder={t.postalCodePlaceholder} className="bg-gray-900 border border-gray-700 rounded p-1.5 text-xs text-gray-200 uppercase font-mono" />
                  </div>
                  
                  <div className="grid grid-cols-2 gap-2">
                    <input type="text" value={newClientContactPerson} onChange={e => setNewClientContactPerson(e.target.value)} placeholder={t.contactPersonPlaceholder} className="bg-gray-900 border border-gray-700 rounded p-1.5 text-xs text-gray-200" />
                    <input type="text" value={newClientPhone} onChange={e => setNewClientPhone(e.target.value)} placeholder={t.phonePlaceholder} className="bg-gray-900 border border-gray-700 rounded p-1.5 text-xs text-gray-200 font-mono" />
                  </div>
                  <input type="text" value={newClientIco} onChange={e => setNewClientIco(e.target.value)} placeholder={t.icoPlaceholder} className="w-full bg-gray-900 border border-gray-700 rounded p-1.5 text-xs text-gray-200" />

                  <div className="grid grid-cols-2 gap-2 pt-1 border-t border-gray-700">
                    <div>
                      <label className="text-[9px] text-gray-400">{t.defaultPdrPercentLabel}</label>
                      <input type="number" inputMode="decimal" value={newClientDefaultPdr} onChange={e => setNewClientDefaultPdr(e.target.value)} placeholder="100" className="w-full bg-gray-900 border border-gray-700 rounded p-1 text-xs text-amber-400 font-bold" />
                    </div>
                    <div>
                      <label className="text-[9px] text-gray-400">{t.defaultRiPercentLabel}</label>
                      <input type="number" inputMode="decimal" value={newClientDefaultRi} onChange={e => setNewClientDefaultRi(e.target.value)} placeholder="100" className="w-full bg-gray-900 border border-gray-700 rounded p-1 text-xs text-amber-400 font-bold" />
                    </div>
                  </div>

                  <div className="pt-1 border-t border-gray-700 space-y-1.5">
                    <label className="text-[10px] text-gray-300 font-bold flex items-center gap-1.5 cursor-pointer">
                      <input type="checkbox" checked={hasSeqConfig} onChange={e => setHasSeqConfig(e.target.checked)} />
                      <span>{t.predefinedSeqCheckbox}</span>
                    </label>

                    {hasSeqConfig && (
                      <div className="grid grid-cols-2 gap-2 bg-gray-950 p-2 rounded border border-gray-700">
                        <div>
                          <span className="text-[8px] text-gray-400 uppercase">{t.seqFixedPart}</span>
                          <input type="text" value={newClientSeqPrefix} onChange={e => setNewClientSeqPrefix(e.target.value)} placeholder="DNK/{ROK}/" className="w-full bg-gray-900 border border-gray-600 rounded p-1 text-xs text-amber-300 font-mono" />
                        </div>
                        <div>
                          <span className="text-[8px] text-gray-400 uppercase">{t.seqStartPart}</span>
                          <input type="number" inputMode="decimal" value={newClientInitialSeq} onChange={e => setNewClientInitialSeq(e.target.value)} placeholder="1" className="w-full bg-gray-900 border border-gray-600 rounded p-1 text-xs text-amber-300 font-mono" />
                        </div>
                      </div>
                    )}
                  </div>

                  <button type="submit" className="w-full bg-amber-500 text-black font-extrabold py-2 rounded text-xs shadow">{t.saveChangesBtn}</button>
                </form>
              )}

              <div className="flex justify-end px-1">
                <button onClick={() => setShowArchivedProjects(!showArchivedProjects)} className="text-[10px] text-amber-400 font-bold underline">
                  {showArchivedProjects ? "Hide Archived Locations" : "Show Archived Locations"}
                </button>
              </div>

              {/* ZOZNAM KLIENTOV A LOKÁCIÍ */}
              <div className="space-y-2.5">
                {clients.map(c => {
                  const clientProjects = projects.filter(p => p.client_id === c.id && (showArchivedProjects ? true : p.is_active !== false));
                  const isOpen = selectedClientDetailId === c.id;

                  const filteredLocations = clientProjects.filter(p => {
                    if (!locationSearchFilter.trim()) return true;
                    const f = locationSearchFilter.toLowerCase();
                    return (
                      (p.name && p.name.toLowerCase().includes(f)) || 
                      (p.address && p.address.toLowerCase().includes(f)) ||
                      (p.postal_code && p.postal_code.toLowerCase().includes(f))
                    );
                  });

                  return (
                    <div key={c.id} className="bg-gray-800 rounded-xl border border-gray-700 overflow-hidden">
                      <div onClick={() => setSelectedClientDetailId(isOpen ? null : c.id)} className="p-3 flex justify-between items-center cursor-pointer hover:bg-gray-750">
                        <div>
                          <div className="flex items-center gap-2">
                            <span className="text-base">{EUROPEAN_COUNTRIES.find(cou => cou.code === c.country_code)?.flag || "🇪🇺"}</span>
                            <h4 className="font-extrabold text-white text-sm">{c.name}</h4>
                            {c.fixed_seq_prefix && <span className="text-[9px] bg-amber-500/20 text-amber-300 px-1 py-0.5 rounded font-mono font-bold">{c.fixed_seq_prefix}</span>}
                          </div>
                          <p className="text-[10px] text-gray-400 mt-0.5">{clientProjects.length} {t.tabProjects2.toLowerCase()}</p>
                        </div>
                        <div className="flex items-center gap-2">
                          <button type="button" onClick={(e) => { e.stopPropagation(); handleOpenSheet("client", c); }} className="text-xs px-2 py-1 rounded border bg-gray-900 text-amber-400 border-gray-700 font-bold">
                            <i className="fa-solid fa-address-card"></i>
                          </button>
                          <i className={`fa-solid ${isOpen ? "fa-chevron-up" : "fa-chevron-down"} text-xs text-gray-400`}></i>
                        </div>
                      </div>

                      {isOpen && (
                        <div className="p-3 bg-gray-900/70 border-t border-gray-700 space-y-2.5">
                          <div className="flex justify-between items-center gap-2">
                            <input type="text" value={locationSearchFilter} onChange={e => setLocationSearchFilter(e.target.value)} placeholder={t.searchLocationsPlaceholder} className="flex-1 bg-gray-950 border border-gray-700 rounded-lg px-2.5 py-1 text-xs text-white" />
                            <button onClick={() => { setAddingProjectClientId(addingProjectClientId === c.id ? null : c.id); setProjectCategoriesList([]); }} className="bg-amber-500 hover:bg-amber-400 text-black font-extrabold px-2.5 py-1 rounded-lg text-xs shadow whitespace-nowrap">
                              {t.addLocationBtn}
                            </button>
                          </div>

                          {/* FORMULÁR NOVEJ LOKÁCIE (S OPRAVENÝM UKLADANÍM A ŠTÁTOM) */}
                          {addingProjectClientId === c.id && (
                            <div className="bg-gray-950 p-2.5 rounded-xl border border-amber-500/50 space-y-2">
                              <div className="flex justify-between items-center">
                                <span className="text-xs font-bold text-amber-400 uppercase">{t.addLocationBtn}</span>
                                <button 
                                  type="button" 
                                  onClick={() => { if (locationCardInputRef.current) locationCardInputRef.current.click(); }} 
                                  className="w-6 h-6 bg-gray-900 border border-amber-500/50 text-amber-400 rounded flex items-center justify-center"
                                  title="Scan"
                                >
                                  <i className="fa-solid fa-camera text-[10px]"></i>
                                </button>
                              </div>

                              <div>
                                <span className="text-[8px] text-gray-400 uppercase">Country</span>
                                <CountryPicker 
                                  selectedCode={newProjectCountry} 
                                  onSelect={(cou) => {
                                    setNewProjectCountry(cou.code);
                                    setNewProjectPhone(cou.dial + " ");
                                  }} 
                                  lang={lang} 
                                  placeholder={t.countryPlaceholder} 
                                />
                              </div>

                              <input type="text" value={newProjectName} onChange={e => setNewProjectName(e.target.value)} placeholder="Location name" className="w-full bg-gray-900 border border-gray-700 rounded p-1 text-xs text-white font-bold" />
                              
                              <div className="grid grid-cols-3 gap-1.5">
                                <input type="text" value={newProjectAddress} onChange={e => setNewProjectAddress(e.target.value)} placeholder={t.clientAddressPlaceholder} className="col-span-2 bg-gray-900 border border-gray-700 rounded p-1 text-xs text-gray-200" />
                                <input type="text" value={newProjectPostalCode} onChange={e => setNewProjectPostalCode(e.target.value)} placeholder={t.postalCodePlaceholder} className="bg-gray-900 border border-gray-700 rounded p-1 text-xs text-gray-200 uppercase font-mono" />
                              </div>

                              <div className="grid grid-cols-2 gap-1.5">
                                <input type="text" value={newProjectContactPerson} onChange={e => setNewProjectContactPerson(e.target.value)} placeholder={t.contactPersonPlaceholder} className="bg-gray-900 border border-gray-700 rounded p-1 text-xs text-gray-200" />
                                <input type="text" value={newProjectPhone} onChange={e => setNewProjectPhone(e.target.value)} placeholder={t.phonePlaceholder} className="bg-gray-900 border border-gray-700 rounded p-1 text-xs text-gray-200 font-mono" />
                              </div>

                              <div className="grid grid-cols-3 gap-1 pt-1">
                                {["free", "fixed", "categories"].map(mode => (
                                  <button key={mode} type="button" onClick={() => setNewProjectPricingMode(mode)} className={`py-1 text-[9px] font-bold rounded uppercase border ${newProjectPricingMode === mode ? "bg-amber-500 text-black border-amber-400" : "bg-gray-900 text-gray-300 border-gray-700"}`}>
                                    {mode}
                                  </button>
                                ))}
                              </div>

                              {newProjectPricingMode === "fixed" && (
                                <input type="number" inputMode="decimal" value={newProjectFixedPrice} onChange={e => setNewProjectFixedPrice(e.target.value)} placeholder={`${t.fixedRateLabel} (${currSymbol})`} className="w-full bg-gray-900 border border-gray-700 rounded p-1 text-xs text-amber-300 font-bold" />
                              )}

                              {newProjectPricingMode === "categories" && (
                                <div className="p-2 bg-gray-900 rounded border border-gray-700 space-y-2">
                                  <div className="flex gap-1.5">
                                    <input 
                                      type="number" 
                                      inputMode="decimal"
                                      value={tempCategoryPrice} 
                                      onChange={e => setTempCategoryPrice(e.target.value)} 
                                      placeholder={`Cat ${projectCategoriesList.length + 1} (${currSymbol})`}
                                      className="flex-1 bg-gray-950 border border-amber-500/50 rounded p-1 text-xs text-amber-400 font-bold"
                                    />
                                    <button type="button" onClick={handleAddCategoryItem} className="bg-amber-500 text-black font-extrabold px-3 py-1 text-xs rounded shadow">
                                      {t.addCatBtn}
                                    </button>
                                  </div>

                                  <div className="flex flex-wrap gap-1">
                                    {projectCategoriesList.map((cat, i) => (
                                      <span key={i} className="inline-flex items-center gap-1 bg-gray-950 border border-amber-500/40 text-amber-300 px-2 py-0.5 rounded text-[10px] font-bold">
                                        {cat.label}: {cat.price} {currSymbol}
                                        <button type="button" onClick={() => handleRemoveCategoryItem(i)} className="text-red-400 hover:text-red-200 ml-1">×</button>
                                      </span>
                                    ))}
                                  </div>
                                </div>
                              )}

                              <div className="grid grid-cols-2 gap-1.5 pt-1 border-t border-gray-800">
                                <div>
                                  <label className="text-[8px] text-gray-400 uppercase">% PDR</label>
                                  <input type="number" inputMode="decimal" value={newProjectTechPdrPercent} onChange={e => setNewProjectTechPdrPercent(e.target.value)} placeholder={c.default_pdr_percent ? `${c.default_pdr_percent}%` : "100"} className="w-full bg-gray-900 border border-gray-700 rounded p-1 text-xs text-amber-400 font-bold" />
                                </div>
                                <div>
                                  <label className="text-[8px] text-gray-400 uppercase">% R&I</label>
                                  <input type="number" inputMode="decimal" value={newProjectTechRiPercent} onChange={e => setNewProjectTechRiPercent(e.target.value)} placeholder={c.default_ri_percent ? `${c.default_ri_percent}%` : "100"} className="w-full bg-gray-900 border border-gray-700 rounded p-1 text-xs text-amber-400 font-bold" />
                                </div>
                              </div>

                              {/* ZOBRAZENIE AW RATE IBA PRE FREE */}
                              {newProjectPricingMode === "free" && (
                                <input type="number" inputMode="decimal" value={newProjectAwRate} onChange={e => setNewProjectAwRate(e.target.value)} placeholder={`${t.awRateLabel} (${currSymbol})`} className="w-full bg-gray-900 border border-gray-700 rounded p-1 text-xs text-amber-400 font-bold" />
                              )}

                              <button type="button" onClick={async () => {
                                if (!newProjectName.trim()) return;

                                // Správna sanitizácia hodnôt na null pre SQL
                                const parsedFixed = newProjectPricingMode === "fixed" && newProjectFixedPrice ? parseFloat(newProjectFixedPrice) : null;
                                const parsedAw = newProjectPricingMode === "free" && newProjectAwRate ? parseFloat(newProjectAwRate) : null;
                                const parsedPdr = newProjectTechPdrPercent !== "" ? parseFloat(newProjectTechPdrPercent) : null;
                                const parsedRi = newProjectTechRiPercent !== "" ? parseFloat(newProjectTechRiPercent) : null;

                                const { data, error } = await supabase.from("projects").insert([{ 
                                  client_id: c.id, 
                                  name: newProjectName.trim(), 
                                  country_code: newProjectCountry,
                                  address: newProjectAddress.trim() || null,
                                  postal_code: newProjectPostalCode.trim() || null,
                                  contact_person: newProjectContactPerson.trim() || null,
                                  phone: newProjectPhone.trim() || null,
                                  pricing_mode: newProjectPricingMode,
                                  fixed_price: parsedFixed,
                                  pricing_categories: newProjectPricingMode === "categories" ? projectCategoriesList : null,
                                  tech_pdr_percent: parsedPdr,
                                  tech_ri_percent: parsedRi,
                                  aw_rate: parsedAw,
                                  is_active: true,
                                  created_by: currentUser.id 
                                }]).select();

                                if (!error && data) {
                                  setProjects([...projects, data[0]]);
                                  handleProjectChange(data[0].id);
                                  setNewProjectName("");
                                  setNewProjectAddress("");
                                  setNewProjectPostalCode("");
                                  setNewProjectContactPerson("");
                                  setNewProjectPhone("+49");
                                  setProjectCategoriesList([]);
                                  setAddingProjectClientId(null);
                                } else {
                                  alert("Error: " + (error ? error.message : "Save failed"));
                                }
                              }} className="w-full bg-amber-500 text-black font-extrabold py-1.5 text-xs rounded">{t.saveChangesBtn}</button>
                            </div>
                          )}

                          <div className="space-y-1">
                            {filteredLocations.map(p => (
                              <div key={p.id} className="text-xs p-2 rounded border bg-gray-950 border-gray-800 flex justify-between items-center">
                                <div>
                                  <div className="flex items-center gap-1.5">
                                    <span className="text-base">{EUROPEAN_COUNTRIES.find(cou => cou.code === p.country_code)?.flag || "🇪🇺"}</span>
                                    <span className="font-bold text-white">{p.name}</span>
                                    <span className="text-[8px] uppercase bg-gray-800 text-amber-400 px-1 rounded font-bold">{p.pricing_mode}</span>
                                  </div>
                                  {p.address && <p className="text-[9px] text-gray-400">{p.address} {p.postal_code ? `(${p.postal_code})` : ""}</p>}
                                </div>
                                <div className="flex items-center gap-1.5">
                                  <button type="button" onClick={() => handleOpenSheet("project", p)} className="text-[10px] px-2 py-1 bg-gray-900 border border-gray-700 rounded text-amber-400 font-bold">
                                    {t.editBtn}
                                  </button>
                                  <button 
                                    type="button" 
                                    onClick={() => handleToggleArchiveProject(p.id, p.is_active !== false)}
                                    className={`text-[9px] px-2 py-1 rounded font-bold border ${p.is_active === false ? "bg-gray-800 text-green-400 border-green-600/50" : "bg-gray-900 text-red-400 border-red-500/40"}`}
                                  >
                                    {p.is_active === false ? t.restoreBtn : t.archiveBtn}
                                  </button>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          ) : (
            /* 3. KARTA: REGISTER & REPORTS */
            <div className="space-y-3">
              <div className="bg-gray-800 p-2.5 rounded-xl border border-gray-700 space-y-2">
                <input 
                  type="text" 
                  value={repSearchQuery} 
                  onChange={e => setRepSearchQuery(e.target.value)} 
                  placeholder={t.searchPlaceholder} 
                  className="w-full bg-gray-900 border border-gray-700 rounded-lg p-1.5 text-xs text-white"
                />

                <div className="grid grid-cols-3 gap-1.5 text-[10px]">
                  <select value={repClientFilter} onChange={e => { setRepClientFilter(e.target.value); setRepProjectFilter("all"); }} className="bg-gray-900 border border-gray-700 rounded p-1 text-white">
                    <option value="all">{t.allClients}</option>
                    {clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                  </select>

                  <select value={repProjectFilter} onChange={e => setRepProjectFilter(e.target.value)} className="bg-gray-900 border border-gray-700 rounded p-1 text-amber-400">
                    <option value="all">{t.allLocations}</option>
                    {projects.filter(p => repClientFilter === "all" || p.client_id === repClientFilter).map(p => (
                      <option key={p.id} value={p.id}>{p.name}</option>
                    ))}
                  </select>

                  <select value={repDateRange} onChange={e => setRepDateRange(e.target.value)} className="bg-gray-900 border border-gray-700 rounded p-1 text-white">
                    <option value="all">{t.allDates}</option>
                    <option value="7days">{t.last7Days}</option>
                    <option value="this_month">{t.thisMonth}</option>
                    <option value="last_month">{t.lastMonth}</option>
                    <option value="custom_month">{t.customMonthYear}</option>
                  </select>
                </div>

                {repDateRange === "custom_month" && (
                  <div className="grid grid-cols-2 gap-1.5 pt-1 border-t border-gray-700">
                    <div>
                      <span className="text-[8px] text-gray-400 uppercase">{t.selectMonth}</span>
                      <select value={repSelectedMonth} onChange={e => setRepSelectedMonth(e.target.value)} className="w-full bg-gray-950 border border-amber-500/50 rounded p-1 text-xs text-amber-400 font-bold">
                        {MONTHS_LIST[lang].map((mName, idx) => (
                          <option key={idx} value={idx}>{mName}</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <span className="text-[8px] text-gray-400 uppercase">{t.selectYear}</span>
                      <select value={repSelectedYear} onChange={e => setRepSelectedYear(e.target.value)} className="w-full bg-gray-950 border border-amber-500/50 rounded p-1 text-xs text-amber-400 font-bold">
                        {availableYears.map(yr => (
                          <option key={yr} value={yr}>{yr}</option>
                        ))}
                      </select>
                    </div>
                  </div>
                )}
              </div>

              {/* SÚČTY */}
              <div className="grid grid-cols-3 gap-1.5 text-center">
                <div className="bg-gray-800 p-2 rounded-xl border border-gray-700">
                  <span className="text-[9px] text-gray-400 uppercase font-bold">{t.kpiVehicles}</span>
                  <p className="text-sm font-black text-white">{reportTotals.count}</p>
                </div>
                <div className="bg-gray-800 p-2 rounded-xl border border-gray-700">
                  <span className="text-[9px] text-gray-400 uppercase font-bold">{t.kpiGross}</span>
                  <p className="text-sm font-black text-amber-400">{reportTotals.gross} {currSymbol}</p>
                </div>
                <div className="bg-gray-800 p-2 rounded-xl border border-amber-500/40 bg-amber-500/10">
                  <span className="text-[9px] text-amber-300 uppercase font-bold">{t.kpiMyShare}</span>
                  <p className="text-sm font-black text-amber-400">~{reportTotals.tech} {currSymbol}</p>
                </div>
              </div>

              {/* EXPORT TLAČIDLÁ */}
              <div className="flex gap-2">
                <button onClick={exportPDF} className="flex-1 bg-amber-500 hover:bg-amber-400 text-black font-extrabold py-2 px-3 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow">
                  <i className="fa-solid fa-file-pdf"></i>
                  <span>{t.downloadPdfBtn}</span>
                </button>
                <button onClick={exportCSV} className="bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-300 font-bold py-2 px-3 rounded-xl text-xs flex items-center justify-center gap-1.5">
                  <i className="fa-solid fa-file-csv"></i>
                  <span>{t.downloadCsvBtn}</span>
                </button>
              </div>

              {/* SÚPIS VOZIDIEL */}
              <div className="space-y-1.5">
                {reportVehicles.length === 0 ? (
                  <p className="p-6 text-center text-xs text-gray-500">{t.noVehicles}</p>
                ) : (
                  reportVehicles.map(v => {
                    const myCoop = coopRecords.find(c => c.vehicle_id === v.id && c.technician_id === currentUser.id);
                    const fraction = myCoop ? Number(myCoop.split_fraction) : 1;
                    const isOwner = v.created_by === currentUser.id;

                    return (
                      <div key={v.id} onClick={() => { setSelectedVehicleDetail(v); setLatePriceInput(""); }} className="bg-gray-800 p-2.5 rounded-xl border border-gray-700 flex justify-between items-center cursor-pointer hover:border-amber-500/50">
                        <div>
                          <div className="flex items-center gap-1.5">
                            <span className="text-xs font-bold text-amber-400 font-mono">{v.client_calc_no || "-"}</span>
                            <span className="text-xs font-bold text-white">{v.brand} {v.model}</span>
                            {fraction < 1 && (
                              <span className="text-[8px] bg-amber-500/20 text-amber-300 border border-amber-500/40 px-1 py-0.2 rounded font-black flex items-center gap-0.5">
                                <i className="fa-solid fa-handshake text-[8px]"></i>
                                <span>Co-Op {Math.round(fraction*100)}%</span>
                              </span>
                            )}
                          </div>
                          <p className="text-[9px] text-gray-400 font-mono">
                            VIN: {v.vin} | {v.ecv}
                            {!isOwner && <span className="ml-1 text-gray-500 font-normal">({t.partnerBadge})</span>}
                          </p>
                        </div>
                        <div className="text-right">
                          {v.is_price_pending ? (
                            <span className="text-[10px] bg-yellow-500/20 text-yellow-300 font-bold px-2 py-0.5 rounded border border-yellow-500/30">
                              {v.aw_count ? `${v.aw_count} AW` : t.pricePendingCheckbox}
                            </span>
                          ) : (
                            <div>
                              <span className="text-xs bg-amber-500/20 text-amber-300 font-bold px-2 py-0.5 rounded">
                                {(Number(v.price) + Number(v.ri_price || 0)).toFixed(2)} {currSymbol}
                              </span>
                              <p className="text-[8px] text-gray-400 mt-0.5">
                                {t.kpiMyShare}: ~{((((Number(v.price) * (v.tech_pdr_percent/100)) + (Number(v.ri_price || 0) * (v.tech_ri_percent/100))) * fraction)).toFixed(2)} {currSymbol}
                              </p>
                            </div>
                          )}
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
