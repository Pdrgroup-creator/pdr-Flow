<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PDR FlowBoard">
  <meta name="theme-color" content="#111827">
  <title>PDR FlowBoard Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- jsPDF & AutoTable -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <style>
    body { background-color: #111827; margin: 0; padding: 0; }
    .bottom-sheet { animation: slideUp 0.22s ease-out forwards; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] { 
      -moz-appearance: textfield; 
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col justify-between font-sans select-none">
  <div id="root" class="flex-1 flex flex-col justify-center items-center p-2.5"></div>

  <footer class="py-2.5 text-center text-xs text-gray-500 border-t border-gray-800 bg-gray-950/60">
    PDR FlowBoard &copy; 2026 | Powered by P<span class="text-amber-500 font-black">3</span>D<span class="text-amber-500 font-black">R</span>0
  </footer>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
