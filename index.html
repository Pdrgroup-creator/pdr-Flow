    // Canvas kompresia (max 1600 px, JPEG 0.78)
    const compressImage = (file) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const maxDim = 1600;
            let width = img.width;
            let height = img.height;

            if (width > maxDim || height > maxDim) {
              if (width > height) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              } else {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }

            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob(
              (blob) => {
                if (blob) resolve(blob);
                else reject(new Error("Canvas blob error"));
              },
              "image/jpeg",
              0.78
            );
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    };

    // Odhad farby karosérie zo stredu snímky (stred kufra)
    const detectDominantColor = (file, langKey) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");
            canvas.width = 100;
            canvas.height = 100;

            const sx = img.width * 0.35;
            const sy = img.height * 0.35;
            const sw = img.width * 0.30;
            const sh = img.height * 0.30;

            ctx.drawImage(img, sx, sy, sw, sh, 0, 0, 100, 100);
            const imgData = ctx.getImageData(0, 0, 100, 100).data;

            let rTot = 0, gTot = 0, bTot = 0, count = 0;
            for (let i = 0; i < imgData.length; i += 16) {
              rTot += imgData[i];
              gTot += imgData[i + 1];
              bTot += imgData[i + 2];
              count++;
            }

            const r = rTot / count;
            const g = gTot / count;
            const b = bTot / count;

            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            const d = max - min;
            let h = 0;
            const s = max === 0 ? 0 : d / max;
            const v = max / 255;

            if (max !== min) {
              if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
              else if (max === g) h = (b - r) / d + 2;
              else if (max === b) h = (r - g) / d + 4;
              h /= 6;
            }

            const deg = h * 360;
            const opts = COLOR_DATA[langKey] || COLOR_DATA["SK"];
            let idx = 2; // Sivá / Strieborná

            if (v < 0.18) idx = 1; // Čierna
            else if (s < 0.15 && v > 0.75) idx = 0; // Biela
            else if (s < 0.20) idx = 2; // Sivá / Strieborná
            else {
              if (deg >= 345 || deg < 15) idx = 4; // Červená
              else if (deg >= 15 && deg < 45) idx = 6; // Hnedá / Bronz
              else if (deg >= 70 && deg < 170) idx = 5; // Zelená
              else if (deg >= 170 && deg < 260) idx = 3; // Modrá
              else idx = 2;
            }

            resolve(opts[idx]);
          };
          img.onerror = () => resolve(COLOR_DATA[langKey][2]);
        };
        reader.onerror = () => resolve(COLOR_DATA[langKey][2]);
      });
    };

        } catch (err) {
          console.warn("Partnership load error", err);
        }
      };

      useEffect(() => {
        if (currentUser) loadData();
      }, [currentUser]);

      const availableProjects = useMemo(() => {
        return projects.filter(p => p.client_id === selectedClientId && p.is_active !== false);
      }, [projects, selectedClientId]);

      useEffect(() => {
        if (availableProjects.length > 0) {
          const found = availableProjects.find(p => p.id === selectedProjectId);
          if (!found) {
            setSelectedProjectId(availableProjects[0].id);
            localStorage.setItem("pdr_last_project", availableProjects[0].id);
          }
        } else {
          setSelectedProjectId("");
        }
      }, [availableProjects, selectedClientId]);

      const handleClientChange = (cId) => {
        setSelectedClientId(cId);
        localStorage.setItem("pdr_last_client", cId);
      };

      const handleProjectChange = (pId) => {
        setSelectedProjectId(pId);
        localStorage.setItem("pdr_last_project", pId);
      };

      const currentSelectedClient = useMemo(() => {
        return clients.find(c => c.id === selectedClientId);
      }, [clients, selectedClientId]);

      const currentSelectedProject = useMemo(() => {
        return projects.find(p => p.id === selectedProjectId);
      }, [projects, selectedProjectId]);

      // Kaskádový výpočet percent provízie: Lokácia -> Klient -> 100 %
      const basePdrPercent = useMemo(() => {
        if (currentSelectedProject?.tech_pdr_percent !== null && currentSelectedProject?.tech_pdr_percent !== undefined && currentSelectedProject?.tech_pdr_percent !== "") {
          return parseFloat(currentSelectedProject.tech_pdr_percent);
        }
        if (currentSelectedClient?.default_pdr_percent !== null && currentSelectedClient?.default_pdr_percent !== undefined && currentSelectedClient?.default_pdr_percent !== "") {
          return parseFloat(currentSelectedClient.default_pdr_percent);
        }
        return 100;
      }, [currentSelectedProject, currentSelectedClient]);

      const baseRiPercent = useMemo(() => {
        if (currentSelectedProject?.tech_ri_percent !== null && currentSelectedProject?.tech_ri_percent !== undefined && currentSelectedProject?.tech_ri_percent !== "") {
          return parseFloat(currentSelectedProject.tech_ri_percent);
        }
        if (currentSelectedClient?.default_ri_percent !== null && currentSelectedClient?.default_ri_percent !== undefined && currentSelectedClient?.default_ri_percent !== "") {
          return parseFloat(currentSelectedClient.default_ri_percent);
        }
        return 100;
      }, [currentSelectedProject, currentSelectedClient]);

      // Kooperácia Split: 1 / (1 + počet označených partnerov)
      const coopSplitFraction = useMemo(() => {
        const totalTechs = 1 + selectedCoopPartners.length;
        return 1 / totalTechs;
      }, [selectedCoopPartners]);

      const effectivePdrPercent = useMemo(() => {
        return (basePdrPercent * coopSplitFraction);
      }, [basePdrPercent, coopSplitFraction]);

      const effectiveRiPercent = useMemo(() => {
        return (baseRiPercent * coopSplitFraction);
      }, [baseRiPercent, coopSplitFraction]);

      // Správanie cien podľa režimu lokácie
      useEffect(() => {
        if (!currentSelectedProject) return;

        if (currentSelectedProject.pricing_mode === "fixed" && currentSelectedProject.fixed_price) {
          setPrice(String(currentSelectedProject.fixed_price));
          setAwCount("");
          setSelectedCategoryLabel("");
          setIsPricePending(false);
        } else if (currentSelectedProject.pricing_mode === "categories") {
          const cats = currentSelectedProject.pricing_categories || [];
          if (cats.length > 0) {
            setSelectedCategoryLabel(cats[0].label);
            setPrice(String(cats[0].price));
            setAwCount("");
            setIsPricePending(false);
          }
        } else if (currentSelectedProject.pricing_mode === "free") {
          setSelectedCategoryLabel("");
        }
      }, [currentSelectedProject]);

      // DUÁLNA LOGIKA CENA vs AW
      const isTypingPrice = Boolean(price && String(price).trim() !== "");
      const isTypingAw = Boolean(awCount && String(awCount).trim() !== "");
      const isAwRateMissing = currentSelectedProject?.pricing_mode === "free" && isTypingAw && !currentSelectedProject?.aw_rate;

      const handleDirectPriceChange = (val) => {
        setPrice(val);
        if (val && val.trim() !== "") {
          setAwCount("");
          setIsPricePending(false);
        }
      };

      const handleAwChange = (val) => {
        setAwCount(val);
        if (val && val.trim() !== "") {
          const count = parseFloat(val);
          if (!isNaN(count) && currentSelectedProject?.aw_rate) {
            setPrice((count * parseFloat(currentSelectedProject.aw_rate)).toFixed(2));
            setIsPricePending(false);
          } else {
            setPrice("");
          }
        } else {
          setPrice("");
        }
      };

      const canCloseRecord = useMemo(() => {
        if (isPricePending) return true;
        if (currentSelectedProject?.pricing_mode === "free" && isTypingAw && isAwRateMissing) {
          return false;
        }
        return true;
      }, [isPricePending, currentSelectedProject, isTypingAw, isAwRateMissing]);

      const techEarned = useMemo(() => {
        const pdrP = effectivePdrPercent / 100;
        const riP = effectiveRiPercent / 100;
        const pdrVal = parseFloat(price) || 0;
        const riVal = parseFloat(riPrice) || 0;
        return (pdrVal * pdrP + riVal * riP).toFixed(2);
      }, [price, riPrice, effectivePdrPercent, effectiveRiPercent]);

      // Automatické číslovanie kalkulácií s maskou
      useEffect(() => {
        if (!selectedClientId) return;
        const client = clients.find(c => c.id === selectedClientId);
        const currentYear = new Date().getFullYear();

        if (client && client.auto_numbering && client.fixed_seq_prefix) {
          let prefix = client.fixed_seq_prefix;
          if (prefix.includes("{ROK}")) {
            prefix = prefix.replace("{ROK}", String(currentYear));
          } else if (!prefix.includes(String(currentYear))) {
            prefix = `${prefix}${currentYear}/`;
          }

          const clientProjectIds = projects.filter(p => p.client_id === selectedClientId).map(p => p.id);
          let maxSeq = (client.initial_seq_number || 1) - 1;

          vehicles.forEach(v => {
            if (clientProjectIds.includes(v.project_id) && v.client_calc_no && v.client_calc_no.startsWith(prefix)) {
              const numPart = parseInt(v.client_calc_no.replace(prefix, ""), 10);
              if (!isNaN(numPart) && numPart > maxSeq) maxSeq = numPart;
            }
          });
          setClientCalcNo(`${prefix}${String(maxSeq + 1).padStart(3, "0")}`);
        } else {
          setClientCalcNo("");
        }
      }, [selectedClientId, clients, projects, vehicles]);

      // Prepínanie partnera v kooperácii pre auto
      const toggleCoopPartnerSelection = (partner) => {
        const exists = selectedCoopPartners.find(p => p.id === partner.id);
        if (exists) {
          setSelectedCoopPartners(selectedCoopPartners.filter(p => p.id !== partner.id));
        } else {
          setSelectedCoopPartners([...selectedCoopPartners, partner]);
        }
      };

      // Správa kooperácií (Odoslanie / Prijatie pozvánky)
      const handleSendCoopInvite = async (e) => {
        e.preventDefault();
        setCoopMsg("");
        const email = newPartnerEmail.trim().toLowerCase();
        if (!email || email === currentUser.email.toLowerCase()) {
          return setCoopMsg("Zadajte platný e-mail kolegu.");
        }

        const { data, error } = await supabase.from("technician_partners").insert([{
          sender_id: currentUser.id,
          recipient_email: email,
          status: "pending"
        }]).select();

        if (error) {
          setCoopMsg("Chyba: " + error.message);
        } else {
          setCoopMsg("Pozvánka bola úspešne odoslaná!");
          setNewPartnerEmail("");
          loadPartnerships();
        }
      };

      const handleAcceptCoopInvite = async (inviteId) => {
        const { error } = await supabase
          .from("technician_partners")
          .update({ status: "accepted", recipient_id: currentUser.id })
          .eq("id", inviteId);

        if (!error) {
          setCoopMsg("Spolupráca bola potvrdená.");
          loadPartnerships();
        } else {
          alert("Chyba: " + error.message);
        }
      };

      // Generátor kategórií (Cat 1: 350 €)
      const handleAddCategoryItem = () => {
        const p = parseFloat(tempCategoryPrice);
        if (isNaN(p) || p <= 0) return alert("Zadajte platnú sumu.");
        if (projectCategoriesList.length >= 10) return alert("Maximum je 10 kategórií.");

        const nextCat = { label: `Cat ${projectCategoriesList.length + 1}`, price: p };
        setProjectCategoriesList([...projectCategoriesList, nextCat]);
        setTempCategoryPrice("");
      };

      const handleRemoveCategoryItem = (idx) => {
        const reindexed = projectCategoriesList.filter((_, i) => i !== idx).map((c, i) => ({ ...c, label: `Cat ${i + 1}` }));
        setProjectCategoriesList(reindexed);
      };

      // Autentifikácia
      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        setAuthError("");

        if (isRegistering) {
          if (authPassword.length < 6) return setAuthError(t.passwordTooShort);
          if (authPassword !== authConfirmPassword) return setAuthError(t.passwordMismatch);

          const roleToAssign = authAccountType === "company" ? authRole : "solo";
          const { error } = await supabase.auth.signUp({
            email: authEmail,
            password: authPassword,
            options: { data: { account_type: authAccountType, role: roleToAssign } }
          });
          if (error) setAuthError(error.message);
        } else {
          const { error } = await supabase.auth.signInWithPassword({ email: authEmail, password: authPassword });
          if (error) setAuthError(error.message);
        }
      };

      const handlePasswordUpdate = async (e) => {
        e.preventDefault();
        setSettingsMsg("");
        if (newAccountPassword.length < 6) return setSettingsMsg("Heslo musí mať aspoň 6 znakov.");

        const { error } = await supabase.auth.updateUser({ password: newAccountPassword });
        if (error) {
          setSettingsMsg("Chyba: " + error.message);
        } else {
          setSettingsMsg(t.passwordUpdated);
          setNewAccountPassword("");
          setTimeout(() => setShowSettingsModal(false), 1500);
        }
      };

      // OCR & Odhad farby
      const handlePhotoCapture = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        if (scanStep === 1) {
          setVinFile(file);
          setVinPreview(URL.createObjectURL(file));
          setIsAnalyzing(true);

          try {
            const extractedVin = sanitizeVin("WVWZZZ3CZWE987654");
            setVin(extractedVin);

            const wmi = extractedVin.substring(0, 3);
            if (WMI_MAP[wmi]) {
              setBrand(WMI_MAP[wmi]);
            }
          } catch (err) {
            console.warn(err);
          } finally {
            setIsAnalyzing(false);
          }
        } else if (scanStep === 2) {
          setRearFile(file);
          setRearPreview(URL.createObjectURL(file));
          setIsAnalyzing(true);

          try {
            setEcv("BL-555YY");
            if (!brand) setBrand("Volkswagen");
            if (!model) setModel("Passat");

            const guessedColor = await detectDominantColor(file, lang);
            if (guessedColor) setColor(guessedColor);
          } catch (err) {
            console.error(err);
          } finally {
            setIsAnalyzing(false);
          }
        } else if (scanStep === 3) {
          setSheetFile(file);
          setSheetPreview(URL.createObjectURL(file));
          setScanStep(0);
        }
      };

      const handleDamagePhotoAdd = (e) => {
        const file = e.target.files[0];
        if (!file || damageFiles.length >= 5) return;
        setDamageFiles([...damageFiles, file]);
      };

      const uploadSingleFile = async (file, path) => {
        const compressedBlob = await compressImage(file);
        const { error } = await supabase.storage.from("vehicle-photos").upload(path, compressedBlob, {
          contentType: "image/jpeg",
          upsert: true
        });
        if (error) throw error;
        const { data } = supabase.storage.from("vehicle-photos").getPublicUrl(path);
        return data.publicUrl;
      };

      // Uloženie vozidla s kooperáciou
      const handleSaveVehicle = async (e) => {
        e.preventDefault();
        if (!selectedProjectId) return alert("Vyberte najprv platného Klienta a Lokáciu.");

        if (!canCloseRecord) {
          return alert("Zákazku nie je možné uzavrieť: Chýba sadzba AW na karte Lokácie. Doplňte sadzbu alebo označte 'Cena neznáma'.");
        }

        setIsUploading(true);
        setUploadStatusText("Komprimujem fotky a ukladám Co-op väzby...");

        try {
          const timestamp = Date.now();
          const uid = currentUser.id;

          let vinUrl = null, rearUrl = null, sheetUrl = null;
          const damageUrls = [];

          if (vinFile) vinUrl = await uploadSingleFile(vinFile, `${uid}/${timestamp}_vin.jpg`);
          if (rearFile) rearUrl = await uploadSingleFile(rearFile, `${uid}/${timestamp}_rear.jpg`);
          if (sheetFile) sheetUrl = await uploadSingleFile(sheetFile, `${uid}/${timestamp}_sheet.jpg`);

          for (let i = 0; i < damageFiles.length; i++) {
            const dUrl = await uploadSingleFile(damageFiles[i], `${uid}/${timestamp}_dmg_${i + 1}.jpg`);
            damageUrls.push(dUrl);
          }

          const currentYear = new Date().getFullYear();
          const techPrefix = (currentUser.email.split("@")[0].substring(0, 4)).toUpperCase();
          const internalRecordNo = `${techPrefix}/${currentYear}/${String(vehicles.length + 1).padStart(3, "0")}`;

          const finalStatus = isPricePending ? "pending_price" : (isAwRateMissing ? "pending_rate" : "completed");

          const newVehicleRecord = {
            project_id: selectedProjectId,
            created_by: currentUser.id,
            internal_record_no: internalRecordNo,
            client_calc_no: clientCalcNo || null,
            price_category: selectedCategoryLabel || null,
            ri_price: Number(riPrice) || 0.00,
            vin: vin || "N/A",
            ecv: hasNoEcv ? "Bez ŠPZ" : (ecv || "N/A"),
            has_no_ecv: hasNoEcv,
            brand: brand || "Neznáma",
            model: model || "Neznámy",
            color: color,
            currency: currency,
            price: isPricePending ? 0 : (Number(price) || 0),
            is_price_pending: isPricePending,
            aw_count: (currentSelectedProject?.pricing_mode === "free" && awCount) ? parseFloat(awCount) : null,
            tech_pdr_percent: effectivePdrPercent,
            tech_ri_percent: effectiveRiPercent,
            note: damageNote.trim() || null,
            note_created_at: damageNote.trim() ? new Date().toISOString() : null,
            photo_vin_url: vinUrl,
            photo_rear_url: rearUrl,
            photo_sheet_url: sheetUrl,
            damage_photos: damageUrls,
            status: finalStatus
          };

          const { data, error } = await supabase.from("vehicles").insert([newVehicleRecord]).select();
          if (error) throw error;
          const insertedVehicle = data[0];

          // Uloženie kooperácií (Vehicle Co-ops)
          const coopInserts = [
            {
              vehicle_id: insertedVehicle.id,
              technician_id: currentUser.id,
              technician_email: currentUser.email,
              split_fraction: coopSplitFraction,
              is_owner: true
            }
          ];

          selectedCoopPartners.forEach(p => {
            if (p.partnerId) {
              coopInserts.push({
                vehicle_id: insertedVehicle.id,
                technician_id: p.partnerId,
                technician_email: p.partnerEmail,
                split_fraction: coopSplitFraction,
                is_owner: false
              });
            }
          });

          await supabase.from("vehicle_coops").insert(coopInserts);

          setVehicles([insertedVehicle, ...vehicles]);
          alert("Vozidlo a kooperácia boli úspešne zaevidované!");

          setVin("");
          setEcv("");
          setBrand("");
          setModel("");
          if (currentSelectedProject?.pricing_mode === "free") setPrice("");
          setAwCount("");
          setRiPrice("");
          setIsPricePending(false);
          setDamageNote("");
          setVinFile(null);
          setRearFile(null);
          setSheetFile(null);
          setDamageFiles([]);
          setVinPreview(null);
          setRearPreview(null);
          setSheetPreview(null);
          setSelectedCoopPartners([]);
          loadPartnerships();
        } catch (err) {
          alert("Chyba: " + err.message);
        } finally {
          setIsUploading(false);
          setUploadStatusText("");
        }
      };

      // Spätné doplnenie ceny
      const handleSaveLatePrice = async (vehicleId) => {
        const val = parseFloat(latePriceInput);
        if (isNaN(val) || val <= 0) return alert("Zadajte platnú sumu.");

        const { error } = await supabase.from("vehicles").update({
          price: val,
          is_price_pending: false,
          status: "completed"
        }).eq("id", vehicleId);

        if (!error) {
          setVehicles(vehicles.map(v => v.id === vehicleId ? { ...v, price: val, is_price_pending: false, status: "completed" } : v));
          setSelectedVehicleDetail(prev => prev ? { ...prev, price: val, is_price_pending: false, status: "completed" } : null);
          setLatePriceInput("");
          alert("Cena bola úspešne doplnená.");
        } else {
          alert("Chyba: " + error.message);
        }
      };

      // Bottom Sheet Detail & Plná editácia
      const handleOpenSheet = (type, data) => {
        setActiveBottomSheet({ type, data });
        setSheetEditData({ ...data });
        setIsEditingSheet(false);
      };

      const handleSaveSheetEdit = async () => {
        const isClient = activeBottomSheet.type === "client";
        const table = isClient ? "clients" : "projects";

        const { error } = await supabase.from(table).update(sheetEditData).eq("id", sheetEditData.id);
        if (!error) {
          if (isClient) {
            setClients(clients.map(c => c.id === sheetEditData.id ? sheetEditData : c));
          } else {
            setProjects(projects.map(p => p.id === sheetEditData.id ? sheetEditData : p));
          }
          setActiveBottomSheet({ type: activeBottomSheet.type, data: sheetEditData });
          setIsEditingSheet(false);
          alert("Údaje boli úspešne upravené.");
        } else {
          alert("Chyba: " + error.message);
        }
      };

      const handleToggleArchiveProject = async (pId, currentStatus) => {
        const nextStatus = !currentStatus;
        const msg = nextStatus ? "Obnoviť túto lokáciu do aktívnych?" : "Archivovať túto lokáciu? Zmizne z ponuky pri skenovaní, no autá v histórii zostanú.";
        if (!confirm(msg)) return;

        const { error } = await supabase.from("projects").update({ is_active: nextStatus }).eq("id", pId);
        if (!error) {
          setProjects(projects.map(p => p.id === pId ? { ...p, is_active: nextStatus } : p));
        } else {
          alert("Chyba: " + error.message);
        }
      };

      // Filtrovaný súpis vozidiel s podporou kooperácie
      const reportVehicles = useMemo(() => {
        return vehicles.filter(v => {
          // Vidím auto, ak som ho vytvoril, ALEBO ak na ňom mám Co-op väzbu
          const isCreator = v.created_by === currentUser.id;
          const isCoopMember = coopRecords.some(c => c.vehicle_id === v.id && c.technician_id === currentUser.id);
          if (!isCreator && !isCoopMember) return false;

          if (repClientFilter !== "all") {
            const project = projects.find(p => p.id === v.project_id);
            if (!project || project.client_id !== repClientFilter) return false;
          }
          if (repProjectFilter !== "all" && v.project_id !== repProjectFilter) return false;

          if (repDateRange === "week") {
            const d = new Date(); d.setDate(d.getDate() - 7);
            if (new Date(v.created_at) < d) return false;
          } else if (repDateRange === "month") {
            const d = new Date(); d.setDate(d.getDate() - 30);
            if (new Date(v.created_at) < d) return false;
          }

          if (repSearchQuery.trim()) {
            const q = repSearchQuery.toLowerCase();
            return (
              (v.client_calc_no && v.client_calc_no.toLowerCase().includes(q)) ||
              (v.vin && v.vin.toLowerCase().includes(q)) ||
              (v.ecv && v.ecv.toLowerCase().includes(q)) ||
              (v.brand && v.brand.toLowerCase().includes(q)) ||
              (v.model && v.model.toLowerCase().includes(q))
            );
          }
          return true;
        });
      }, [vehicles, projects, repClientFilter, repProjectFilter, repDateRange, repSearchQuery, coopRecords, currentUser]);

      const reportTotals = useMemo(() => {
        let pdrTotal = 0, riTotal = 0, techTotal = 0;
        reportVehicles.forEach(v => {
          const p = Number(v.price) || 0;
          const r = Number(v.ri_price) || 0;
          pdrTotal += p;
          riTotal += r;

          // Výpočet provízie s rešpektovaním alikvotného podielu (Split)
          const myCoop = coopRecords.find(c => c.vehicle_id === v.id && c.technician_id === currentUser.id);
          const fraction = myCoop ? Number(myCoop.split_fraction) : 1;

          techTotal += (p * ((v.tech_pdr_percent ?? 100) / 100) * fraction) + (r * ((v.tech_ri_percent ?? 100) / 100) * fraction);
        });
        return {
          count: reportVehicles.length,
          pdr: pdrTotal.toFixed(2),
          ri: riTotal.toFixed(2),
          gross: (pdrTotal + riTotal).toFixed(2),
          tech: techTotal.toFixed(2)
        };
      }, [reportVehicles, coopRecords, currentUser]);

      const exportCSV = () => {
        if (reportVehicles.length === 0) return alert("Žiadne vozidlá na export.");

        const headers = ["Dátum", "Interné číslo", "Číslo kalkulácie", "VIN", "ŠPZ", "Značka a Model", "AW / Kategória", "R&I", "PDR", "Spolu", "Môj podiel", "Poznámka"];
        const rows = reportVehicles.map(v => {
          const myCoop = coopRecords.find(c => c.vehicle_id === v.id && c.technician_id === currentUser.id);
          const fraction = myCoop ? Number(myCoop.split_fraction) : 1;
          const myEarned = (((Number(v.price) * (v.tech_pdr_percent/100)) + (Number(v.ri_price || 0) * (v.tech_ri_percent/100))) * fraction).toFixed(2);

          return [
            new Date(v.created_at).toLocaleDateString(),
            v.internal_record_no || "",
            v.client_calc_no || "",
            v.vin || "",
            v.ecv || "",
            `${v.brand} ${v.model}`,
            v.aw_count ? `${v.aw_count} AW` : (v.price_category || ""),
            v.ri_price || 0,
            v.price || 0,
            (Number(v.price) + Number(v.ri_price || 0)).toFixed(2),
            `${myEarned} ${currSymbol}`,
            `"${(v.note || "").replace(/"/g, '""')}"`
          ];
        });

        const csvContent = "\uFEFF" + [headers.join(";"), ...rows.map(r => r.join(";"))].join("\n");
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `PDR_Supis_${new Date().toISOString().slice(0, 10)}.csv`;
        link.click();
      };

      const exportPDF = () => {
        if (reportVehicles.length === 0) return alert("Žiadne vozidlá na export.");

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF("landscape", "mm", "a4");

        const clientObj = clients.find(c => c.id === repClientFilter);
        const projectObj = projects.find(p => p.id === repProjectFilter);
        const clientName = clientObj ? clientObj.name : "Všetci klienti";
        const locationName = projectObj ? projectObj.name : "Všetky lokácie";

        doc.setFontSize(15);
        doc.setTextColor(30, 41, 59);
        doc.text("PDR Súpis prác & Kooperácií (Príloha k vyúčtovaniu)", 14, 15);

        doc.setFontSize(9);
        doc.setTextColor(100, 116, 139);
        doc.text(`Klient: ${clientName} | Lokácia: ${locationName} | Technik: ${currentUser.email} | Vygenerované: ${new Date().toLocaleDateString()}`, 14, 21);
        doc.text(`Vozidlá: ${reportTotals.count} ks | Objem spolu: ${reportTotals.gross} ${currSymbol} | Môj čistý podiel: ${reportTotals.tech} ${currSymbol}`, 14, 26);

        const tableRows = reportVehicles.map((v, index) => {
          const myCoop = coopRecords.find(c => c.vehicle_id === v.id && c.technician_id === currentUser.id);
          const fraction = myCoop ? Number(myCoop.split_fraction) : 1;
          const myEarned = (((Number(v.price) * (v.tech_pdr_percent/100)) + (Number(v.ri_price || 0) * (v.tech_ri_percent/100))) * fraction).toFixed(2);
          const coopBadge = fraction < 1 ? ` (Co-op ${Math.round(fraction*100)}%)` : "";

          return [
            index + 1,
            v.client_calc_no || "-",
            v.internal_record_no || "-",
            v.vin || "-",
            v.ecv || "-",
            `${v.brand} ${v.model}`,
            v.aw_count ? `${v.aw_count} AW` : (v.price_category || "-"),
            `${Number(v.ri_price || 0).toFixed(2)} ${currSymbol}`,
            `${Number(v.price || 0).toFixed(2)} ${currSymbol}`,
            `${myEarned} ${currSymbol}${coopBadge}`
          ];
        });

          startY: 30,
          head: [["#", "Kalkulácia klienta", "Interné č.", "VIN", "ŠPZ", "Vozidlo", "AW / Kat", `R&I (${currSymbol})`, `PDR (${currSymbol})`, `Môj podiel (${currSymbol})`]],

                        title="Odfotiť alebo vybrať vizitku z galérie"
                      >
                        <i className="fa-solid fa-camera text-xs"></i>
                      </button>
                      <button type="button" onClick={() => setShowNewClientForm(false)} className="text-gray-400 hover:text-white">
                        <i className="fa-solid fa-xmark"></i>
                      </button>
                    </div>
                  </div>

                  <input type="text" value={newClientName} onChange={e => setNewClientName(e.target.value)} placeholder="Názov firmy" className="w-full bg-gray-900 border border-gray-600 rounded p-1.5 text-xs text-white font-bold" required />
                  <input type="text" value={newClientAddress} onChange={e => setNewClientAddress(e.target.value)} placeholder="Sídlo / Fakturačná adresa" className="w-full bg-gray-900 border border-gray-700 rounded p-1.5 text-xs text-gray-200" />
                  
                  <div className="grid grid-cols-2 gap-2">
                    <input type="text" value={newClientContactPerson} onChange={e => setNewClientContactPerson(e.target.value)} placeholder="Meno kontaktu" className="bg-gray-900 border border-gray-700 rounded p-1.5 text-xs text-gray-200" />
                    <input type="text" value={newClientPhone} onChange={e => setNewClientPhone(e.target.value)} placeholder="Telefón" className="bg-gray-900 border border-gray-700 rounded p-1.5 text-xs text-gray-200" />
                  </div>
                  <input type="text" value={newClientIco} onChange={e => setNewClientIco(e.target.value)} placeholder="IČO / UID (voliteľné)" className="w-full bg-gray-900 border border-gray-700 rounded p-1.5 text-xs text-gray-200" />

                  <div className="grid grid-cols-2 gap-2 pt-1 border-t border-gray-700">
                    <div>
                      <label className="text-[9px] text-gray-400">Predvolené % PDR</label>
                      <input type="number" inputMode="decimal" value={newClientDefaultPdr} onChange={e => setNewClientDefaultPdr(e.target.value)} placeholder="Predvolené (100)" className="w-full bg-gray-900 border border-gray-700 rounded p-1 text-xs text-amber-400 font-bold" />
                    </div>
                    <div>
                      <label className="text-[9px] text-gray-400">Predvolené % R&I</label>
                      <input type="number" inputMode="decimal" value={newClientDefaultRi} onChange={e => setNewClientDefaultRi(e.target.value)} placeholder="Predvolené (100)" className="w-full bg-gray-900 border border-gray-700 rounded p-1 text-xs text-amber-400 font-bold" />
                    </div>
                  </div>

                  <div className="pt-1 border-t border-gray-700 space-y-1.5">
                    <label className="text-[10px] text-gray-300 font-bold flex items-center gap-1.5 cursor-pointer">
                      <input type="checkbox" checked={hasSeqConfig} onChange={e => setHasSeqConfig(e.target.checked)} />
                      <span>Preddefinovaná číselná rada kalkulácie</span>
                    </label>

                    {hasSeqConfig && (
                      <div className="grid grid-cols-2 gap-2 bg-gray-950 p-2 rounded border border-gray-700">
                        <div>
                          <span className="text-[8px] text-gray-400 uppercase">Fixná časť (Maska)</span>
                          <input type="text" value={newClientSeqPrefix} onChange={e => setNewClientSeqPrefix(e.target.value)} placeholder="Napr. DNK/{ROK}/" className="w-full bg-gray-900 border border-gray-600 rounded p-1 text-xs text-amber-300 font-mono" />
                        </div>
                        <div>
                          <span className="text-[8px] text-gray-400 uppercase">Pohyblivá časť (Štart)</span>
                          <input type="number" inputMode="decimal" value={newClientInitialSeq} onChange={e => setNewClientInitialSeq(e.target.value)} placeholder="1" className="w-full bg-gray-900 border border-gray-600 rounded p-1 text-xs text-amber-300 font-mono" />
                        </div>
                      </div>
                    )}
                  </div>

                  <button type="submit" className="w-full bg-amber-500 text-black font-extrabold py-2 rounded text-xs shadow">Uložiť klienta</button>
                </form>
              )}

              <div className="flex justify-end px-1">
                <button onClick={() => setShowArchivedProjects(!showArchivedProjects)} className="text-[10px] text-amber-400 font-bold underline">
                  {showArchivedProjects ? "Skryť archivované lokácie" : "Zobraziť archivované lokácie"}
                </button>
              </div>

              {/* ZOZNAM KLIENTOV A ICH LOKÁCIÍ */}
              <div className="space-y-2.5">
                {clients.map(c => {
                  const clientProjects = projects.filter(p => p.client_id === c.id && (showArchivedProjects ? true : p.is_active !== false));
                  const isOpen = selectedClientDetailId === c.id;

                  const filteredLocations = clientProjects.filter(p => {
                    if (!locationSearchFilter.trim()) return true;
                    const f = locationSearchFilter.toLowerCase();
                    return (
                      (p.name && p.name.toLowerCase().includes(f)) || 
                      (p.address && p.address.toLowerCase().includes(f)) ||
                      (p.postal_code && p.postal_code.toLowerCase().includes(f))
                    );
                  });

                  return (
                    <div key={c.id} className="bg-gray-800 rounded-xl border border-gray-700 overflow-hidden">
                      <div onClick={() => setSelectedClientDetailId(isOpen ? null : c.id)} className="p-3 flex justify-between items-center cursor-pointer hover:bg-gray-750">
                        <div>
                          <div className="flex items-center gap-2">
                            <h4 className="font-extrabold text-white text-sm">{c.name}</h4>
                            {c.fixed_seq_prefix && <span className="text-[9px] bg-amber-500/20 text-amber-300 px-1 py-0.5 rounded font-mono font-bold">{c.fixed_seq_prefix}</span>}
                          </div>
                          <p className="text-[10px] text-gray-400 mt-0.5">{clientProjects.length} lokácií</p>
                        </div>
                        <div className="flex items-center gap-2">
                          <button type="button" onClick={(e) => { e.stopPropagation(); handleOpenSheet("client", c); }} className="text-xs px-2 py-1 rounded border bg-gray-900 text-amber-400 border-gray-700 font-bold">
                            <i className="fa-solid fa-address-card"></i>
                          </button>
                          <i className={`fa-solid ${isOpen ? "fa-chevron-up" : "fa-chevron-down"} text-xs text-gray-400`}></i>
                        </div>
                      </div>

                      {isOpen && (
                        <div className="p-3 bg-gray-900/70 border-t border-gray-700 space-y-2.5">
                          <div className="flex justify-between items-center gap-2">
                            <input type="text" value={locationSearchFilter} onChange={e => setLocationSearchFilter(e.target.value)} placeholder={t.searchLocationsPlaceholder} className="flex-1 bg-gray-950 border border-gray-700 rounded-lg px-2.5 py-1 text-xs text-white" />
                            <button onClick={() => { setAddingProjectClientId(addingProjectClientId === c.id ? null : c.id); setProjectCategoriesList([]); }} className="bg-amber-500 hover:bg-amber-400 text-black font-extrabold px-2.5 py-1 rounded-lg text-xs shadow whitespace-nowrap">
                              + Lokácia
                            </button>
                          </div>

                          {/* FORMULÁR PRIDANIA LOKÁCIE */}
                          {addingProjectClientId === c.id && (
                            <div className="bg-gray-950 p-2.5 rounded-xl border border-amber-500/50 space-y-2">
                              <div className="flex justify-between items-center">
                                <span className="text-xs font-bold text-amber-400 uppercase">Nová Lokácia</span>
                                <button 
                                  type="button" 
                                  onClick={() => { if (locationCardInputRef.current) locationCardInputRef.current.click(); }} 
                                  className="w-6 h-6 bg-gray-900 border border-amber-500/50 text-amber-400 rounded flex items-center justify-center"
                                  title="Skenovať vizitku lokácie"
                                >
                                  <i className="fa-solid fa-camera text-[10px]"></i>
                                </button>
                              </div>

                              <input type="text" value={newProjectName} onChange={e => setNewProjectName(e.target.value)} placeholder="Názov lokácie (napr. Dielňa Opel Denk)" className="w-full bg-gray-900 border border-gray-700 rounded p-1 text-xs text-white font-bold" />
                              
                              <div className="grid grid-cols-3 gap-1.5">
                                <input type="text" value={newProjectAddress} onChange={e => setNewProjectAddress(e.target.value)} placeholder="Ulica a číslo" className="col-span-2 bg-gray-900 border border-gray-700 rounded p-1 text-xs text-gray-200" />
                                <input type="text" value={newProjectPostalCode} onChange={e => setNewProjectPostalCode(e.target.value)} placeholder="PSČ" className="bg-gray-900 border border-gray-700 rounded p-1 text-xs text-gray-200 uppercase" />
                              </div>

                              <div className="grid grid-cols-2 gap-1.5">
                                <input type="text" value={newProjectContactPerson} onChange={e => setNewProjectContactPerson(e.target.value)} placeholder="Vedúci / Kontakt" className="bg-gray-900 border border-gray-700 rounded p-1 text-xs text-gray-200" />
                                <input type="text" value={newProjectPhone} onChange={e => setNewProjectPhone(e.target.value)} placeholder="Telefón" className="bg-gray-900 border border-gray-700 rounded p-1 text-xs text-gray-200" />
                              </div>

                              <div className="grid grid-cols-3 gap-1 pt-1">
                                {["free", "fixed", "categories"].map(mode => (
                                  <button key={mode} type="button" onClick={() => setNewProjectPricingMode(mode)} className={`py-1 text-[9px] font-bold rounded uppercase border ${newProjectPricingMode === mode ? "bg-amber-500 text-black border-amber-400" : "bg-gray-900 text-gray-300 border-gray-700"}`}>
                                    {mode}
                                  </button>
                                ))}
                              </div>

                              {newProjectPricingMode === "fixed" && (
                                <input type="number" inputMode="decimal" value={newProjectFixedPrice} onChange={e => setNewProjectFixedPrice(e.target.value)} placeholder={`Fixná sadzba (${currSymbol})`} className="w-full bg-gray-900 border border-gray-700 rounded p-1 text-xs text-amber-300 font-bold" />
                              )}

                              {newProjectPricingMode === "categories" && (
                                <div className="p-2 bg-gray-900 rounded border border-gray-700 space-y-2">
                                  <div className="flex gap-1.5">
                                    <input 
                                      type="number" 
                                      inputMode="decimal"
                                      value={tempCategoryPrice} 
                                      onChange={e => setTempCategoryPrice(e.target.value)} 
                                      placeholder={`Suma pre Cat ${projectCategoriesList.length + 1} (${currSymbol})`}
                                      className="flex-1 bg-gray-950 border border-amber-500/50 rounded p-1 text-xs text-amber-400 font-bold"
                                    />
                                    <button type="button" onClick={handleAddCategoryItem} className="bg-amber-500 text-black font-extrabold px-3 py-1 text-xs rounded shadow">
                                      + Pridať Cat
                                    </button>
                                  </div>

                                  <div className="flex flex-wrap gap-1">
                                    {projectCategoriesList.map((cat, i) => (
                                      <span key={i} className="inline-flex items-center gap-1 bg-gray-950 border border-amber-500/40 text-amber-300 px-2 py-0.5 rounded text-[10px] font-bold">
                                        {cat.label}: {cat.price} {currSymbol}
                                        <button type="button" onClick={() => handleRemoveCategoryItem(i)} className="text-red-400 hover:text-red-200 ml-1">×</button>
                                      </span>
                                    ))}
                                  </div>
                                </div>
                              )}

                              <div className="grid grid-cols-2 gap-1.5 pt-1 border-t border-gray-800">
                                <div>
                                  <label className="text-[8px] text-gray-400 uppercase">% PDR (Lokácia)</label>
                                  <input type="number" inputMode="decimal" value={newProjectTechPdrPercent} onChange={e => setNewProjectTechPdrPercent(e.target.value)} placeholder={c.default_pdr_percent ? `Dedené: ${c.default_pdr_percent}%` : "100"} className="w-full bg-gray-900 border border-gray-700 rounded p-1 text-xs text-amber-400 font-bold" />
                                </div>
                                <div>
                                  <label className="text-[8px] text-gray-400 uppercase">% R&I (Lokácia)</label>
                                  <input type="number" inputMode="decimal" value={newProjectTechRiPercent} onChange={e => setNewProjectTechRiPercent(e.target.value)} placeholder={c.default_ri_percent ? `Dedené: ${c.default_ri_percent}%` : "100"} className="w-full bg-gray-900 border border-gray-700 rounded p-1 text-xs text-amber-400 font-bold" />
                                </div>
                              </div>

                              <input type="number" inputMode="decimal" value={newProjectAwRate} onChange={e => setNewProjectAwRate(e.target.value)} placeholder={`Sadzba AW (${currSymbol})`} className="w-full bg-gray-900 border border-gray-700 rounded p-1 text-xs text-amber-400 font-bold" />

                              <button type="button" onClick={async () => {
                                if (!newProjectName.trim()) return;
                                const { data, error } = await supabase.from("projects").insert([{ 
                                  client_id: c.id, 
                                  name: newProjectName.trim(), 
                                  address: newProjectAddress.trim() || null,
                                  postal_code: newProjectPostalCode.trim() || null,
                                  contact_person: newProjectContactPerson.trim() || null,
                                  phone: newProjectPhone.trim() || null,
                                  pricing_mode: newProjectPricingMode,
                                  fixed_price: newProjectPricingMode === "fixed" ? Number(newProjectFixedPrice) || 0 : null,
                                  pricing_categories: newProjectPricingMode === "categories" ? projectCategoriesList : null,
                                  tech_pdr_percent: newProjectTechPdrPercent !== "" ? parseFloat(newProjectTechPdrPercent) : null,
                                  tech_ri_percent: newProjectTechRiPercent !== "" ? parseFloat(newProjectTechRiPercent) : null,
                                  aw_rate: newProjectAwRate ? parseFloat(newProjectAwRate) : null,
                                  is_active: true,
                                  created_by: currentUser.id 
                                }]).select();

                                if (!error && data) {
                                  setProjects([...projects, data[0]]);
                                  handleProjectChange(data[0].id);
                                  setNewProjectName("");
                                  setNewProjectAddress("");
                                  setNewProjectPostalCode("");
                                  setNewProjectContactPerson("");
                                  setNewProjectPhone("");
                                  setProjectCategoriesList([]);
                                  setAddingProjectClientId(null);
                                }
                              }} className="w-full bg-amber-500 text-black font-extrabold py-1.5 text-xs rounded">Uložiť lokáciu</button>
                            </div>
                          )}

                          <div className="space-y-1">
                            {filteredLocations.map(p => (
                              <div key={p.id} className="text-xs p-2 rounded border bg-gray-950 border-gray-800 flex justify-between items-center">
                                <div>
                                  <div className="flex items-center gap-1.5">
                                    <span className="font-bold text-white">{p.name}</span>
                                    <span className="text-[8px] uppercase bg-gray-800 text-amber-400 px-1 rounded font-bold">{p.pricing_mode}</span>
                                  </div>
                                  {p.address && <p className="text-[9px] text-gray-400">{p.address} {p.postal_code ? `(${p.postal_code})` : ""}</p>}
                                </div>
                                <div className="flex items-center gap-1.5">
                                  <button type="button" onClick={() => handleOpenSheet("project", p)} className="text-[10px] px-2 py-1 bg-gray-900 border border-gray-700 rounded text-amber-400 font-bold">
                                    Detail / Edit
                                  </button>
                                  <button 
                                    type="button" 
                                    onClick={() => handleToggleArchiveProject(p.id, p.is_active !== false)}
                                    className={`text-[9px] px-2 py-1 rounded font-bold border ${p.is_active === false ? "bg-gray-800 text-green-400 border-green-600/50" : "bg-gray-900 text-red-400 border-red-500/40"}`}
                                  >
                                    {p.is_active === false ? "Obnoviť" : "Archivovať"}
                                  </button>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          ) : (
            /* 3. KARTA: REGISTER & REPORTS */
            <div className="space-y-3">
              <div className="bg-gray-800 p-2.5 rounded-xl border border-gray-700 space-y-2">
                <input 
                  type="text" 
                  value={repSearchQuery} 
                  onChange={e => setRepSearchQuery(e.target.value)} 
                  placeholder={t.searchPlaceholder} 
                  className="w-full bg-gray-900 border border-gray-700 rounded-lg p-1.5 text-xs text-white"
                />

                <div className="grid grid-cols-3 gap-1.5 text-[10px]">
                  <select value={repClientFilter} onChange={e => { setRepClientFilter(e.target.value); setRepProjectFilter("all"); }} className="bg-gray-900 border border-gray-700 rounded p-1 text-white">
                    <option value="all">Všetci klienti</option>
                    {clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                  </select>

                  <select value={repProjectFilter} onChange={e => setRepProjectFilter(e.target.value)} className="bg-gray-900 border border-gray-700 rounded p-1 text-amber-400">
                    <option value="all">Všetky lokácie</option>
                    {projects.filter(p => repClientFilter === "all" || p.client_id === repClientFilter).map(p => (
                      <option key={p.id} value={p.id}>{p.name}</option>
                    ))}
                  </select>

                  <select value={repDateRange} onChange={e => setRepDateRange(e.target.value)} className="bg-gray-900 border border-gray-700 rounded p-1 text-white">
                    <option value="all">Všetky dátumy</option>
                    <option value="month">Posledných 30 dní</option>
                    <option value="week">Posledných 7 dní</option>
                  </select>
                </div>
              </div>

              {/* SÚČTOVÉ KARTY */}
              <div className="grid grid-cols-3 gap-1.5 text-center">
                <div className="bg-gray-800 p-2 rounded-xl border border-gray-700">
                  <span className="text-[9px] text-gray-400 uppercase font-bold">Vozidlá</span>
                  <p className="text-sm font-black text-white">{reportTotals.count} ks</p>
                </div>
                <div className="bg-gray-800 p-2 rounded-xl border border-gray-700">
                  <span className="text-[9px] text-gray-400 uppercase font-bold">Fakturované</span>
                  <p className="text-sm font-black text-amber-400">{reportTotals.gross} {currSymbol}</p>
                </div>
                <div className="bg-gray-800 p-2 rounded-xl border border-amber-500/40 bg-amber-500/10">
                  <span className="text-[9px] text-amber-300 uppercase font-bold">Môj podiel</span>
                  <p className="text-sm font-black text-amber-400">~{reportTotals.tech} {currSymbol}</p>
                </div>
              </div>

              {/* EXPORT TLAČIDLÁ */}
              <div className="flex gap-2">
                <button onClick={exportPDF} className="flex-1 bg-amber-500 hover:bg-amber-400 text-black font-extrabold py-2 px-3 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow">
                  <i className="fa-solid fa-file-pdf"></i>
                  <span>Stiahnuť PDF súpis (A4)</span>
                </button>
                <button onClick={exportCSV} className="bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-300 font-bold py-2 px-3 rounded-xl text-xs flex items-center justify-center gap-1.5">
                  <i className="fa-solid fa-file-csv"></i>
                  <span>CSV</span>
                </button>
              </div>

              {/* ŽIVÝ ZOZNAM S PÁROVANÍM A CO-OP BADGE */}
              <div className="space-y-1.5">
                {reportVehicles.length === 0 ? (
                  <p className="p-6 text-center text-xs text-gray-500">{t.noVehicles}</p>
                ) : (
                  reportVehicles.map(v => {
                    const myCoop = coopRecords.find(c => c.vehicle_id === v.id && c.technician_id === currentUser.id);
                    const fraction = myCoop ? Number(myCoop.split_fraction) : 1;
                    const isOwner = v.created_by === currentUser.id;

                    return (
                      <div key={v.id} onClick={() => { setSelectedVehicleDetail(v); setLatePriceInput(""); }} className="bg-gray-800 p-2.5 rounded-xl border border-gray-700 flex justify-between items-center cursor-pointer hover:border-amber-500/50">
                        <div>
                          <div className="flex items-center gap-1.5">
                            <span className="text-xs font-bold text-amber-400 font-mono">{v.client_calc_no || "Bez kalkulácie"}</span>
                            <span className="text-xs font-bold text-white">{v.brand} {v.model}</span>
                            {fraction < 1 && (
                              <span className="text-[8px] bg-amber-500/20 text-amber-300 border border-amber-500/40 px-1 py-0.2 rounded font-black flex items-center gap-0.5">
                                <i className="fa-solid fa-handshake text-[8px]"></i>
                                <span>Co-Op {Math.round(fraction*100)}%</span>
                              </span>
                            )}
                          </div>
                          <p className="text-[9px] text-gray-400 font-mono">
                            VIN: {v.vin} | {v.ecv}
                            {!isOwner && <span className="ml-1 text-gray-500 font-normal">(Partner)</span>}
                          </p>
                        </div>
                        <div className="text-right">
                          {v.is_price_pending ? (
                            <span className="text-[10px] bg-yellow-500/20 text-yellow-300 font-bold px-2 py-0.5 rounded border border-yellow-500/30">
                              {v.aw_count ? `${v.aw_count} AW` : "Cena neznáma"}
                            </span>
                          ) : (
                            <div>
                              <span className="text-xs bg-amber-500/20 text-amber-300 font-bold px-2 py-0.5 rounded">
                                {(Number(v.price) + Number(v.ri_price || 0)).toFixed(2)} {currSymbol}
                              </span>
                              <p className="text-[8px] text-gray-400 mt-0.5">
                                Podiel: ~{((((Number(v.price) * (v.tech_pdr_percent/100)) + (Number(v.ri_price || 0) * (v.tech_ri_percent/100))) * fraction)).toFixed(2)} {currSymbol}
                              </p>
                            </div>
                          )}
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
