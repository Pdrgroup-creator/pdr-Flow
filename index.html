<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DentFlow PDR Pro</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const COLOR_OPTIONS = ["Biela", "Čierna", "Sivá / Strieborná", "Modrá", "Červená", "Zelená", "Hnedá / Bronz"];

    const TRANSLATIONS = {
      SK: {
        title: "DentFlow PDR",
        subtitle: "SaaS Inspektor & Cenníky",
        tabOrders: "Zákazky",
        tabClients: "Zákazníci",
        scanBtn: "Scan Car",
        step1Label: "1. Odfotiť VIN kód",
        step2Label: "2. Odfotiť auto zozadu",
        clientLabel: "Zákazník (Firma)",
        projectLabel: "Zákazka / Park / Miesto",
        ecv: "ŠPZ / EČV",
        vin: "VIN kód (Skontrolujte/Opravte)",
        brand: "Značka",
        model: "Model",
        color: "Farba karosérie",
        priceLabel: "Cena opravy",
        unknownPrice: "Neznáma (0.00)",
        saveOrder: "Uložiť zákazku",
        addClientBtn: "+ Nový zákazník",
        newClientTitle: "Vytvoriť Kartu Zákazníka",
        clientName: "Názov firmy / Meno",
        ico: "IČO / DIČ",
        phone: "Telefón",
        email: "E-mail",
        saveClient: "Uložiť zákazníka",
        myClients: "Moje klientske karty",
        noEcvNotice: "Bez ŠPZ / Nové vozidlo"
      },
      DE: {
        title: "DentFlow PDR",
        subtitle: "SaaS Inspektor & Preislisten",
        tabOrders: "Aufträge",
        tabClients: "Kunden",
        scanBtn: "Scan Car",
        step1Label: "1. FIN fotografieren",
        step2Label: "2. Heckfoto aufnehmen",
        clientLabel: "Kunde (Firma)",
        projectLabel: "Auftrag / Park / Standort",
        ecv: "Kennzeichen",
        vin: "FIN / Fahrgestellnr.",
        brand: "Marke",
        model: "Modell",
        color: "Fahrzeugfarbe",
        priceLabel: "Reparaturpreis",
        unknownPrice: "Unbekannt (0.00)",
        saveOrder: "Auftrag speichern",
        addClientBtn: "+ Neuer Kunde",
        newClientTitle: "Kundenkarte erstellen",
        clientName: "Firmenname / Name",
        ico: "Steuer-ID",
        phone: "Telefon",
        email: "E-Mail",
        saveClient: "Kunde speichern",
        myClients: "Meine Kundenkartei",
        noEcvNotice: "Ohne Kennzeichen / Neufahrzeug"
      },
      EN: {
        title: "DentFlow PDR",
        subtitle: "SaaS Inspector & Pricing",
        tabOrders: "Orders",
        tabClients: "Clients",
        scanBtn: "Scan Car",
        step1Label: "1. Capture VIN Code",
        step2Label: "2. Capture Rear Vehicle Photo",
        clientLabel: "Client (Company)",
        projectLabel: "Job / Location / Project",
        ecv: "License Plate",
        vin: "VIN Number",
        brand: "Make",
        model: "Model",
        color: "Body Color",
        priceLabel: "Repair Price",
        unknownPrice: "Unknown (0.00)",
        saveOrder: "Save Order",
        addClientBtn: "+ New Client",
        newClientTitle: "Create Client Card",
        clientName: "Company Name / Person",
        ico: "Tax ID",
        phone: "Phone",
        email: "E-mail",
        saveClient: "Save Client",
        myClients: "My Client Cards",
        noEcvNotice: "No Plate / New Vehicle"
      }
    };

    function App() {
      const [lang, setLang] = useState("SK");
      const [activeTab, setActiveTab] = useState("orders");
      const t = TRANSLATIONS[lang];

      const cameraInputRef = useRef(null);

      const [scanStep, setScanStep] = useState(0);
      const [vinPhoto, setVinPhoto] = useState(null);
      const [rearPhoto, setRearPhoto] = useState(null);
      const [isAnalyzing, setIsAnalyzing] = useState(false);

      // Klientske karty a ich zákazky (projekty s cenníkmi)
      const [clientsData, setClientsData] = useState([
        {
          id: 1,
          name: "KHS Global",
          ico: "12345678",
          phone: "+421 905 111 222",
          email: "flota@khs.com",
          projects: [
            {
              id: 101,
              name: "Mníchov Logistický Park",
              priceType: "categories",
              categories: [
                { label: "Malé poškodenie", price: 150 },
                { label: "Stredné poškodenie", price: 320 },
                { label: "Veľké / Strecha", price: 650 }
              ]
            },
            {
              id: 102,
              name: "Trnava - Sklad Autohaus",
              priceType: "fixed",
              fixedPrice: 200
            }
          ]
        },
        {
          id: 2,
          name: "Bežné Autoservisy / Súkromní",
          ico: "87654321",
          phone: "+421 903 333 444",
          email: "info@dielna.sk",
          projects: [
            {
              id: 201,
              name: "Bežná oprava v teréne",
              priceType: "open"
            }
          ]
        }
      ]);

      const [selectedClientId, setSelectedClientId] = useState(1);
      const [selectedProjectId, setSelectedProjectId] = useState(101);
      const [defaultProjectId, setDefaultProjectId] = useState(101);

      const [showNewClientForm, setShowNewClientForm] = useState(false);
      const [newClientData, setNewClientData] = useState({ name: "", ico: "", phone: "", email: "" });

      const [ecv, setEcv] = useState("");
      const [vin, setVin] = useState("");
      const [brand, setBrand] = useState("");
      const [model, setModel] = useState("");
      const [color, setColor] = useState("Sivá / Strieborná");
      const [hasNoEcv, setHasNoEcv] = useState(false);

      const [selectedCategoryPrice, setSelectedCategoryPrice] = useState(null);
      const [isUnknownPrice, setIsUnknownPrice] = useState(true);
      const [customPrice, setCustomPrice] = useState("");

      const currentClient = useMemo(() => clientsData.find(c => c.id === Number(selectedClientId)), [clientsData, selectedClientId]);
      const currentProject = useMemo(() => currentClient?.projects.find(p => p.id === Number(selectedProjectId)), [currentClient, selectedProjectId]);

      useEffect(() => {
        if (currentProject) {
          if (currentProject.priceType === 'categories' && currentProject.categories.length > 0) {
            setSelectedCategoryPrice(currentProject.categories[0].price);
          } else if (currentProject.priceType === 'fixed') {
            setSelectedCategoryPrice(currentProject.fixedPrice);
          } else {
            setIsUnknownPrice(true);
            setCustomPrice("");
          }
        }
      }, [selectedProjectId, currentProject]);

      const startScanning = () => {
        setScanStep(1);
        triggerCamera();
      };

      const triggerCamera = () => {
        if (cameraInputRef.current) {
          cameraInputRef.current.click();
        }
      };

      const handlePhotoCapture = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const photoUrl = URL.createObjectURL(file);

        if (scanStep === 1) {
          setVinPhoto(photoUrl);
          setIsAnalyzing(true);
          
          setTimeout(() => {
            setVin("WVWZZZ3CZWE987654");
            setIsAnalyzing(false);
          }, 1000);

        } else if (scanStep === 2) {
          setRearPhoto(photoUrl);
          setIsAnalyzing(true);

          setTimeout(() => {
            setEcv("BL-555YY");
            setBrand("Volkswagen");
            setModel("Passat Variant");
            setIsAnalyzing(false);
            setScanStep(0);
          }, 1200);
        }
      };

      const handleAddClient = (e) => {
        e.preventDefault();
        if (!newClientData.name) return;
        const newClient = {
          id: Date.now(),
          ...newClientData,
          projects: [{ id: Date.now() + 1, name: "Všeobecná zákazka", priceType: "open" }]
        };
        setClientsData([...clientsData, newClient]);
        setSelectedClientId(newClient.id);
        setSelectedProjectId(newClient.projects[0].id);
        setNewClientData({ name: "", ico: "", phone: "", email: "" });
        setShowNewClientForm(false);
        setActiveTab("orders");
      };

      return (
        <div className="max-w-md mx-auto p-4 pb-24">
          <input 
            type="file" 
            accept="image/*" 
            capture="environment" 
            ref={cameraInputRef} 
            onChange={handlePhotoCapture} 
            className="hidden" 
          />

          <header className="flex justify-between items-center mb-4 border-b border-gray-700 pb-3">
            <div>
              <h1 className="text-xl font-bold text-amber-500">{t.title}</h1>
              <p className="text-xs text-gray-400">{t.subtitle}</p>
            </div>
            
            <div className="flex bg-gray-800 border border-gray-600 rounded p-1 gap-1">
              {["SK", "DE", "EN"].map(l => (
                <button
                  key={l}
                  onClick={() => setLang(l)}
                  className={`px-2 py-0.5 text-xs font-bold rounded ${lang === l ? 'bg-amber-500 text-black' : 'text-gray-400 hover:text-white'}`}
                >
                  {l}
                </button>
              ))}
            </div>
          </header>

          {/* PREPÍNANIE ZÁLOŽIEK: ZÁKAZKY VS ZÁKAZNÍCI */}
          <div className="flex bg-gray-800 p-1 rounded-xl mb-4 border border-gray-700">
            <button 
              onClick={() => setActiveTab("orders")} 
              className={`flex-1 py-2 text-xs font-bold rounded-lg ${activeTab === 'orders' ? 'bg-amber-500 text-black' : 'text-gray-400'}`}
            >
              <i className="fa-solid fa-car mr-1"></i>{t.tabOrders}
            </button>
            <button 
              onClick={() => setActiveTab("clients")} 
              className={`flex-1 py-2 text-xs font-bold rounded-lg ${activeTab === 'clients' ? 'bg-amber-500 text-black' : 'text-gray-400'}`}
            >
              <i className="fa-solid fa-address-book mr-1"></i>{t.tabClients} ({clientsData.length})
            </button>
          </div>

          {activeTab === "orders" ? (
            <form className="bg-gray-800 p-4 rounded-xl border border-gray-700 space-y-4">
              {/* SKENER CAR & 2-KROKOVÝ PROCES */}
              <div className="bg-amber-500/10 border border-amber-500/30 p-3 rounded-lg text-center space-y-3">
                <button 
                  type="button" 
                  onClick={startScanning}
                  className="w-full bg-amber-500 hover:bg-amber-400 text-black font-extrabold py-3.5 rounded-lg text-base flex justify-center items-center gap-2 shadow-lg transition-all tracking-wide"
                >
                  <i className="fa-solid fa-camera text-xl"></i>
                  <span>{t.scanBtn}</span>
                </button>

                {scanStep > 0 && (
                  <div className="bg-gray-900/90 p-3 rounded-lg border border-amber-500/50 space-y-2">
                    <div className="flex justify-between items-center text-xs font-bold">
                      <span className={scanStep === 1 ? "text-amber-400 font-black" : "text-gray-400"}>{t.step1Label}</span>
                      <span className={scanStep === 2 ? "text-amber-400 font-black" : "text-gray-400"}>{t.step2Label}</span>
                    </div>
                    
                    {isAnalyzing ? (
                      <p className="text-xs text-amber-300 animate-pulse"><i className="fa-solid fa-spinner fa-spin mr-1"></i> Analyzujem fotku...</p>
                    ) : scanStep === 1 && vin ? (
                      <div className="space-y-2 pt-1 border-t border-gray-800">
                        <p className="text-xs text
