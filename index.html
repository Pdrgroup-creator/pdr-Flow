    function App() {
      const [lang, setLang] = useState(() => localStorage.getItem("pdr_lang") || "SK");
      const [activeTab, setActiveTab] = useState("vehicles");
      const t = TRANSLATIONS[lang];
      const colorOptions = COLOR_DATA[lang];

      const [currentUser, setCurrentUser] = useState(null);
      const [loadingUser, setLoadingUser] = useState(true);
      const [authError, setAuthError] = useState("");

      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [newAccountPassword, setNewAccountPassword] = useState("");
      const [settingsMsg, setSettingsMsg] = useState("");

      const [isRegistering, setIsRegistering] = useState(false);
      const [authEmail, setAuthEmail] = useState("");
      const [authPassword, setAuthPassword] = useState("");
      const [authConfirmPassword, setAuthConfirmPassword] = useState("");
      const [authAccountType, setAuthAccountType] = useState("solo");
      const [authRole, setAuthRole] = useState("manager");

      const [clients, setClients] = useState([]);
      const [projects, setProjects] = useState([]);
      const [vehicles, setVehicles] = useState([]);

      // Pamäť posledného výberu
      const [selectedClientId, setSelectedClientId] = useState(() => localStorage.getItem("pdr_last_client") || "");
      const [selectedProjectId, setSelectedProjectId] = useState(() => localStorage.getItem("pdr_last_project") || "");

      // Bottom Sheet
      const [activeBottomSheet, setActiveBottomSheet] = useState(null);

      // Správa na karte Klienti & Miesta
      const [selectedClientDetailId, setSelectedClientDetailId] = useState(null); // otvorené miesta pod klientom
      const [locationSearchFilter, setLocationSearchFilter] = useState("");

      const [showNewClientForm, setShowNewClientForm] = useState(false);
      const [newClientName, setNewClientName] = useState("");
      const [newClientPrefix, setNewClientPrefix] = useState("");
      const [newClientAutoNum, setNewClientAutoNum] = useState(true);
      const [newClientAddress, setNewClientAddress] = useState("");
      const [newClientIco, setNewClientIco] = useState("");
      const [newClientPhone, setNewClientPhone] = useState("");
      const [newClientContactPerson, setNewClientContactPerson] = useState("");

      // Formulár pre nové miesto
      const [addingProjectClientId, setAddingProjectClientId] = useState(null);
      const [newProjectName, setNewProjectName] = useState("");
      const [newProjectAddress, setNewProjectAddress] = useState("");
      const [newProjectPhone, setNewProjectPhone] = useState("");
      const [newProjectContactPerson, setNewProjectContactPerson] = useState("");
      const [newProjectPricingMode, setNewProjectPricingMode] = useState("free"); // free, fixed, categories
      const [newProjectFixedPrice, setNewProjectFixedPrice] = useState("");
      const [newProjectCategories, setNewProjectCategories] = useState("Kat 1:120, Kat 2:250, Kat 3:450");

      const [searchTerm, setSearchTerm] = useState("");

      const cameraInputRef = useRef(null);
      const cardClientInputRef = useRef(null);
      const cardProjectInputRef = useRef(null);
      const [scanStep, setScanStep] = useState(0);
      const [vinPhoto, setVinPhoto] = useState(null);
      const [rearPhoto, setRearPhoto] = useState(null);
      const [sheetPhoto, setSheetPhoto] = useState(null);
      const [isAnalyzing, setIsAnalyzing] = useState(false);

      const [clientCalcNo, setClientCalcNo] = useState("");
      const [vin, setVin] = useState("");
      const [ecv, setEcv] = useState("");
      const [hasNoEcv, setHasNoEcv] = useState(false);
      const [brand, setBrand] = useState("");
      const [model, setModel] = useState("");
      const [color, setColor] = useState(colorOptions[2]);
      const [price, setPrice] = useState("");
      const [selectedCategoryLabel, setSelectedCategoryLabel] = useState("");
      const [riPrice, setRiPrice] = useState("");
      const [isPricePending, setIsPricePending] = useState(false);

      useEffect(() => {
        const fetchUserProfile = async (session) => {
          if (!session?.user) {
            setCurrentUser(null);
            setLoadingUser(false);
            return;
          }

          try {
            const { data: profile } = await supabase
              .from("profiles")
              .select("*")
              .eq("id", session.user.id)
              .maybeSingle();

            setCurrentUser({
              id: session.user.id,
              email: session.user.email,
              accountType: profile?.account_type || "solo",
              role: profile?.role || "solo"
            });
          } catch (err) {
            setCurrentUser({
              id: session.user.id,
              email: session.user.email,
              accountType: "solo",
              role: "solo"
            });
          } finally {
            setLoadingUser(false);
          }
        };

        supabase.auth.getSession().then(({ data: { session } }) => {
          fetchUserProfile(session);
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          fetchUserProfile(session);
        });

        return () => subscription.unsubscribe();
      }, []);

      const loadData = async () => {
        try {
          const { data: cData } = await supabase.from("clients").select("*").order("name");
          if (cData) {
            setClients(cData);
            if (!selectedClientId && cData.length > 0) {
              setSelectedClientId(cData[0].id);
              localStorage.setItem("pdr_last_client", cData[0].id);
            }
          }

          const { data: pData } = await supabase.from("projects").select("*").order("name");
          if (pData) setProjects(pData);

          const { data: vData } = await supabase.from("vehicles").select("*").order("created_at", { ascending: false });
          if (vData) setVehicles(vData);
        } catch (e) {
          console.error("Data load err:", e);
        }
      };

      useEffect(() => {
        if (currentUser) {
          loadData();
        }
      }, [currentUser]);

      const availableProjects = useMemo(() => {
        return projects.filter(p => p.client_id === selectedClientId);
      }, [projects, selectedClientId]);

      // Správa pamäte miesta
      useEffect(() => {
        if (availableProjects.length > 0) {
          const found = availableProjects.find(p => p.id === selectedProjectId);
          if (!found) {
            setSelectedProjectId(availableProjects[0].id);
            localStorage.setItem("pdr_last_project", availableProjects[0].id);
          }
        } else {
          setSelectedProjectId("");
        }
      }, [availableProjects, selectedClientId]);

      const handleClientChange = (clientId) => {
        setSelectedClientId(clientId);
        localStorage.setItem("pdr_last_client", clientId);
      };

      const handleProjectChange = (projectId) => {
        setSelectedProjectId(projectId);
        localStorage.setItem("pdr_last_project", projectId);
      };

      // Aktuálne vybraný projekt a jeho cenový režim
      const currentSelectedProject = useMemo(() => {
        return projects.find(p => p.id === selectedProjectId);
      }, [projects, selectedProjectId]);

      // Adaptácia cien podľa projektu
      useEffect(() => {
        if (!currentSelectedProject) return;

        if (currentSelectedProject.pricing_mode === 'fixed' && currentSelectedProject.fixed_price) {
          setPrice(String(currentSelectedProject.fixed_price));
          setSelectedCategoryLabel("");
        } else if (currentSelectedProject.pricing_mode === 'categories') {
          // Nastavíme prvú kategóriu ako východiskovú
          const cats = currentSelectedProject.pricing_categories || [];
          if (cats.length > 0) {
            setSelectedCategoryLabel(cats[0].label);
            setPrice(String(cats[0].price));
          }
        }
      }, [currentSelectedProject]);

      // Automatické číslovanie kalkulácie
      useEffect(() => {
        if (!selectedClientId) return;
        const currentClient = clients.find(c => c.id === selectedClientId);
        const currentYear = new Date().getFullYear();

        if (currentClient && currentClient.auto_numbering && currentClient.calc_prefix) {
          const clientProjectIds = projects.filter(p => p.client_id === selectedClientId).map(p => p.id);
          const clientVehiclesThisYear = vehicles.filter(v => 
            clientProjectIds.includes(v.project_id) && 
            v.client_calc_no && 
            v.client_calc_no.includes(`/${currentYear}/`)
          );
          const nextSeq = String(clientVehiclesThisYear.length + 1).padStart(3, '0');
          setClientCalcNo(`${currentClient.calc_prefix}/${currentYear}/${nextSeq}`);
        } else {
          setClientCalcNo("");
        }
      }, [selectedClientId, clients, projects, vehicles]);

      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        setAuthError("");

        if (isRegistering) {
          if (authPassword.length < 6) {
            setAuthError(t.passwordTooShort);
            return;
          }
          if (authPassword !== authConfirmPassword) {
            setAuthError(t.passwordMismatch);
            return;
          }

          const roleToAssign = authAccountType === "company" ? authRole : "solo";
          const { error } = await supabase.auth.signUp({
            email: authEmail,
            password: authPassword,
            options: {
              data: {
                account_type: authAccountType,
                role: roleToAssign
              }
            }
          });

          if (error) setAuthError(error.message);
        } else {
          const { error } = await supabase.auth.signInWithPassword({
            email: authEmail,
            password: authPassword
          });

          if (error) setAuthError(error.message);
        }
      };

      const handlePasswordUpdate = async (e) => {
        e.preventDefault();
        setSettingsMsg("");
        if (newAccountPassword.length < 6) {
          setSettingsMsg("Heslo musí mať aspoň 6 znakov.");
          return;
        }

        const { error } = await supabase.auth.updateUser({
          password: newAccountPassword
        });

        if (error) {
          setSettingsMsg("Chyba: " + error.message);
        } else {
          setSettingsMsg(t.passwordUpdated);
          setNewAccountPassword("");
          setTimeout(() => setShowSettingsModal(false), 1500);
        }
      };

      const handleLogout = async () => {
        await supabase.auth.signOut();
        setCurrentUser(null);
      };

      const handleCreateClient = async (e) => {
        e.preventDefault();
        if (!newClientName.trim()) return;

        const { data, error } = await supabase.from("clients").insert([
          { 
            name: newClientName.trim(), 
            calc_prefix: newClientPrefix.trim() ? newClientPrefix.trim().toUpperCase() : null,
            auto_numbering: newClientAutoNum,
            address: newClientAddress.trim() || null,
            ico: newClientIco.trim() || null,
            phone: newClientPhone.trim() || null,
            contact_person: newClientContactPerson.trim() || null,
            created_by: currentUser.id 
          }
        ]).select();

        if (!error && data) {
          setClients([...clients, data[0]]);
          handleClientChange(data[0].id);
          setNewClientName("");
          setNewClientPrefix("");
          setNewClientAddress("");
          setNewClientIco("");
          setNewClientPhone("");
          setNewClientContactPerson("");
          setShowNewClientForm(false);
        } else if (error) {
          alert("Chyba: " + error.message);
        }
      };

      const handleCreateProject = async (clientId) => {
        if (!newProjectName.trim()) return;

        // Spracovanie kategórií z textu "Kat 1:120, Kat 2:250"
        let parsedCategories = null;
        if (newProjectPricingMode === 'categories') {
          parsedCategories = newProjectCategories.split(',').map(item => {
            const [label, priceStr] = item.split(':');
            return {
              label: (label || "").trim(),
              price: Number(priceStr) || 0
            };
          }).filter(c => c.label);
        }

        const { data, error } = await supabase.from("projects").insert([
          { 
            client_id: clientId, 
            name: newProjectName.trim(), 
            address: newProjectAddress.trim() || null,
            phone: newProjectPhone.trim() || null,
            contact_person: newProjectContactPerson.trim() || null,
            pricing_mode: newProjectPricingMode,
            fixed_price: newProjectPricingMode === 'fixed' ? Number(newProjectFixedPrice) || 0 : null,
            pricing_categories: parsedCategories,
            created_by: currentUser.id 
          }
        ]).select();

        if (!error && data) {
          setProjects([...projects, data[0]]);
          if (clientId === selectedClientId) {
            handleProjectChange(data[0].id);
          }
          setNewProjectName("");
          setNewProjectAddress("");
          setNewProjectPhone("");
          setNewProjectContactPerson("");
          setNewProjectPricingMode("free");
          setNewProjectFixedPrice("");
          setAddingProjectClientId(null);
        } else if (error) {
          alert("Chyba: " + error.message);
        }
      };

      const handleClientCardCapture = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setShowNewClientForm(true);
        setTimeout(() => {
          setNewClientName("Autohaus Denk GmbH");
          setNewClientPrefix("DNK");
          setNewClientAutoNum(true);
          setNewClientAddress("Industriestraße 12, 80331 München");
          setNewClientIco("DE284910284");
          setNewClientPhone("+49 89 1234567");
          setNewClientContactPerson("Herr Michael Schmidt");
        }, 700);
      };

      const handleProjectCardCapture = (e, clientId) => {
        const file = e.target.files[0];
        if (!file) return;

        setAddingProjectClientId(clientId);
        setTimeout(() => {
          setNewProjectName("Opel Denk Augsburg");
          setNewProjectAddress("Augsburger Str. 88, 86157 Augsburg");
          setNewProjectPhone("+49 821 556677");
          setNewProjectContactPerson("Herr Weber");
        }, 700);
      };

      const startScanning = () => {
        setScanStep(1);
        if (cameraInputRef.current) cameraInputRef.current.click();
      };

      const handlePhotoCapture = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const photoUrl = URL.createObjectURL(file);
        if (scanStep === 1) {
          setVinPhoto(photoUrl);
          setIsAnalyzing(true);
          setTimeout(() => {
            setVin("WVWZZZ3CZWE987654");
            setIsAnalyzing(false);
          }, 800);
        } else if (scanStep === 2) {
          setRearPhoto(photoUrl);
          setIsAnalyzing(true);
          setTimeout(() => {
            setEcv("BL-555YY");
            setBrand("Volkswagen");
            setModel("Passat Variant");
            setIsAnalyzing(false);
          }, 800);
        } else if (scanStep === 3) {
          setSheetPhoto(photoUrl);
          setScanStep(0);
        }
      };

      const handleSaveVehicle = async (e) => {
        e.preventDefault();
        if (!selectedProjectId) {
          alert("Vyberte najprv platného Klienta a Miesto.");
          return;
        }

        const currentYear = new Date().getFullYear();
        const techPrefix = (currentUser.email.split('@')[0].split('.')[1] || currentUser.email.substring(0, 3)).toUpperCase().substring(0, 4);
        const internalSeq = String(vehicles.length + 1).padStart(3, '0');
        const generatedInternalRecordNo = `${techPrefix}/${currentYear}/${internalSeq}`;

        const newVehicleRecord = {
          project_id: selectedProjectId,
          created_by: currentUser.id,
          internal_record_no: generatedInternalRecordNo,
          client_calc_no: clientCalcNo || null,
          price_category: selectedCategoryLabel || null,
          ri_price: Number(riPrice) || 0.00,
          vin: vin || "N/A",
          ecv: hasNoEcv ? "Bez ŠPZ" : (ecv || "N/A"),
          has_no_ecv: hasNoEcv,

              </div>

              {/* 4. SEKCIA: Financie - Dynamické podľa miesta (FREE / FIXED / CATEGORIES) */}
              <div className="space-y-3 pt-1 border-t border-gray-700">
                <div className="bg-gray-900/60 p-3 rounded-lg border border-gray-700 space-y-2">
                  <div className="flex justify-between items-center">
                    <label className="text-xs font-bold text-gray-300">
                      {t.priceLabel}
                      {currentSelectedProject?.pricing_mode === 'fixed' && (
                        <span className="ml-1 text-[10px] text-amber-400 font-normal">(Fixný paušál)</span>
                      )}
                      {currentSelectedProject?.pricing_mode === 'categories' && (
                        <span className="ml-1 text-[10px] text-amber-400 font-normal">(Výber kategórie)</span>
                      )}
                    </label>
                    <label className="text-xs text-amber-400 flex items-center gap-1.5 cursor-pointer font-bold">
                      <input 
                        type="checkbox" 
                        checked={isPricePending} 
                        onChange={e => setIsPricePending(e.target.checked)} 
                      />
                      {t.pricePendingCheckbox}
                    </label>
                  </div>

                  {!isPricePending && (
                    <div>
                      {/* Ak je režim CATEGORIES: Zobrazíme tlačidlá kategórií */}
                      {currentSelectedProject?.pricing_mode === 'categories' && currentSelectedProject.pricing_categories?.length > 0 ? (
                        <div className="space-y-2">
                          <div className="grid grid-cols-3 gap-2">
                            {currentSelectedProject.pricing_categories.map((cat, idx) => (
                              <button
                                key={idx}
                                type="button"
                                onClick={() => {
                                  setSelectedCategoryLabel(cat.label);
                                  setPrice(String(cat.price));
                                }}
                                className={`py-2 px-1 text-center rounded-lg border font-bold text-xs ${selectedCategoryLabel === cat.label ? 'bg-amber-500 text-black border-amber-400' : 'bg-gray-900 text-gray-300 border-gray-700'}`}
                              >
                                <div>{cat.label}</div>
                                <div className="text-[10px] font-normal">{cat.price} €</div>
                              </button>
                            ))}
                          </div>
                          <div className="text-right text-[11px] font-bold text-amber-400">
                            Zvolené: {selectedCategoryLabel} ({price} €)
                          </div>
                        </div>
                      ) : (
                        /* Režim FREE alebo FIXED */
                        <input 
                          type="number" 
                          value={price} 
                          onChange={e => setPrice(e.target.value)} 
                          placeholder="0.00" 
                          className="w-full bg-gray-900 border border-gray-600 rounded p-2 text-sm text-amber-400 font-bold" 
                        />
                      )}
                    </div>
                  )}
                </div>

                <div className="bg-gray-900/60 p-3 rounded-lg border border-gray-700 space-y-1">
                  <label className="text-xs font-bold text-gray-300 flex items-center gap-1.5">
                    <i className="fa-solid fa-wrench text-amber-500 text-xs"></i>
                    <span>{t.riPriceLabel}</span>
                  </label>
                  <input 
                    type="number" 
                    value={riPrice} 
                    onChange={e => setRiPrice(e.target.value)} 
                    placeholder="0.00" 
                    className="w-full bg-gray-900 border border-gray-600 rounded p-2 text-sm text-amber-400 font-bold" 
                  />
                </div>
              </div>

              <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-black font-extrabold py-3.5 rounded-lg text-center mt-2 shadow tracking-wide">
                {t.saveVehicle}
              </button>
            </form>
          ) : activeTab === "projects" ? (
            <div className="space-y-4">
              
              {/* Tlačidlá pridania nového klienta */}
              <div className="flex gap-2">
                <button
                  type="button"
                  onClick={() => setShowNewClientForm(!showNewClientForm)}
                  className="flex-1 bg-amber-500 hover:bg-amber-400 text-black font-extrabold py-2.5 px-3 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow"
                >
                  <i className="fa-solid fa-plus"></i>
                  <span>{t.addClientBtn}</span>
                </button>
                <button
                  type="button"
                  onClick={() => { if(cardClientInputRef.current) cardClientInputRef.current.click(); }}
                  className="bg-gray-800 hover:bg-gray-700 border border-amber-500/40 text-amber-400 font-bold py-2.5 px-3 rounded-xl text-xs flex items-center justify-center gap-1.5"
                  title="Skenovať vizitku klienta"
                >
                  <i className="fa-solid fa-id-card text-sm"></i>
                  <span>{t.scanCardBtn}</span>
                </button>
              </div>

              {/* Formulár nového klienta */}
              {showNewClientForm && (
                <form onSubmit={handleCreateClient} className="bg-gray-800 p-4 rounded-xl border border-amber-500/50 space-y-3">
                  <div className="flex justify-between items-center border-b border-gray-700 pb-2">
                    <h4 className="text-xs font-bold text-amber-400 uppercase">Nový Klient (Firma)</h4>
                    <button type="button" onClick={() => setShowNewClientForm(false)} className="text-gray-400 hover:text-white">
                      <i className="fa-solid fa-xmark"></i>
                    </button>
                  </div>
                  <div>
                    <label className="block text-[10px] text-gray-400 mb-1">Názov firmy / klienta *</label>
                    <input 
                      type="text" 
                      value={newClientName} 
                      onChange={e => setNewClientName(e.target.value)} 
                      placeholder="Napr. Autohaus Denk GmbH" 
                      className="w-full bg-gray-900 border border-gray-600 rounded p-2 text-xs text-white"
                      required
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-[10px] text-gray-400 mb-1">Predpona kalkulácie</label>
                      <input 
                        type="text" 
                        value={newClientPrefix} 
                        onChange={e => setNewClientPrefix(e.target.value)} 
                        placeholder="Napr. DNK" 
                        className="w-full bg-gray-900 border border-gray-600 rounded p-2 text-xs text-amber-400 font-mono uppercase"
                      />
                    </div>
                    <div className="flex items-center pt-3">
                      <label className="text-[10px] text-gray-300 flex items-center gap-1.5 cursor-pointer">
                        <input 
                          type="checkbox" 
                          checked={newClientAutoNum} 
                          onChange={e => setNewClientAutoNum(e.target.checked)} 
                        />
                        <span>Auto číslovanie</span>
                      </label>
                    </div>
                  </div>

                  <div className="space-y-2 pt-2 border-t border-gray-700/60">
                    <p className="text-[10px] text-gray-400 font-bold uppercase">Podrobnosti a Fakturácia</p>
                    <input 
                      type="text" 
                      value={newClientAddress} 
                      onChange={e => setNewClientAddress(e.target.value)} 
                      placeholder="Sídlo / Fakturačná adresa" 
                      className="w-full bg-gray-900 border border-gray-700 rounded p-1.5 text-xs text-gray-200"
                    />
                    <div className="grid grid-cols-2 gap-2">
                      <input 
                        type="text" 
                        value={newClientIco} 
                        onChange={e => setNewClientIco(e.target.value)} 
                        placeholder="IČO / UID / DIČ" 
                        className="w-full bg-gray-900 border border-gray-700 rounded p-1.5 text-xs text-gray-200"
                      />
                      <input 
                        type="text" 
                        value={newClientPhone} 
                        onChange={e => setNewClientPhone(e.target.value)} 
                        placeholder="Telefón" 
                        className="w-full bg-gray-900 border border-gray-700 rounded p-1.5 text-xs text-gray-200"
                      />
                    </div>
                    <input 
                      type="text" 
                      value={newClientContactPerson} 
                      onChange={e => setNewClientContactPerson(e.target.value)} 
                      placeholder="Kontaktná osoba" 
                      className="w-full bg-gray-900 border border-gray-700 rounded p-1.5 text-xs text-gray-200"
                    />
                  </div>

                  <button type="submit" className="w-full bg-amber-500 text-black font-extrabold py-2 rounded text-xs shadow mt-2">
                    Uložiť nového klienta
                  </button>
                </form>
              )}

              {/* Zoznam Klientov - Čistý zoznam s rozklikom do miest */}
              <div className="space-y-3">
                {clients.length === 0 ? (
                  <div className="bg-gray-800 p-6 rounded-xl border border-gray-700 text-center text-gray-400 text-xs">
                    {t.noClients}
                  </div>
                ) : (
                  clients.map(c => {
                    const clientProjects = projects.filter(p => p.client_id === c.id);
                    const isOpen = selectedClientDetailId === c.id;
                    const isAddingToThisClient = addingProjectClientId === c.id;

                    // Filtrovanie miest v rámci tohto klienta
                    const filteredLocations = clientProjects.filter(p => {
                      if (!locationSearchFilter.trim()) return true;
                      const f = locationSearchFilter.toLowerCase();
                      return (p.name && p.name.toLowerCase().includes(f)) || (p.address && p.address.toLowerCase().includes(f));
                    });

                    return (
                      <div key={c.id} className="bg-gray-800 rounded-xl border border-gray-700 overflow-hidden">
                        {/* Riadok klienta */}
                        <div 
                          onClick={() => {
                            setSelectedClientDetailId(isOpen ? null : c.id);
                            setLocationSearchFilter("");
                          }}
                          className="p-3.5 flex justify-between items-center cursor-pointer hover:bg-gray-750 transition-colors"
                        >
                          <div>
                            <div className="flex items-center gap-2">
                              <h4 className="font-extrabold text-white text-base">{c.name}</h4>
                              {c.calc_prefix && (
                                <span className="text-[9px] bg-amber-500/20 text-amber-300 px-1.5 py-0.5 rounded font-mono font-bold">
                                  {c.calc_prefix}
                                </span>
                              )}
                            </div>
                            <p className="text-[10px] text-gray-400 mt-0.5">
                              {clientProjects.length} {clientProjects.length === 1 ? 'miesto / pobočka' : 'miest / pobočiek'}
                            </p>
                          </div>

                          <div className="flex items-center gap-2">
                            <button
                              type="button"
                              onClick={(e) => {
                                e.stopPropagation();
                                setActiveBottomSheet({ type: 'client', data: c });
                              }}
                              className="text-xs px-2.5 py-1.5 rounded-lg border bg-gray-900 text-amber-400 border-gray-700 font-bold"
                              title="Vizitka klienta"
                            >
                              <i className="fa-solid fa-address-card"></i>
                            </button>
                            <span className="text-gray-400 p-1 text-sm">
                              <i className={`fa-solid ${isOpen ? 'fa-chevron-up' : 'fa-chevron-down'}`}></i>
                            </span>
                          </div>
                        </div>

                        {/* Rozbalené miesta klienta */}
                        {isOpen && (
                          <div className="p-3.5 bg-gray-900/70 border-t border-gray-700/80 space-y-3">
                            <div className="flex justify-between items-center gap-2">
                              {/* Vyhľadávanie medzi miestami tohto klienta */}
                              <div className="relative flex-1">
                                <i className="fa-solid fa-magnifying-glass absolute left-2.5 top-2 text-[10px] text-gray-500"></i>
                                <input 
                                  type="text" 
                                  value={locationSearchFilter} 
                                  onChange={e => setLocationSearchFilter(e.target.value)} 
                                  placeholder={t.searchLocationsPlaceholder} 
                                  className="w-full bg-gray-950 border border-gray-700 rounded-lg pl-7 pr-2 py-1 text-xs text-white"
                                />
                              </div>

                              <button
                                type="button"
                                onClick={() => {
                                  setAddingProjectClientId(isAddingToThisClient ? null : c.id);
                                  setNewProjectName("");
                                  setNewProjectAddress("");
                                  setNewProjectPhone("");
                                  setNewProjectContactPerson("");
                                  setNewProjectPricingMode("free");
                                  setNewProjectFixedPrice("");
                                }}
                                className="text-[11px] bg-amber-500 hover:bg-amber-400 text-black font-extrabold px-2.5 py-1.5 rounded-lg whitespace-nowrap shadow"
                              >
                                <i className="fa-solid fa-plus mr-1"></i>Miesto
                              </button>
                            </div>

                            {/* Formulár pre pridanie miesta s konfiguráciou cien */}
                            {isAddingToThisClient && (
                              <div className="bg-gray-950 p-3 rounded-xl border border-amber-500/50 space-y-2.5">
                                <div className="flex justify-between items-center">
                                  <span className="text-[10px] font-bold text-amber-400 uppercase">Nové miesto / servis</span>
                                  <button
                                    type="button"
                                    onClick={() => { if(cardProjectInputRef.current) cardProjectInputRef.current.click(); }}
                                    className="text-[9px] bg-gray-900 border border-gray-700 text-amber-400 font-bold px-2 py-0.5 rounded flex items-center gap-1"
                                  >
                                    <i className="fa-solid fa-id-card"></i> Sken vizitky
                                  </button>
                                </div>

                                <input 
                                  type="text" 
                                  value={newProjectName} 
                                  onChange={e => setNewProjectName(e.target.value)} 
                                  placeholder="Názov (napr. Opel Denk Augsburg)" 
                                  className="w-full bg-gray-900 border border-gray-700 rounded p-1.5 text-xs text-white"
                                  required
                                />

                                <input 
                                  type="text" 
                                  value={newProjectAddress} 
                                  onChange={e => setNewProjectAddress(e.target.value)} 
                                  placeholder="Ulica, Mesto (napr. Augsburger Str. 88)" 
                                  className="w-full bg-gray-900 border border-gray-700 rounded p-1.5 text-xs text-gray-200"
                                />

                                {/* Voľba cenového modelu */}
                                <div className="pt-1">
                                  <label className="block text-[10px] text-gray-400 mb-1 font-bold uppercase">Cenový model miesta</label>
                                  <div className="grid grid-cols-3 gap-1.5">
                                    {['free', 'fixed', 'categories'].map(mode => (
                                      <button
                                        key={mode}
                                        type="button"
                                        onClick={() => setNewProjectPricingMode(mode)}
                                        className={`py-1.5 text-[10px] font-bold rounded uppercase border ${newProjectPricingMode === mode ? 'bg-amber-500 text-black border-amber-400' : 'bg-gray-900 text-gray-300 border-gray-700'}`}
                                      >
                                        {mode}
                                      </button>
                                    ))}
                                  </div>
                                </div>

                                {newProjectPricingMode === 'fixed' && (
                                  <div>
                                    <label className="block text-[9px] text-gray-400 mb-0.5">Pevná sadzba za auto (€)</label>
                                    <input 
                                      type="number" 
                                      value={newProjectFixedPrice} 
                                      onChange={e => setNewProjectFixedPrice(e.target.value)} 
                                      placeholder="Napr. 180.00" 
                                      className="w-full bg-gray-900 border border-amber-500/50 rounded p-1.5 text-xs text-amber-300 font-bold"
                                    />
                                  </div>
                                )}

                                {newProjectPricingMode === 'categories' && (
                                  <div>
                                    <label className="block text-[9px] text-gray-400 mb-0.5">Kategórie poškodenia (Názov:Cena oddelené čiarkou)</label>
                                    <input 
                                      type="text" 
                                      value={newProjectCategories} 
                                      onChange={e => setNewProjectCategories(e.target.value)} 
                                      placeholder="Kat 1:120, Kat 2:250, Kat 3:450" 
                                      className="w-full bg-gray-900 border border-amber-500/50 rounded p-1.5 text-xs text-amber-300 font-mono"
                                    />
                                  </div>
                                )}

                                <div className="flex gap-2 pt-1">
                                  <button 
                                    type="button" 
                                    onClick={() => handleCreateProject(c.id)} 
                                    className="flex-1 bg-amber-500 text-black font-extrabold py-1.5 text-xs rounded"
                                  >
                                    Uložiť miesto
                                  </button>
                                  <button 
                                    type="button" 
                                    onClick={() => setAddingProjectClientId(null)} 
                                    className="bg-gray-800 text-gray-400 px-3 py-1.5 text-xs rounded"
                                  >
                                    Zrušiť
                                  </button>
                                </div>
                              </div>
                            )}

                            {/* Zoznam pobočiek */}
                            <div className="space-y-1.5">
                              {filteredLocations.length === 0 ? (
                                <p className="text-[10px] text-gray-500 italic py-1">{t.noProjectsForClient}</p>
                              ) : (
                                filteredLocations.map(p => (
                                  <div 
                                    key={p.id} 
                                    onClick={() => setActiveBottomSheet({ type: 'project', data: p })}
                                    className="text-xs text-gray-300 p-2.5 rounded-lg bg-gray-950/80 border border-gray-800 hover:border-gray-700 cursor-pointer flex justify-between items-center"
                                  >
                                    <div>
                                      <div className="flex items-center gap-1.5">
                                        <i className="fa-solid fa-warehouse text-amber-500 text-[10px]"></i>
                                        <span className="font-bold text-white text-xs">{p.name}</span>
                                        <span className="text-[8px] uppercase tracking-wider bg-gray-800 text-amber-400 px-1.5 py-0.5 rounded font-mono font-bold">
                                          {p.pricing_mode || 'free'}
                                        </span>
                                      </div>
                                      {p.address && (
                                        <p className="text-[10px] text-gray-400 pl-4 mt-0.5 flex items-center gap-1">
                                          <i className="fa-solid fa-location-dot text-[9px] text-gray-500"></i>
                                          <span>{p.address}</span>
                                        </p>
                                      )}
                                    </div>
                                    <span className="text-[10px] text-gray-500 hover:text-amber-400">
                                      <i className="fa-solid fa-chevron-right"></i>
                                    </span>
                                  </div>
                                ))
                              )}
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })
                )}
              </div>
            </div>
          ) : (
            <div className="space-y-3">
              <div className="relative">
                <i className="fa-solid fa-magnifying-glass absolute left-3 top-3 text-xs text-gray-400"></i>
                <input 
                  type="text" 
                  value={searchTerm} 
                  onChange={e => setSearchTerm(e.target.value)} 
                  placeholder={t.searchPlaceholder} 
                  className="w-full bg-gray-800 border border-gray-700 rounded-xl pl-8 pr-3 py-2 text-xs text-white focus:border-amber-500"
                />
              </div>

              <div className="space-y-2">
                {filteredVehicles.length === 0 ? (
                  <div className="bg-gray-800 p-6 rounded-xl border border-gray-700 text-center text-gray-400 text-xs">
                    {t.noVehicles}
                  </div>
                ) : (
                  filteredVehicles.map(v => (
                    <div key={v.id} className="bg-gray-800 p-3 rounded-xl border border-gray-700 flex justify-between items-center">
                      <div>
                        <div className="flex items-center gap-2">
                          <span className="text-xs font-bold text-amber-400 font-mono">
                            {v.client_calc_no || "Bez kalkulácie"}
                          </span>
                          <span className="text-xs font-bold text-white">{v.brand} {v.model} ({v.ecv})</span>
                        </div>
                        <p className="text-[10px] text-gray-400 font-mono">VIN: {v.vin}</p>
                        {v.price_category && (
                          <span className="text-[9px] bg-amber-500/20 text-amber-300 px-1.5 py-0.5 rounded font-bold mr-1">
                            {v.price_category}
                          </span>
                        )}
                        {v.ri_price > 0 && (
                          <span className="text-[10px] text-amber-500/80 font-bold">R&I: +{v.ri_price} €</span>
                        )}
                      </div>
                      <div className="text-right">
                        <span className="text-xs bg-amber-500/20 text-amber-300 font-bold px-2 py-1 rounded inline-block">
                          {v.is_price_pending ? "Neznáma" : `${Number(v.price) + Number(v.ri_price || 0)} €`}
                        </span>
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
