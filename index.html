    // Canvas kompresia (max 1600 px, JPEG 0.78)
    const compressImage = (file) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const maxDim = 1600;
            let width = img.width;
            let height = img.height;

            if (width > maxDim || height > maxDim) {
              if (width > height) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              } else {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }

            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob(
              (blob) => {
                if (blob) resolve(blob);
                else reject(new Error("Canvas blob error"));
              },
              "image/jpeg",
              0.78
            );
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    };

          setTimeout(() => { setVin("WVWZZZ3CZWE987654"); setIsAnalyzing(false); }, 400);
        } else if (scanStep === 2) {
          setRearFile(file);
          setRearPreview(URL.createObjectURL(file));
          setIsAnalyzing(true);
          setTimeout(() => {
            setEcv("BL-555YY");
            setBrand("Volkswagen");
            setModel("Passat Variant");
            setIsAnalyzing(false);
          }, 400);
        } else if (scanStep === 3) {
          setSheetFile(file);
          setSheetPreview(URL.createObjectURL(file));
          setScanStep(0);
        }
      };

      const handleDamagePhotoAdd = (e) => {
        const file = e.target.files[0];
        if (!file || damageFiles.length >= 5) return;
        setDamageFiles([...damageFiles, file]);
      };

      const uploadSingleFile = async (file, path) => {
        const compressedBlob = await compressImage(file);
        const { error } = await supabase.storage.from("vehicle-photos").upload(path, compressedBlob, {
          contentType: "image/jpeg",
          upsert: true
        });
        if (error) throw error;
        const { data } = supabase.storage.from("vehicle-photos").getPublicUrl(path);
        return data.publicUrl;
      };

      // Uloženie vozidla
      const handleSaveVehicle = async (e) => {
        e.preventDefault();
        if (!selectedProjectId) return alert("Vyberte najprv platného Klienta a Miesto.");

        if (!canCloseRecord) {
          return alert("Zákazku nie je možné uzavrieť: Chýba sadzba AW na karte Miesta. Doplňte sadzbu alebo označte 'Cena neznáma'.");
        }

        setIsUploading(true);
        setUploadStatusText("Komprimujem fotky na 1600px...");

        try {
          const timestamp = Date.now();
          const uid = currentUser.id;

          let vinUrl = null, rearUrl = null, sheetUrl = null;
          const damageUrls = [];

          if (vinFile) vinUrl = await uploadSingleFile(vinFile, `${uid}/${timestamp}_vin.jpg`);
          if (rearFile) rearUrl = await uploadSingleFile(rearFile, `${uid}/${timestamp}_rear.jpg`);
          if (sheetFile) sheetUrl = await uploadSingleFile(sheetFile, `${uid}/${timestamp}_sheet.jpg`);

          for (let i = 0; i < damageFiles.length; i++) {
            const dUrl = await uploadSingleFile(damageFiles[i], `${uid}/${timestamp}_dmg_${i + 1}.jpg`);
            damageUrls.push(dUrl);
          }

          const currentYear = new Date().getFullYear();
          const techPrefix = (currentUser.email.split("@")[0].substring(0, 4)).toUpperCase();
          const internalRecordNo = `${techPrefix}/${currentYear}/${String(vehicles.length + 1).padStart(3, "0")}`;

          const finalStatus = isPricePending ? "pending_price" : (isAwRateMissing ? "pending_rate" : "completed");

          const newVehicleRecord = {
            project_id: selectedProjectId,
            created_by: currentUser.id,
            internal_record_no: internalRecordNo,
            client_calc_no: clientCalcNo || null,
            price_category: selectedCategoryLabel || null,
            ri_price: Number(riPrice) || 0.00,
            vin: vin || "N/A",
            ecv: hasNoEcv ? "Bez ŠPZ" : (ecv || "N/A"),
            has_no_ecv: hasNoEcv,
            brand: brand || "Neznáma",
            model: model || "Neznámy",
            color: color,
            currency: currency,
            price: isPricePending ? 0 : (Number(price) || 0),
            is_price_pending: isPricePending,
            aw_count: (currentSelectedProject?.pricing_mode === "free" && awCount) ? parseFloat(awCount) : null,
            tech_pdr_percent: currentSelectedProject?.tech_pdr_percent ?? 100,
            tech_ri_percent: currentSelectedProject?.tech_ri_percent ?? 100,
            note: damageNote.trim() || null,
            note_created_at: damageNote.trim() ? new Date().toISOString() : null,
            photo_vin_url: vinUrl,
            photo_rear_url: rearUrl,
            photo_sheet_url: sheetUrl,
            damage_photos: damageUrls,
            status: finalStatus
          };

          const { data, error } = await supabase.from("vehicles").insert([newVehicleRecord]).select();
          if (error) throw error;

          setVehicles([data[0], ...vehicles]);
          alert("Vozidlo a fotografie boli úspešne uložené!");

          setVin("");
          setEcv("");
          setBrand("");
          setModel("");
          if (currentSelectedProject?.pricing_mode === "free") setPrice("");
          setAwCount("");
          setRiPrice("");
          setIsPricePending(false);
          setDamageNote("");
          setVinFile(null);
          setRearFile(null);
          setSheetFile(null);
          setDamageFiles([]);
          setVinPreview(null);
          setRearPreview(null);
          setSheetPreview(null);
        } catch (err) {
          alert("Chyba: " + err.message);
        } finally {
          setIsUploading(false);
          setUploadStatusText("");
        }
      };

      // Spätné doplnenie ceny pre uzavreté auto s neznámou cenou
      const handleSaveLatePrice = async (vehicleId) => {
        const val = parseFloat(latePriceInput);
        if (isNaN(val) || val <= 0) return alert("Zadajte platnú sumu.");

        const { error } = await supabase.from("vehicles").update({
          price: val,
          is_price_pending: false,
          status: "completed"
        }).eq("id", vehicleId);

        if (!error) {
          setVehicles(vehicles.map(v => v.id === vehicleId ? { ...v, price: val, is_price_pending: false, status: "completed" } : v));
          setSelectedVehicleDetail(prev => prev ? { ...prev, price: val, is_price_pending: false, status: "completed" } : null);
          setLatePriceInput("");
          alert("Cena bola úspešne doplnená.");
        } else {
          alert("Chyba: " + error.message);
        }
      };

      // Bottom Sheet Detail & Úprava (Edit)
      const handleOpenSheet = (type, data) => {
        setActiveBottomSheet({ type, data });
        setSheetEditData({ ...data });
        setIsEditingSheet(false);
      };

      const handleSaveSheetEdit = async () => {
        const isClient = activeBottomSheet.type === "client";
        const table = isClient ? "clients" : "projects";

        const { error } = await supabase.from(table).update(sheetEditData).eq("id", sheetEditData.id);
        if (!error) {
          if (isClient) {
            setClients(clients.map(c => c.id === sheetEditData.id ? sheetEditData : c));
          } else {
            setProjects(projects.map(p => p.id === sheetEditData.id ? sheetEditData : p));
          }
          setActiveBottomSheet({ type: activeBottomSheet.type, data: sheetEditData });
          setIsEditingSheet(false);
          alert("Údaje boli úspešne upravené.");
        } else {
          alert("Chyba: " + error.message);
        }
      };

      const handleToggleArchiveProject = async (pId, currentStatus) => {
        const nextStatus = !currentStatus;
        const msg = nextStatus ? "Obnoviť toto miesto do aktívnych?" : "Archivovať toto miesto? Zmizne z ponuky pri skenovaní, no autá v histórii zostanú.";
        if (!confirm(msg)) return;

        const { error } = await supabase.from("projects").update({ is_active: nextStatus }).eq("id", pId);
        if (!error) {
          setProjects(projects.map(p => p.id === pId ? { ...p, is_active: nextStatus } : p));
        } else {
          alert("Chyba: " + error.message);
        }
      };

      // Filtrovaný zoznam pre Reporty
      const reportVehicles = useMemo(() => {
        return vehicles.filter(v => {
          if (repClientFilter !== "all") {
            const project = projects.find(p => p.id === v.project_id);
            if (!project || project.client_id !== repClientFilter) return false;
          }
          if (repProjectFilter !== "all" && v.project_id !== repProjectFilter) return false;

          if (repDateRange === "week") {
            const d = new Date(); d.setDate(d.getDate() - 7);
            if (new Date(v.created_at) < d) return false;
          } else if (repDateRange === "month") {
            const d = new Date(); d.setDate(d.getDate() - 30);
            if (new Date(v.created_at) < d) return false;
          }

          if (repSearchQuery.trim()) {
            const q = repSearchQuery.toLowerCase();
            return (
              (v.client_calc_no && v.client_calc_no.toLowerCase().includes(q)) ||
              (v.vin && v.vin.toLowerCase().includes(q)) ||
              (v.ecv && v.ecv.toLowerCase().includes(q)) ||
              (v.brand && v.brand.toLowerCase().includes(q)) ||
              (v.model && v.model.toLowerCase().includes(q))
            );
          }
          return true;
        });
      }, [vehicles, projects, repClientFilter, repProjectFilter, repDateRange, repSearchQuery]);

      const reportTotals = useMemo(() => {
        let pdrTotal = 0, riTotal = 0, techTotal = 0;
        reportVehicles.forEach(v => {
          const p = Number(v.price) || 0;
          const r = Number(v.ri_price) || 0;
          pdrTotal += p;
          riTotal += r;
          techTotal += (p * ((v.tech_pdr_percent ?? 100) / 100)) + (r * ((v.tech_ri_percent ?? 100) / 100));
        });
        return {
          count: reportVehicles.length,
          pdr: pdrTotal.toFixed(2),
          ri: riTotal.toFixed(2),
          gross: (pdrTotal + riTotal).toFixed(2),
          tech: techTotal.toFixed(2)
        };
      }, [reportVehicles]);

      const exportCSV = () => {
        if (reportVehicles.length === 0) return alert("Žiadne vozidlá na export.");

        const headers = ["Dátum", "Interné číslo", "Číslo kalkulácie", "VIN", "ŠPZ", "Značka a Model", "AW / Kategória", "R&I", "PDR", "Spolu", "Poznámka"];
        const rows = reportVehicles.map(v => [
          new Date(v.created_at).toLocaleDateString(),
          v.internal_record_no || "",
          v.client_calc_no || "",
          v.vin || "",
          v.ecv || "",
          `${v.brand} ${v.model}`,
          v.aw_count ? `${v.aw_count} AW` : (v.price_category || ""),
          v.ri_price || 0,
          v.price || 0,
          (Number(v.price) + Number(v.ri_price || 0)).toFixed(2),
          `"${(v.note || "").replace(/"/g, '""')}"`
        ]);

        const csvContent = "\uFEFF" + [headers.join(";"), ...rows.map(r => r.join(";"))].join("\n");
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `PDR_Supis_${new Date().toISOString().slice(0, 10)}.csv`;
        link.click();
      };

      const exportPDF = () => {
        if (reportVehicles.length === 0) return alert("Žiadne vozidlá na export.");

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF("landscape", "mm", "a4");

        const clientObj = clients.find(c => c.id === repClientFilter);
        const projectObj = projects.find(p => p.id === repProjectFilter);
        const clientName = clientObj ? clientObj.name : "Všetci klienti";
        const projectName = projectObj ? projectObj.name : "Všetky miesta";

        doc.setFontSize(15);
        doc.setTextColor(30, 41, 59);
        doc.text("PDR Súpis vykonaných prác (Príloha k vyúčtovaniu)", 14, 15);

        doc.setFontSize(9);
        doc.setTextColor(100, 116, 139);
        doc.text(`Klient: ${clientName} | Miesto: ${projectName} | Mena: ${currency} | Vygenerované: ${new Date().toLocaleDateString()}`, 14, 21);
        doc.text(`Vozidlá: ${reportTotals.count} ks | Objem spolu: ${reportTotals.gross} ${currSymbol} (PDR: ${reportTotals.pdr} ${currSymbol}, R&I: ${reportTotals.ri} ${currSymbol})`, 14, 26);

        const tableRows = reportVehicles.map((v, index) => [
          index + 1,
          v.client_calc_no || "-",
          v.internal_record_no || "-",
          v.vin || "-",
          v.ecv || "-",
          `${v.brand} ${v.model}`,
          v.aw_count ? `${v.aw_count} AW` : (v.price_category || "-"),
          `${Number(v.ri_price || 0).toFixed(2)} ${currSymbol}`,
          `${Number(v.price || 0).toFixed(2)} ${currSymbol}`,
          `${(Number(v.price) + Number(v.ri_price || 0)).toFixed(2)} ${currSymbol}`
        ]);

        doc.autoTable({
          startY: 30,
          head: [["#", "Kalkulácia klienta", "Interné č.", "VIN", "ŠPZ", "Vozidlo", "AW / Kat", `R&I (${currSymbol})`, `PDR (${currSymbol})`, `Spolu (${currSymbol})`]],
          body: tableRows,
          theme: "grid",
          headStyles: { fillColor: [245, 158, 11], textColor: [0, 0, 0], fontStyle: "bold", fontSize: 8 },
          styles: { fontSize: 8, cellPadding: 1.8 },
          columnStyles: {
            0: { cellWidth: 8 },
            1: { cellWidth: 32, fontStyle: "bold" },
            3: { cellWidth: 38, font: "courier" },
            9: { halign: "right", fontStyle: "bold" }
          }
        });

        doc.save(`PDR_Supis_${clientName.replace(/\s+/g, "_")}_${new Date().toISOString().slice(0, 10)}.pdf`);
      };

      const toggleCurrency = () => {
        const next = currency === "EUR" ? "USD" : "EUR";
        setCurrency(next);
        localStorage.setItem("pdr_curr", next);
      };

      if (loadingUser) {
        return (
          <div className="flex flex-col items-center justify-center p-8 space-y-3">
            <i className="fa-solid fa-spinner fa-spin text-amber-500 text-3xl"></i>
            <p className="text-xs text-gray-400">Načítavam systém...</p>
          </div>
        );
      }

      // PRIHLASOVACIA OBRAZOVKA
      if (!currentUser) {
        return (
          <div className="max-w-md w-full p-3">
            <div className="text-center mb-6 space-y-2">
              <h1 className="text-3xl font-black tracking-tight">
                <span className="text-amber-500">PDR</span> <span className="text-gray-200">FlowBoard</span>
              </h1>
              <div className="inline-block border border-amber-500/40 px-3 py-0.5 rounded-md bg-amber-500/10">
                <span className="text-[10px] text-amber-400 font-bold uppercase tracking-[0.2em]">HAIL HAPPENS</span>
              </div>
            </div>

            <form onSubmit={handleAuthSubmit} className="bg-gray-800/95 border border-gray-700 rounded-2xl p-5 space-y-4 shadow-2xl">
              <div className="flex justify-between items-center border-b border-gray-700 pb-3">
                <h2 className="text-sm font-bold text-amber-400">
                  {isRegistering ? t.registerTitle : t.loginTitle}
                </h2>
                <div className="flex bg-gray-900 border border-gray-700 rounded-lg p-0.5 gap-0.5">
                  {["SK", "EN", "DE"].map(l => (
                    <button
                      key={l}
                      type="button"
                      onClick={() => { setLang(l); localStorage.setItem("pdr_lang", l); }}
                      className={`px-2 py-0.5 text-[10px] font-bold rounded ${lang === l ? "bg-amber-500 text-black" : "text-gray-400 hover:text-white"}`}
                    >
                      {l}
                    </button>
                  ))}
                </div>
              </div>

              {authError && (
                <div className="bg-red-900/40 border border-red-500/50 text-red-200 text-xs p-2.5 rounded-lg text-center font-medium">
                  {authError}
                </div>
              )}

              {isRegistering && (
                <div>
                  <label className="block text-[10px] text-gray-400 mb-1">{t.accountType}</label>
                  <div className="grid grid-cols-2 gap-2">
                    <button
                      type="button"
                      onClick={() => setAuthAccountType("solo")}
                      className={`py-2 px-2 text-[11px] font-bold rounded-lg border ${authAccountType === "solo" ? "bg-amber-500 border-amber-400 text-black" : "bg-gray-900 border-gray-700 text-gray-300"}`}
                    >
                      {t.soloTech}
                    </button>
                    <button
                      type="button"
                      onClick={() => setAuthAccountType("company")}
                      className={`py-2 px-2 text-[11px] font-bold rounded-lg border ${authAccountType === "company" ? "bg-amber-500 border-amber-400 text-black" : "bg-gray-900 border-gray-700 text-gray-300"}`}
                    >
                      {t.companyTeam}
                    </button>
                  </div>
                </div>
              )}

              {isRegistering && authAccountType === "company" && (
                <div>
                  <label className="block text-[10px] text-gray-400 mb-1">{t.roleLabel}</label>
                  <select 
                    value={authRole} 
                    onChange={e => setAuthRole(e.target.value)}
                    className="w-full bg-gray-900 border border-gray-600 rounded-lg p-2 text-xs text-amber-400 font-bold"
                  >
                    <option value="manager">{t.roleManager}</option>
                    <option value="employee">{t.roleEmployee}</option>
                  </select>
                </div>
              )}

              <div>
                <label className="block text-[10px] text-gray-400 mb-1">E-mail</label>
                <input type="email" value={authEmail} onChange={e => setAuthEmail(e.target.value)} placeholder={t.emailPlaceholder} className="w-full bg-gray-900 border border-gray-600 rounded-lg p-2 text-xs text-white" required />
              </div>

              <div>
                <label className="block text-[10px] text-gray-400 mb-1">Heslo</label>
                <input type="password" value={authPassword} onChange={e => setAuthPassword(e.target.value)} placeholder={t.passwordPlaceholder} className="w-full bg-gray-900 border border-gray-600 rounded-lg p-2 text-xs text-white" required />
              </div>

              {isRegistering && (
                <div>
                  <label className="block text-[10px] text-gray-400 mb-1">Potvrdenie hesla</label>
                  <input type="password" value={authConfirmPassword} onChange={e => setAuthConfirmPassword(e.target.value)} placeholder={t.confirmPasswordPlaceholder} className="w-full bg-gray-900 border border-gray-600 rounded-lg p-2 text-xs text-white" required />
                </div>
              )}

              <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-black font-extrabold py-3 rounded-xl text-sm shadow">
                {isRegistering ? t.registerBtn : t.loginBtn}
              </button>

              <div className="text-center pt-1">
                <button type="button" onClick={() => { setIsRegistering(!isRegistering); setAuthError(""); }} className="text-xs text-amber-400 hover:underline">
                  {isRegistering ? t.switchToLogin : t.switchToReg}
                </button>
              </div>
            </form>
          </div>
        );
      }

      // HLAVNÁ APLIKÁCIA PRE PRIHLÁSENÉHO POUŽÍVATEĽA
      return (
        <div className="max-w-md mx-auto w-full p-2 pb-24">
          <input type="file" accept="image/*" ref={cameraInputRef} onChange={handlePhotoCapture} className="hidden" />
          <input type="file" accept="image/*" ref={damagePhotoInputRef} onChange={handleDamagePhotoAdd} className="hidden" />
          <input type="file" accept="image/*" ref={cardClientInputRef} onChange={() => {}} className="hidden" />

          {/* NAHRÁVANIE OVERLAY */}
          {isUploading && (
            <div className="fixed inset-0 bg-black/90 z-50 flex flex-col justify-center items-center p-6 space-y-3 text-center">
              <i className="fa-solid fa-cloud-arrow-up text-amber-500 text-4xl animate-bounce"></i>
              <p className="text-white font-extrabold text-sm">{uploadStatusText}</p>
            </div>
          )}

          {/* DETAIL KARTA VOZIDLA SO SPÄTNÝM DOPLNENÍM CENY */}
          {selectedVehicleDetail && (
            <div className="fixed inset-0 bg-black/85 z-50 flex flex-col justify-end">
              <div className="fixed inset-0" onClick={() => setSelectedVehicleDetail(null)}></div>
              <div className="relative bg-gray-900 border-t border-amber-500/60 rounded-t-2xl p-4 shadow-2xl z-10 bottom-sheet max-h-[92vh] overflow-y-auto space-y-3">
                <div className="w-12 h-1 bg-gray-700 rounded-full mx-auto"></div>
                <div className="flex justify-between items-start border-b border-gray-800 pb-2">
                  <div>
                    <span className="text-[10px] font-bold text-amber-400 font-mono">{selectedVehicleDetail.client_calc_no || "Bez kalkulácie"}</span>
                    <h3 className="text-base font-black text-white">{selectedVehicleDetail.brand} {selectedVehicleDetail.model} ({selectedVehicleDetail.ecv})</h3>
                    <p className="text-[10px] text-gray-400 font-mono">VIN: {selectedVehicleDetail.vin}</p>
                  </div>
                  <button onClick={() => setSelectedVehicleDetail(null)} className="text-gray-400 hover:text-white p-1">
                    <i className="fa-solid fa-circle-xmark text-xl"></i>
                  </button>
                </div>

                {selectedVehicleDetail.is_price_pending && (
                  <div className="p-3 bg-amber-500/15 border border-amber-500/50 rounded-xl space-y-2">
                    <div className="flex justify-between items-center text-[10px] font-bold text-amber-400">
                      <span><i className="fa-solid fa-lock-open mr-1"></i> CENA NEZNÁMA (OTVORENÝ VSTUP)</span>
                      <span>{selectedVehicleDetail.aw_count ? `${selectedVehicleDetail.aw_count} AW` : ""}</span>
                    </div>
                    <div className="flex gap-2">
                      <input 
                        type="number" 
                        inputMode="decimal"
                        value={latePriceInput} 
                        onChange={e => setLatePriceInput(e.target.value)} 
                        placeholder={`Schválená suma v ${currSymbol}`}
                        className="flex-1 bg-gray-950 border border-amber-500 rounded p-1.5 text-xs text-amber-300 font-bold"
                      />
                      <button 
                        type="button" 
                        onClick={() => handleSaveLatePrice(selectedVehicleDetail.id)}
                        className="bg-amber-500 text-black font-extrabold px-3 rounded text-xs shadow"
                      >
                        Uložiť cenu
                      </button>
                    </div>
                  </div>
                )}

                {selectedVehicleDetail.note && (
                  <div className="p-2.5 bg-gray-800 rounded-xl border border-gray-700 space-y-1">
                    <div className="flex justify-between items-center text-[9px] font-bold text-amber-400">
                      <span><i className="fa-solid fa-shield-halved mr-1"></i> OCHRANNÁ POZNÁMKA S PEČIATKOU</span>
                      <span>{selectedVehicleDetail.note_created_at ? new Date(selectedVehicleDetail.note_created_at).toLocaleString() : ""}</span>
                    </div>
                    <p className="text-xs text-gray-200">{selectedVehicleDetail.note}</p>
                  </div>
                )}

                <div className="space-y-1.5">
                  <p className="text-[10px] font-bold text-gray-400 uppercase">Evidenčné fotografie</p>
                  <div className="grid grid-cols-3 gap-1.5">
                    {selectedVehicleDetail.photo_vin_url && <a href={selectedVehicleDetail.photo_vin_url} target="_blank"><img src={selectedVehicleDetail.photo_vin_url} className="h-20 w-full object-cover rounded border border-gray-700" /></a>}
                    {selectedVehicleDetail.photo_rear_url && <a href={selectedVehicleDetail.photo_rear_url} target="_blank"><img src={selectedVehicleDetail.photo_rear_url} className="h-20 w-full object-cover rounded border border-gray-700" /></a>}
                    {selectedVehicleDetail.photo_sheet_url && <a href={selectedVehicleDetail.photo_sheet_url} target="_blank"><img src={selectedVehicleDetail.photo_sheet_url} className="h-20 w-full object-cover rounded border border-gray-700" /></a>}
                  </div>
                </div>

                {selectedVehicleDetail.damage_photos?.length > 0 && (
                  <div className="space-y-1.5 pt-1 border-t border-gray-800">
                    <p className="text-[10px] font-bold text-amber-400 uppercase">Detaily poškodenia ({selectedVehicleDetail.damage_photos.length} fotiek)</p>
                    <div className="grid grid-cols-3 gap-1.5">
                      {selectedVehicleDetail.damage_photos.map((url, i) => (
                        <a key={i} href={url} target="_blank"><img src={url} className="h-20 w-full object-cover rounded border border-amber-500/60" /></a>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* BOTTOM SHEET S PLNÝMI ÚPRAVAMI (EDIT) */}
          {activeBottomSheet && (
            <div className="fixed inset-0 bg-black/80 z-50 flex flex-col justify-end">

                  const filteredLocations = clientProjects.filter(p => {
                    if (!locationSearchFilter.trim()) return true;
                    const f = locationSearchFilter.toLowerCase();
                    return (p.name && p.name.toLowerCase().includes(f)) || (p.address && p.address.toLowerCase().includes(f));
                  });

                  return (
                    <div key={c.id} className="bg-gray-800 rounded-xl border border-gray-700 overflow-hidden">
                      <div onClick={() => setSelectedClientDetailId(isOpen ? null : c.id)} className="p-3 flex justify-between items-center cursor-pointer hover:bg-gray-750">
                        <div>
                          <div className="flex items-center gap-2">
                            <h4 className="font-extrabold text-white text-sm">{c.name}</h4>
                            {c.calc_prefix && <span className="text-[9px] bg-amber-500/20 text-amber-300 px-1 py-0.5 rounded font-mono font-bold">{c.calc_prefix}</span>}
                          </div>
                          <p className="text-[10px] text-gray-400 mt-0.5">{clientProjects.length} miest</p>
                        </div>
                        <div className="flex items-center gap-2">
                          <button type="button" onClick={(e) => { e.stopPropagation(); handleOpenSheet("client", c); }} className="text-xs px-2 py-1 rounded border bg-gray-900 text-amber-400 border-gray-700 font-bold">
                            <i className="fa-solid fa-address-card"></i>
                          </button>
                          <i className={`fa-solid ${isOpen ? "fa-chevron-up" : "fa-chevron-down"} text-xs text-gray-400`}></i>
                        </div>
                      </div>

                      {isOpen && (
                        <div className="p-3 bg-gray-900/70 border-t border-gray-700 space-y-2.5">
                          <div className="flex justify-between items-center gap-2">
                            <input type="text" value={locationSearchFilter} onChange={e => setLocationSearchFilter(e.target.value)} placeholder={t.searchLocationsPlaceholder} className="flex-1 bg-gray-950 border border-gray-700 rounded-lg px-2.5 py-1 text-xs text-white" />
                            <button onClick={() => { setAddingProjectClientId(addingProjectClientId === c.id ? null : c.id); setProjectCategoriesList([]); }} className="bg-amber-500 hover:bg-amber-400 text-black font-extrabold px-2.5 py-1 rounded-lg text-xs shadow whitespace-nowrap">
                              + Miesto
                            </button>
                          </div>

                          {addingProjectClientId === c.id && (
                            <div className="bg-gray-950 p-2.5 rounded-xl border border-amber-500/50 space-y-2">
                              <input type="text" value={newProjectName} onChange={e => setNewProjectName(e.target.value)} placeholder="Názov miesta" className="w-full bg-gray-900 border border-gray-700 rounded p-1 text-xs text-white" />
                              <input type="text" value={newProjectAddress} onChange={e => setNewProjectAddress(e.target.value)} placeholder="Adresa servisu" className="w-full bg-gray-900 border border-gray-700 rounded p-1 text-xs text-gray-200" />
                              
                              <div className="grid grid-cols-3 gap-1">
                                {["free", "fixed", "categories"].map(mode => (
                                  <button key={mode} type="button" onClick={() => setNewProjectPricingMode(mode)} className={`py-1 text-[9px] font-bold rounded uppercase border ${newProjectPricingMode === mode ? "bg-amber-500 text-black border-amber-400" : "bg-gray-900 text-gray-300 border-gray-700"}`}>
                                    {mode}
                                  </button>
                                ))}
                              </div>

                              {newProjectPricingMode === "fixed" && (
                                <input type="number" inputMode="decimal" value={newProjectFixedPrice} onChange={e => setNewProjectFixedPrice(e.target.value)} placeholder={`Fixná sadzba (${currSymbol})`} className="w-full bg-gray-900 border border-gray-700 rounded p-1 text-xs text-amber-300 font-bold" />
                              )}

                              {/* GENERÁTOR KATEGÓRIÍ (Cat 1: 350 €) */}
                              {newProjectPricingMode === "categories" && (
                                <div className="p-2 bg-gray-900 rounded border border-gray-700 space-y-2">
                                  <div className="flex gap-1.5">
                                    <input 
                                      type="number" 
                                      inputMode="decimal"
                                      value={tempCategoryPrice} 
                                      onChange={e => setTempCategoryPrice(e.target.value)} 
                                      placeholder={`Suma pre Cat ${projectCategoriesList.length + 1} (${currSymbol})`}
                                      className="flex-1 bg-gray-950 border border-amber-500/50 rounded p-1 text-xs text-amber-400 font-bold"
                                    />
                                    <button type="button" onClick={handleAddCategoryItem} className="bg-amber-500 text-black font-extrabold px-3 py-1 text-xs rounded shadow">
                                      + Pridať Cat
                                    </button>
                                  </div>

                                  <div className="flex flex-wrap gap-1">
                                    {projectCategoriesList.map((cat, i) => (
                                      <span key={i} className="inline-flex items-center gap-1 bg-gray-950 border border-amber-500/40 text-amber-300 px-2 py-0.5 rounded text-[10px] font-bold">
                                        {cat.label}: {cat.price} {currSymbol}
                                        <button type="button" onClick={() => handleRemoveCategoryItem(i)} className="text-red-400 hover:text-red-200 ml-1">×</button>
                                      </span>
                                    ))}
                                  </div>
                                </div>
                              )}

                              <div className="grid grid-cols-2 gap-1.5">
                                <input type="number" inputMode="decimal" value={newProjectTechPdrPercent} onChange={e => setNewProjectTechPdrPercent(e.target.value)} placeholder="% PDR (100)" className="bg-gray-900 border border-gray-700 rounded p-1 text-xs text-amber-400 font-bold" />
                                <input type="number" inputMode="decimal" value={newProjectAwRate} onChange={e => setNewProjectAwRate(e.target.value)} placeholder={`Sadzba AW (${currSymbol})`} className="bg-gray-900 border border-gray-700 rounded p-1 text-xs text-amber-400 font-bold" />
                              </div>

                              <button type="button" onClick={async () => {
                                if (!newProjectName.trim()) return;
                                const { data, error } = await supabase.from("projects").insert([{ 
                                  client_id: c.id, 
                                  name: newProjectName.trim(), 
                                  address: newProjectAddress.trim() || null,
                                  pricing_mode: newProjectPricingMode,
                                  fixed_price: newProjectPricingMode === "fixed" ? Number(newProjectFixedPrice) || 0 : null,
                                  pricing_categories: newProjectPricingMode === "categories" ? projectCategoriesList : null,
                                  tech_pdr_percent: parseFloat(newProjectTechPdrPercent) || 100,
                                  tech_ri_percent: parseFloat(newProjectTechRiPercent) || 100,
                                  aw_rate: newProjectAwRate ? parseFloat(newProjectAwRate) : null,
                                  is_active: true,
                                  created_by: currentUser.id 
                                }]).select();

                                if (!error && data) {
                                  setProjects([...projects, data[0]]);
                                  handleProjectChange(data[0].id);
                                  setNewProjectName("");
                                  setProjectCategoriesList([]);
                                  setAddingProjectClientId(null);
                                }
                              }} className="w-full bg-amber-500 text-black font-extrabold py-1.5 text-xs rounded">Uložiť miesto</button>
                            </div>
                          )}

                          <div className="space-y-1">
                            {filteredLocations.map(p => (
                              <div key={p.id} className={`text-xs p-2 rounded border flex justify-between items-center ${p.is_active === false ? "bg-red-950/20 border-red-900/40 opacity-70" : "bg-gray-950 border-gray-800"}`}>
                                <div>
                                  <div className="flex items-center gap-1.5">
                                    <span className="font-bold text-white">{p.name}</span>
                                    <span className="text-[8px] uppercase bg-gray-800 text-amber-400 px-1 py-0.2 rounded font-bold">{p.pricing_mode}</span>
                                    {p.is_active === false && <span className="text-[8px] bg-red-900 text-red-200 px-1 py-0.2 rounded uppercase font-bold">Archivované</span>}
                                  </div>
                                  {p.address && <p className="text-[9px] text-gray-400 mt-0.5">{p.address}</p>}
                                </div>
                                <div className="flex items-center gap-1.5">
                                  <button type="button" onClick={() => handleOpenSheet("project", p)} className="text-[10px] px-2 py-1 bg-gray-900 border border-gray-700 rounded text-amber-400 font-bold">
                                    Detail / Edit
                                  </button>
                                  <button 
                                    type="button" 
                                    onClick={() => handleToggleArchiveProject(p.id, p.is_active !== false)}
                                    className={`text-[9px] px-2 py-1 rounded font-bold border ${p.is_active === false ? "bg-gray-800 text-green-400 border-green-600/50" : "bg-gray-900 text-red-400 border-red-500/40"}`}
                                  >
                                    {p.is_active === false ? "Obnoviť" : "Archivovať"}
                                  </button>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          ) : (
            /* 3. KARTA: SÚPIS & REPORTY (PÁROVACÍ REPORT) */
            <div className="space-y-3">
              <div className="bg-gray-800 p-2.5 rounded-xl border border-gray-700 space-y-2">
                <input 
                  type="text" 
                  value={repSearchQuery} 
                  onChange={e => setRepSearchQuery(e.target.value)} 
                  placeholder={t.searchPlaceholder} 
                  className="w-full bg-gray-900 border border-gray-700 rounded-lg p-1.5 text-xs text-white"
                />

                <div className="grid grid-cols-3 gap-1.5 text-[10px]">
                  <select value={repClientFilter} onChange={e => { setRepClientFilter(e.target.value); setRepProjectFilter("all"); }} className="bg-gray-900 border border-gray-700 rounded p-1 text-white">
                    <option value="all">Všetci klienti</option>
                    {clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                  </select>

                  <select value={repProjectFilter} onChange={e => setRepProjectFilter(e.target.value)} className="bg-gray-900 border border-gray-700 rounded p-1 text-amber-400">
                    <option value="all">Všetky miesta</option>
                    {projects.filter(p => repClientFilter === "all" || p.client_id === repClientFilter).map(p => (
                      <option key={p.id} value={p.id}>{p.name}</option>
                    ))}
                  </select>

                  <select value={repDateRange} onChange={e => setRepDateRange(e.target.value)} className="bg-gray-900 border border-gray-700 rounded p-1 text-white">
                    <option value="all">Všetky dátumy</option>
                    <option value="month">Posledných 30 dní</option>
                    <option value="week">Posledných 7 dní</option>
                  </select>
                </div>
              </div>

              {/* SÚČTOVÉ KARTY */}
              <div className="grid grid-cols-3 gap-1.5 text-center">
                <div className="bg-gray-800 p-2 rounded-xl border border-gray-700">
                  <span className="text-[9px] text-gray-400 uppercase font-bold">Vozidlá</span>
                  <p className="text-sm font-black text-white">{reportTotals.count} ks</p>
                </div>
                <div className="bg-gray-800 p-2 rounded-xl border border-gray-700">
                  <span className="text-[9px] text-gray-400 uppercase font-bold">Fakturované</span>
                  <p className="text-sm font-black text-amber-400">{reportTotals.gross} {currSymbol}</p>
                </div>
                <div className="bg-gray-800 p-2 rounded-xl border border-amber-500/40 bg-amber-500/10">
                  <span className="text-[9px] text-amber-300 uppercase font-bold">Tvoj podiel</span>
                  <p className="text-sm font-black text-amber-400">~{reportTotals.tech} {currSymbol}</p>
                </div>
              </div>

              {/* EXPORT TLAČIDLÁ */}
              <div className="flex gap-2">
                <button onClick={exportPDF} className="flex-1 bg-amber-500 hover:bg-amber-400 text-black font-extrabold py-2 px-3 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow">
                  <i className="fa-solid fa-file-pdf"></i>
                  <span>Stiahnuť PDF súpis (A4)</span>
                </button>
                <button onClick={exportCSV} className="bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-300 font-bold py-2 px-3 rounded-xl text-xs flex items-center justify-center gap-1.5">
                  <i className="fa-solid fa-file-csv"></i>
                  <span>CSV</span>
                </button>
              </div>

              {/* ŽIVÝ ZOZNAM S PÁROVANÍM */}
              <div className="space-y-1.5">
                {reportVehicles.length === 0 ? (
                  <p className="p-6 text-center text-xs text-gray-500">{t.noVehicles}</p>
                ) : (
                  reportVehicles.map(v => (
                    <div key={v.id} onClick={() => { setSelectedVehicleDetail(v); setLatePriceInput(""); }} className="bg-gray-800 p-2.5 rounded-xl border border-gray-700 flex justify-between items-center cursor-pointer hover:border-amber-500/50">
                      <div>
                        <div className="flex items-center gap-1.5">
                          <span className="text-xs font-bold text-amber-400 font-mono">{v.client_calc_no || "Bez kalkulácie"}</span>
                          <span className="text-xs font-bold text-white">{v.brand} {v.model}</span>
                        </div>
                        <p className="text-[9px] text-gray-400 font-mono">VIN: {v.vin} | ŠPZ: {v.ecv}</p>
                        {v.note && <p className="text-[9px] text-yellow-400 truncate max-w-[200px]"><i className="fa-solid fa-shield-halved mr-1"></i>{v.note}</p>}
                      </div>
                      <div className="text-right">
                        {v.is_price_pending ? (
                          <span className="text-[10px] bg-yellow-500/20 text-yellow-300 font-bold px-2 py-0.5 rounded border border-yellow-500/30">
                            {v.aw_count ? `${v.aw_count} AW` : "Cena neznáma"}
                          </span>
                        ) : (
                          <div>
                            <span className="text-xs bg-amber-500/20 text-amber-300 font-bold px-2 py-0.5 rounded">
                              {(Number(v.price) + Number(v.ri_price || 0)).toFixed(2)} {currSymbol}
                            </span>
                            <p className="text-[8px] text-gray-400 mt-0.5">Podiel: ~{((Number(v.price) * (v.tech_pdr_percent/100)) + (Number(v.ri_price || 0) * (v.tech_ri_percent/100))).toFixed(2)} {currSymbol}</p>
                          </div>
                        )}
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
