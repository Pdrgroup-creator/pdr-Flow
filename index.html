    const SUPABASE_KEY = "VLOZ_SEM_SVOJ_ANON_PUBLIC_KLUC_ZACINAJUCI_NA_eyJ";

    const COLOR_DATA = {

      DE: {

        tabProjects: "Projekte & Kunden",

        scanBtn: "Scan Car (FIN / Heck / Formular)",

        passwordMismatch: "Passwörter stimmen nicht überein!",
        passwordTooShort: "Mindestens 6 Zeichen erforderlich.",
        loginBtn: "Anmelden",
        registerBtn: "Registrieren",
        accountType: "Kontotyp",
        soloTech: "Solo-Techniker",
        companyTeam: "Unternehmen / Team",
        roleLabel: "Rolle",
        roleManager: "Manager",
        roleEmployee: "Mitarbeiter",
        switchToReg: "Registrieren",
        switchToLogin: "Anmelden",
        logout: "Abmelden",
        settingsTitle: "Kontoeinstellungen",
        newPasswordPlaceholder: "Neues Passwort",
        updatePasswordBtn: "Passwort aktualisieren",
        passwordUpdated: "Passwort erfolgreich geändert!",
        searchPlaceholder: "Suche FIN, KZ, Kalkulations-Nr..."
      }
    };

    function App() {
      const [lang, setLang] = useState(() => localStorage.getItem("pdr_lang") || "SK");
      const [activeTab, setActiveTab] = useState("vehicles");
      const t = TRANSLATIONS[lang];
      const colorOptions = COLOR_DATA[lang];

      const [currentUser, setCurrentUser] = useState(null);
      const [loadingUser, setLoadingUser] = useState(true);
      const [authError, setAuthError] = useState("");

      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [newAccountPassword, setNewAccountPassword] = useState("");
      const [settingsMsg, setSettingsMsg] = useState("");

      const [isRegistering, setIsRegistering] = useState(false);
      const [authEmail, setAuthEmail] = useState("");
      const [authPassword, setAuthPassword] = useState("");
      const [authConfirmPassword, setAuthConfirmPassword] = useState("");
      const [authAccountType, setAuthAccountType] = useState("solo");
      const [authRole, setAuthRole] = useState("manager");

      const [clients, setClients] = useState([]);
      const [projects, setProjects] = useState([]);
      const [vehicles, setVehicles] = useState([]);

      const [selectedClientId, setSelectedClientId] = useState("");
      const [selectedProjectId, setSelectedProjectId] = useState("");

      const [isAddingProject, setIsAddingProject] = useState(false);
      const [newProjectName, setNewProjectName] = useState("");
      const [isAddingClient, setIsAddingClient] = useState(false);
      const [newClientName, setNewClientName] = useState("");
      const [newClientPrefix, setNewClientPrefix] = useState("");
      const [newClientAutoNum, setNewClientAutoNum] = useState(true);

      const [searchTerm, setSearchTerm] = useState("");

      const cameraInputRef = useRef(null);
      const [scanStep, setScanStep] = useState(0);
      const [vinPhoto, setVinPhoto] = useState(null);
      const [rearPhoto, setRearPhoto] = useState(null);
      const [sheetPhoto, setSheetPhoto] = useState(null);
      const [isAnalyzing, setIsAnalyzing] = useState(false);

      const [clientCalcNo, setClientCalcNo] = useState("");
      const [vin, setVin] = useState("");
      const [ecv, setEcv] = useState("");
      const [hasNoEcv, setHasNoEcv] = useState(false);
      const [brand, setBrand] = useState("");
      const [model, setModel] = useState("");
      const [color, setColor] = useState(colorOptions[2]);
      const [price, setPrice] = useState("");
      const [riPrice, setRiPrice] = useState("");
      const [isPricePending, setIsPricePending] = useState(false);

      useEffect(() => {
        const fetchUserProfile = async (session) => {
          if (!session?.user) {
            setCurrentUser(null);
            setLoadingUser(false);
            return;
          }

          try {
            const { data: profile } = await supabase
              .from("profiles")
              .select("*")
              .eq("id", session.user.id)
              .maybeSingle();

            setCurrentUser({
              id: session.user.id,
              email: session.user.email,
              accountType: profile?.account_type || "solo",
              role: profile?.role || "solo"
            });
          } catch (err) {
            setCurrentUser({
              id: session.user.id,
              email: session.user.email,
              accountType: "solo",
              role: "solo"
            });
          } finally {
            setLoadingUser(false);
          }
        };

        supabase.auth.getSession().then(({ data: { session } }) => {
          fetchUserProfile(session);
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          fetchUserProfile(session);
        });

        return () => subscription.unsubscribe();
      }, []);

      const loadData = async () => {
        try {
          const { data: cData } = await supabase.from("clients").select("*").order("name");
          if (cData) setClients(cData);

          const { data: pData } = await supabase.from("projects").select("*").order("name");
          if (pData) setProjects(pData);

          const { data: vData } = await supabase.from("vehicles").select("*").order("created_at", { ascending: false });
          if (vData) setVehicles(vData);

          if (cData && cData.length > 0 && !selectedClientId) {
            setSelectedClientId(cData[0].id);
          }
        } catch (e) {
          console.error("Data load err:", e);
        }
      };

      useEffect(() => {
        if (currentUser) {
          loadData();
        }
      }, [currentUser]);

      const availableProjects = useMemo(() => {
        return projects.filter(p => p.client_id === selectedClientId);
      }, [projects, selectedClientId]);

      useEffect(() => {
        if (availableProjects.length > 0) {
          setSelectedProjectId(availableProjects[0].id);
        } else {
          setSelectedProjectId("");
        }
      }, [availableProjects]);

      // Automatické predvyplnenie čísla kalkulácie podľa vybraného klienta
      useEffect(() => {
        if (!selectedClientId) return;
        const currentClient = clients.find(c => c.id === selectedClientId);
        const currentYear = new Date().getFullYear();

        if (currentClient && currentClient.auto_numbering && currentClient.calc_prefix) {
          // Zistíme koľko vozidiel už má daný klient v tomto roku
          const clientProjectIds = projects.filter(p => p.client_id === selectedClientId).map(p => p.id);
          const clientVehiclesThisYear = vehicles.filter(v => 
            clientProjectIds.includes(v.project_id) && 
            v.client_calc_no && 
            v.client_calc_no.includes(`/${currentYear}/`)
          );
          const nextSeq = String(clientVehiclesThisYear.length + 1).padStart(3, '0');
          setClientCalcNo(`${currentClient.calc_prefix}/${currentYear}/${nextSeq}`);
        } else {
          // Klient bez automatického radu - ponecháme voľné na manuálne zadanie
          setClientCalcNo("");
        }
      }, [selectedClientId, clients, projects, vehicles]);

      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        setAuthError("");

        if (isRegistering) {
          if (authPassword.length < 6) {
            setAuthError(t.passwordTooShort);
            return;
          }
          if (authPassword !== authConfirmPassword) {
            setAuthError(t.passwordMismatch);
            return;
          }

          const roleToAssign = authAccountType === "company" ? authRole : "solo";
          const { error } = await supabase.auth.signUp({
            email: authEmail,
            password: authPassword,
            options: {
              data: {
                account_type: authAccountType,
                role: roleToAssign
              }
            }
          });

          if (error) setAuthError(error.message);
        } else {
          const { error } = await supabase.auth.signInWithPassword({
            email: authEmail,
            password: authPassword
          });

          if (error) setAuthError(error.message);
        }
      };

      const handlePasswordUpdate = async (e) => {
        e.preventDefault();
        setSettingsMsg("");
        if (newAccountPassword.length < 6) {
          setSettingsMsg("Heslo musí mať aspoň 6 znakov.");
          return;
        }

        const { error } = await supabase.auth.updateUser({
          password: newAccountPassword
        });

        if (error) {
          setSettingsMsg("Chyba: " + error.message);
        } else {
          setSettingsMsg(t.passwordUpdated);
          setNewAccountPassword("");
          setTimeout(() => setShowSettingsModal(false), 1500);
        }
      };

      const handleLogout = async () => {
        await supabase.auth.signOut();
        setCurrentUser(null);
      };

      const handleCreateClient = async (e) => {
        e.preventDefault();
        if (!newClientName.trim()) return;

        const { data, error } = await supabase.from("clients").insert([
          { 
            name: newClientName.trim(), 
            calc_prefix: newClientPrefix.trim() ? newClientPrefix.trim().toUpperCase() : null,
            auto_numbering: newClientAutoNum,
            created_by: currentUser.id 
          }
        ]).select();

        if (!error && data) {
          setClients([...clients, data[0]]);
          setSelectedClientId(data[0].id);
          setNewClientName("");
          setNewClientPrefix("");
          setIsAddingClient(false);
        }
      };

      const handleCreateProject = async (e) => {
        e.preventDefault();
        if (!newProjectName.trim() || !selectedClientId) return;

        const { data, error } = await supabase.from("projects").insert([
          { 
            client_id: selectedClientId, 
            name: newProjectName.trim(), 
            created_by: currentUser.id 
          }
        ]).select();

        if (!error && data) {
          setProjects([...projects, data[0]]);
          setSelectedProjectId(data[0].id);
          setNewProjectName("");
          setIsAddingProject(false);
        }
      };

      const startScanning = () => {
        setScanStep(1);
        if (cameraInputRef.current) cameraInputRef.current.click();
      };

      const handlePhotoCapture = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const photoUrl = URL.createObjectURL(file);
        if (scanStep === 1) {
          setVinPhoto(photoUrl);
          setIsAnalyzing(true);
          setTimeout(() => {
            setVin("WVWZZZ3CZWE987654");
            setIsAnalyzing(false);
          }, 800);
        } else if (scanStep === 2) {
          setRearPhoto(photoUrl);
          setIsAnalyzing(true);
          setTimeout(() => {
            setEcv("BL-555YY");
            setBrand("Volkswagen");
            setModel("Passat Variant");
            setIsAnalyzing(false);
          }, 800);
        } else if (scanStep === 3) {
          setSheetPhoto(photoUrl);
          setScanStep(0);
        }
      };

      const handleSaveVehicle = async (e) => {
        e.preventDefault();
        if (!selectedProjectId) {
          alert("Vyberte alebo vytvorte najprv Projekt / Miesto.");
          return;
        }

        // Tvorba interného evidenčného čísla technika na pozadí (napr. HLA/2026/114)
        const currentYear = new Date().getFullYear();
        const techPrefix = (currentUser.email.split('@')[0].split('.')[1] || currentUser.email.substring(0, 3)).toUpperCase().substring(0, 4);
        const internalSeq = String(vehicles.length + 1).padStart(3, '0');
        const generatedInternalRecordNo = `${techPrefix}/${currentYear}/${internalSeq}`;

        const newVehicleRecord = {
          project_id: selectedProjectId,
          created_by: currentUser.id,
          internal_record_no: generatedInternalRecordNo,
          client_calc_no: clientCalcNo || null,
          ri_price: Number(riPrice) || 0.00,
          vin: vin || "N/A",
          ecv: hasNoEcv ? "Bez ŠPZ" : (ecv || "N/A"),
          has_no_ecv: hasNoEcv,
          brand: brand || "Neznáma",
          model: model || "Neznámy",
          color: color,
          price: isPricePending ? 0 : (Number(price) || 0),
          is_price_pending: isPricePending
        };

        const { data, error } = await supabase.from("vehicles").insert([newVehicleRecord]).select();

        if (error) {
          alert("Chyba pri ukladaní: " + error.message);
        } else if (data) {
          setVehicles([data[0], ...vehicles]);
          alert("Vozidlo bolo úspešne uložené!");
          setVin("");
          setEcv("");
          setBrand("");
          setModel("");
          setPrice("");
          setRiPrice("");
          setIsPricePending(false);
          setVinPhoto(null);
          setRearPhoto(null);
          setSheetPhoto(null);
        }
      };

      // Filtrovanie vozidiel pre vyhľadávanie v reportoch
      const filteredVehicles = useMemo(() => {
        if (!searchTerm.trim()) return vehicles;
        const term = searchTerm.toLowerCase();
        return vehicles.filter(v => 
          (v.client_calc_no && v.client_calc_no.toLowerCase().includes(term)) ||
          (v.internal_record_no && v.internal_record_no.toLowerCase().includes(term)) ||
          (v.vin && v.vin.toLowerCase().includes(term)) ||
          (v.ecv && v.ecv.toLowerCase().includes(term)) ||
          (v.brand && v.brand.toLowerCase().includes(term)) ||
          (v.model && v.model.toLowerCase().includes(term))
        );
      }, [vehicles, searchTerm]);

      if (loadingUser) {
        return (
          <div className="flex flex-col items-center justify-center p-8 space-y-3">
            <i className="fa-solid fa-spinner fa-spin text-amber-500 text-3xl"></i>
            <p className="text-xs text-gray-400">Načítavam systém...</p>
          </div>
        );
      }

      if (!currentUser) {
        return (
          <div className="max-w-md w-full p-4">
            <div className="text-center mb-6 space-y-2">
              <h1 className="text-3xl font-black tracking-tight">
                <span className="text-amber-500">PDR</span> <span className="text-gray-200">FlowBoard</span>
              </h1>
              <div className="inline-block border border-amber-500/40 px-3 py-0.5 rounded-md bg-amber-500/10">
                <span className="text-[10px] text-amber-400 font-bold uppercase tracking-[0.2em]">HAIL HAPPENS</span>
              </div>
            </div>

            <form onSubmit={handleAuthSubmit} className="login-container p-5 space-y-4">
              <div className="flex justify-between items-center border-b border-gray-700 pb-3">
                <h2 className="text-sm font-bold text-amber-400">
                  {isRegistering ? t.registerTitle : t.loginTitle}
                </h2>
                <div className="flex bg-gray-900 border border-gray-700 rounded-lg p-0.5 gap-0.5">
                  {["SK", "EN", "DE"].map(l => (
                    <button
                      key={l}
                      type="button"
                      onClick={() => setLang(l)}
                      className={`px-2 py-0.5 text-[10px] font-bold rounded ${lang === l ? 'bg-amber-500 text-black' : 'text-gray-400 hover:text-white'}`}
                    >
                      {l}
                    </button>
                  ))}
                </div>
              </div>

              {authError && (
                <div className="bg-red-900/40 border border-red-500/50 text-red-200 text-xs p-2.5 rounded-lg text-center font-medium">
                  {authError}
                </div>
              )}

              {isRegistering && (
                <div>
                  <label className="block text-[10px] text-gray-400 mb-1">{t.accountType}</label>
                  <div className="grid grid-cols-2 gap-2">
                    <button
                      type="button"
                      onClick={() => setAuthAccountType("solo")}
                      className={`py-2 px-2 text-[11px] font-bold rounded-lg border ${authAccountType === 'solo' ? 'bg-amber-500 border-amber-400 text-black' : 'bg-gray-900 border-gray-700 text-gray-300'}`}
                    >
                      {t.soloTech}
                    </button>
                    <button
                      type="button"
                      onClick={() => setAuthAccountType("company")}
                      className={`py-2 px-2 text-[11px] font-bold rounded-lg border ${authAccountType === 'company' ? 'bg-amber-500 border-amber-400 text-black' : 'bg-gray-900 border-gray-700 text-gray-300'}`}
                    >
                      {t.companyTeam}
                    </button>
                  </div>
                </div>
              )}

              {isRegistering && authAccountType === "company" && (
                <div>
                  <label className="block text-[10px] text-gray-400 mb-1">{t.roleLabel}</label>
                  <select 
                    value={authRole} 
                    onChange={e => setAuthRole(e.target.value)}
                    className="w-full bg-gray-900 border border-gray-600 rounded-lg p-2 text-xs text-amber-400 font-bold"
                  >
                    <option value="manager">{t.roleManager}</option>
                    <option value="employee">{t.roleEmployee}</option>
                  </select>
                </div>
              )}

              <div>
                <label className="block text-[10px] text-gray-400 mb-1">E-mail</label>
                <input 
                  type="email" 
                  value={authEmail} 
                  onChange={e => setAuthEmail(e.target.value)} 
                  placeholder={t.emailPlaceholder} 
                  className="w-full bg-gray-900 border border-gray-600 rounded-lg p-2 text-xs text-white" 
                  required 
                />
              </div>

              <div>
                <label className="block text-[10px] text-gray-400 mb-1">Heslo</label>
                <input 
                  type="password" 
                  value={authPassword} 
                  onChange={e => setAuthPassword(e.target.value)} 
                  placeholder={t.passwordPlaceholder} 
                  className="w-full bg-gray-900 border border-gray-600 rounded-lg p-2 text-xs text-white" 
                  required 
                />
              </div>

              {isRegistering && (
                <div>
                  <label className="block text-[10px] text-gray-400 mb-1">Potvrdenie hesla</label>
                  <input 
                    type="password" 
                    value={authConfirmPassword} 
                    onChange={e => setAuthConfirmPassword(e.target.value)} 
                    placeholder={t.confirmPasswordPlaceholder} 
                    className={`w-full bg-gray-900 border rounded-lg p-2 text-xs text-white ${
                      authConfirmPassword && authPassword !== authConfirmPassword 
                        ? 'border-red-500 focus:border-red-500' 
                        : 'border-gray-600'
                    }`} 
                    required 
                  />
                  {authConfirmPassword && authPassword !== authConfirmPassword && (
                    <p className="text-[10px] text-red-400 mt-1 font-semibold">{t.passwordMismatch}</p>
                  )}
                </div>
              )}

              <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-black font-extrabold py-3 rounded-xl text-sm shadow">
                {isRegistering ? t.registerBtn : t.loginBtn}
              </button>

              <div className="text-center pt-1">
                <button 
                  type="button" 
                  onClick={() => { 
                    setIsRegistering(!isRegistering); 
                    setAuthError(""); 
                    setAuthConfirmPassword(""); 
                  }}
                  className="text-xs text-amber-400 hover:underline"
                >
                  {isRegistering ? t.switchToLogin : t.switchToReg}
                </button>
              </div>
            </form>
          </div>
        );
      }

      return (
        <div className="max-w-md mx-auto w-full p-4 pb-24">
          <input 
            type="file" 
            accept="image/*" 
            capture="environment" 
            ref={cameraInputRef} 
            onChange={handlePhotoCapture} 
            className="hidden" 
          />

          {showSettingsModal && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-gray-800 border border-gray-700 rounded-xl p-5 w-full max-w-sm space-y-3">
                <div className="flex justify-between items-center border-b border-gray-700 pb-2">
                  <h3 className="text-sm font-bold text-amber-400">{t.settingsTitle}</h3>
                  <button onClick={() => setShowSettingsModal(false)} className="text-gray-400 hover:text-white">
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>
                {settingsMsg && (
                  <p className="text-xs text-center text-amber-300 bg-amber-500/10 p-2 rounded">{settingsMsg}</p>
                )}
                <form onSubmit={handlePasswordUpdate} className="space-y-3">
                  <div>
                    <label className="block text-[10px] text-gray-400 mb-1">{t.newPasswordPlaceholder}</label>
                    <input 
                      type="password" 
                      value={newAccountPassword} 
                      onChange={e => setNewAccountPassword(e.target.value)} 
                      placeholder="Minimálne 6 znakov"
                      className="w-full bg-gray-900 border border-gray-600 rounded p-2 text-xs text-white"
                      required
                    />
                  </div>
                  <button type="submit" className="w-full bg-amber-500 text-black font-bold py-2 rounded text-xs shadow">
                    {t.updatePasswordBtn}
                  </button>
                </form>
              </div>
            </div>
          )}

          <header className="flex justify-between items-center mb-4 border-b border-gray-700 pb-3">
            <div>
              <h1 className="text-base font-black tracking-tight">
                <span className="text-amber-500">PDR</span> <span className="text-gray-200">FlowBoard</span>
              </h1>
              <p className="text-[10px] text-gray-400">
                {currentUser.accountType === 'company' ? `Tím (${currentUser.role})` : 'Solo Technik'} | {currentUser.email}
              </p>
            </div>
            
            <div className="flex items-center gap-2">
              <button 
                onClick={() => setShowSettingsModal(true)} 
                className="bg-gray-800 border border-gray-600 text-gray-300 px-2 py-1 text-xs rounded hover:text-amber-400"
                title={t.settingsTitle}
              >
                <i className="fa-solid fa-gear"></i>
              </button>
              <button 
                onClick={handleLogout} 
                className="bg-gray-800 border border-red-500/50 text-red-400 px-2.5 py-1 text-xs rounded hover:bg-red-500/20"
                title={t.logout}
              >
                <i className="fa-solid fa-power-off"></i>
              </button>
            </div>
          </header>

          <div className="flex bg-gray-800 p-1 rounded-xl mb-4 border border-gray-700">
            <button 
              onClick={() => setActiveTab("vehicles")} 
              className={`flex-1 py-2 text-xs font-bold rounded-lg ${activeTab === 'vehicles' ? 'bg-amber-500 text-black' : 'text-gray-400'}`}
            >
              <i className="fa-solid fa-car mr-1"></i>{t.tabVehicles}
            </button>
            <button 
              onClick={() => setActiveTab("projects")} 
              className={`flex-1 py-2 text-xs font-bold rounded-lg ${activeTab === 'projects' ? 'bg-amber-500 text-black' : 'text-gray-400'}`}
            >
              <i className="fa-solid fa-warehouse mr-1"></i>{t.tabProjects}
            </button>
            <button 
              onClick={() => setActiveTab("reports")} 
              className={`flex-1 py-2 text-xs font-bold rounded-lg ${activeTab === 'reports' ? 'bg-amber-500 text-black' : 'text-gray-400'}`}
            >
              <i className="fa-solid fa-chart-pie mr-1"></i>{t.tabReports} ({vehicles.length})
            </button>
          </div>

          {activeTab === "vehicles" ? (
            <form onSubmit={handleSaveVehicle} className="bg-gray-800 p-4 rounded-xl border border-gray-700 space-y-4">
              
              {/* 1. SEKCIA: Klient & Projekt/Miesto */}
              <div className="space-y-3 bg-gray-900/40 p-3 rounded-lg border border-gray-700/80">
                <div>
                  <div className="flex justify-between items-center mb-1">
                    <label className="text-xs font-bold text-gray-300">{t.clientLabel}</label>
                    <button 
                      type="button" 
                      onClick={() => setIsAddingClient(!isAddingClient)} 
                      className="text-[10px] text-amber-400 font-bold hover:underline"
                    >
                      {t.addClientBtn}
                    </button>
                  </div>
                  {isAddingClient ? (
                    <div className="space-y-2 bg-gray-950 p-2.5 rounded-lg border border-gray-700">
                      <input 
                        type="text" 
                        value={newClientName} 
                        onChange={e => setNewClientName(e.target.value)} 
                        placeholder="Názov klienta (napr. Denk)" 
                        className="w-full bg-gray-900 border border-gray-600 rounded p-1.5 text-xs text-white"
                      />
                      <div className="grid grid-cols-2 gap-2 pt-1">
                        <div>
                          <label className="block text-[9px] text-gray-400 mb-0.5">Predpona kalkulácie</label>
                          <input 
                            type="text" 
                            value={newClientPrefix} 
                            onChange={e => setNewClientPrefix(e.target.value)} 
                            placeholder="Napr. HLA" 
                            className="w-full bg-gray-900 border border-gray-600 rounded p-1 text-xs text-amber-400 font-mono uppercase"
                          />
                        </div>
                        <div className="flex items-center pt-3">
                          <label className="text-[10px] text-gray-300 flex items-center gap-1.5 cursor-pointer">
                            <input 
                              type="checkbox" 
                              checked={newClientAutoNum} 
                              onChange={e => setNewClientAutoNum(e.target.checked)} 
                            />
                            <span>Auto číslovanie</span>
                          </label>
                        </div>
                      </div>
                      <button type="button" onClick={handleCreateClient} className="w-full bg-amber-500 text-black font-bold py-1.5 text-xs rounded mt-1">Uložiť klienta</button>
                    </div>
                  ) : (
                    <select 
                      value={selectedClientId} 
                      onChange={e => setSelectedClientId(e.target.value)} 
                      className="w-full bg-gray-900 border border-gray-600 rounded p-2 text-sm text-white font-semibold"
                    >
                      {clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                    </select>
                  )}
                </div>

                <div>
                  <div className="flex justify-between items-center mb-1">
                    <label className="text-xs font-bold text-gray-300">{t.projectLabel}</label>
                    <button 
                      type="button" 
                      onClick={() => setIsAddingProject(!isAddingProject)} 
                      className="text-[10px] text-amber-400 font-bold hover:underline"
                    >
                      {t.addProjectQuick}
                    </button>
                  </div>
                  {isAddingProject ? (
                    <div className="flex gap-2">
                      <input 
                        type="text" 
                        value={newProjectName} 
                        onChange={e => setNewProjectName(e.target.value)} 
                        placeholder="Napr. Servis Bosch" 
                        className="flex-1 bg-gray-900 border border-gray-600 rounded p-2 text-xs text-white"
                      />
                      <button type="button" onClick={handleCreateProject} className="bg-amber-500 text-black font-bold px-3 py-1 text-xs rounded">OK</button>
                    </div>
                  ) : (
                    <select 
                      value={selectedProjectId} 
                      onChange={e => setSelectedProjectId(e.target.value)} 
                      className="w-full bg-gray-900 border border-gray-600 rounded p-2 text-sm text-amber-400 font-bold"
                    >
                      {availableProjects.length === 0 ? (
                        <option value="">(Žiadne miesto - kliknite + Nové miesto)</option>
                      ) : (
                        availableProjects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)
                      )}
                    </select>
                  )}
                </div>

                {/* Číslo kalkulácie - umiestnené pod klientom a miestom, nad detailami auta */}
                <div>
                  <div className="flex justify-between items-center mb-1">
                    <label className="text-xs text-amber-400 font-bold">{t.calcNumberLabel}</label>
                    <span className="text-[9px] text-gray-400">{t.calcNumberSub}</span>
                  </div>
                  <input 
                    type="text" 
                    value={clientCalcNo} 
                    onChange={e => setClientCalcNo(e.target.value)} 
                    placeholder="Napr. HLA/2026/001 alebo kód zákazky" 
                    className="w-full bg-gray-900 border border-amber-500/60 rounded p-2 text-sm text-amber-300 font-mono font-bold"
                  />
                </div>
              </div>

              {/* 2. SEKCIA: Skenovanie (VIN / Auto / Hárok) */}
              <div className="bg-amber-500/10 border border-amber-500/30 p-3 rounded-lg text-center space-y-3">
                <button 
                  type="button" 
                  onClick={startScanning}
                  className="w-full bg-amber-500 hover:bg-amber-400 text-black font-extrabold py-3.5 rounded-lg text-sm flex justify-center items-center gap-2 shadow-lg tracking-wide uppercase"
                >
                  <i className="fa-solid fa-camera text-xl"></i>
                  <span>{t.scanBtn}</span>
                </button>

                {scanStep > 0 && (
                  <div className="bg-gray-900/90 p-3 rounded-lg border border-amber-500/50 space-y-2">
                    <div className="flex justify-between items-center text-[10px] font-bold">
                      <span className={scanStep === 1 ? "text-amber-400 font-black" : "text-gray-400"}>{t.step1Label}</span>
                      <span className={scanStep === 2 ? "text-amber-400 font-black" : "text-gray-400"}>{t.step2Label}</span>
                      <span className={scanStep === 3 ? "text-amber-400 font-black" : "text-gray-400"}>{t.step3Label}</span>
                    </div>
                    
                    {isAnalyzing ? (
                      <p className="text-xs text-amber-300 animate-pulse"><i className="fa-solid fa-spinner fa-spin mr-1"></i> Analyzujem foto...</p>
                    ) : scanStep === 1 && vin ? (
                      <div className="space-y-2 pt-1 border-t border-gray-800">
                        <input 
                          type="text" 
                          value={vin} 
                          onChange={e => setVin(e.target.value)}
                          className="w-full text-center text-sm font-mono font-bold text-amber-400 bg-black/60 py-1.5 px-2 rounded border border-amber-500/50 uppercase"
                        />
                        <button 
                          type="button" 
                          onClick={() => { setScanStep(2); if(cameraInputRef.current) cameraInputRef.current.click(); }}
                          className="w-full bg-amber-500 text-black font-bold py-1.5 rounded text-xs"
                        >
                          Pokračovať: 2. Auto zozadu ➔
                        </button>
                      </div>
                    ) : scanStep === 2 && ecv ? (
                      <div className="space-y-2 pt-1 border-t border-gray-800">
                        <button 
                          type="button" 
                          onClick={() => { setScanStep(3); if(cameraInputRef.current) cameraInputRef.current.click(); }}
                          className="w-full bg-amber-500 text-black font-bold py-1.5 rounded text-xs"
                        >
                          Pokračovať: 3. Hárok kalkulácie ➔
                        </button>
                      </div>
                    ) : null}
                  </div>
                )}

                <div className="flex gap-2 justify-center pt-1">
                  {vinPhoto && (
                    <div className="relative w-14 h-14 rounded overflow-hidden border border-amber-500">
                      <img src={vinPhoto} className="w-full h-full object-cover" />
                      <span className="absolute bottom-0 right-0 bg-black/80 text-[7px] text-amber-300 px-1 font-bold">VIN</span>
                    </div>
                  )}
                  {rearPhoto && (
                    <div className="relative w-14 h-14 rounded overflow-hidden border border-amber-500">
                      <img src={rearPhoto} className="w-full h-full object-cover" />
                      <span className="absolute bottom-0 right-0 bg-black/80 text-[7px] text-amber-300 px-1 font-bold">Auto</span>
                    </div>
                  )}
                  {sheetPhoto && (
                    <div className="relative w-14 h-14 rounded overflow-hidden border border-amber-500">
                      <img src={sheetPhoto} className="w-full h-full object-cover" />
                      <span className="absolute bottom-0 right-0 bg-black/80 text-[7px] text-amber-300 px-1 font-bold">Hárok</span>
                    </div>
                  )}
                </div>
              </div>

              {/* 3. SEKCIA: Detaily o aute */}
              <div className="space-y-3">
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-xs text-gray-400 mb-1">{t.vin}</label>
                    <input type="text" value={vin} onChange={e => setVin(e.target.value)} placeholder="WVWZZZ..." className="w-full bg-gray-900 border border-gray-600 rounded p-2 text-xs uppercase text-amber-400 font-mono font-bold" />
                  </div>
                  <div>
                    <div className="flex justify-between items-center mb-1">
                      <label className="text-xs text-gray-400">{t.ecv}</label>
                      <label className="text-[9px] text-gray-400 flex items-center gap-1 cursor-pointer">
                        <input type="checkbox" checked={hasNoEcv} onChange={e => setHasNoEcv(e.target.checked)} />
                        {t.noEcvCheckbox}
                      </label>
                    </div>
                    <input 
                      type="text" 
                      value={hasNoEcv ? "Bez ŠPZ" : ecv} 
                      disabled={hasNoEcv}
                      onChange={e => setEcv(e.target.value)} 
                      placeholder="BL-123AB" 
                      className={`w-full bg-gray-900 border border-gray-600 rounded p-2 text-sm uppercase text-amber-400 font-bold ${hasNoEcv ? 'opacity-50 text-gray-400' : ''}`} 
                    />
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-[10px] text-gray-400 mb-1">{t.brand}</label>
                    <input type="text" value={brand} onChange={e => setBrand(e.target.value)} placeholder="Volkswagen" className="w-full bg-gray-900 border border-gray-600 rounded p-2 text-xs text-white" />
                  </div>
                  <div>
                    <label className="block text-[10px] text-gray-400 mb-1">{t.model}</label>
                    <input type="text" value={model} onChange={e => setModel(e.target.value)} placeholder="Passat" className="w-full bg-gray-900 border border-gray-600 rounded p-2 text-xs text-white" />
                  </div>
                </div>

                <div>
                  <label className="block text-xs text-gray-400 mb-1">{t.color}</label>
                  <div className="flex gap-1 overflow-x-auto pb-1 mb-1">
                    {colorOptions.map(c => (
                      <button
                        key={c}
                        type="button"
                        onClick={() => setColor(c)}
                        className={`px-2.5 py-1 text-[10px] rounded border whitespace-nowrap ${color === c ? 'bg-amber-500 border-amber-400 text-black font-bold' : 'bg-gray-900 border-gray-700 text-gray-300'}`}
                      >
                        {c}
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              {/* 4. SEKCIA: Financie - PDR cena a priamo pod ňou R&I */}
              <div className="space-y-3 pt-1 border-t border-gray-700">
                {/* PDR Cena */}
                <div className="bg-gray-900/60 p-3 rounded-lg border border-gray-700 space-y-2">
                  <div className="flex justify-between items-center">
                    <label className="text-xs font-bold text-gray-300">{t.priceLabel}</label>
                    <label className="text-xs text-amber-400 flex items-center gap-1.5 cursor-pointer font-bold">
                      <input 
                        type="checkbox" 
                        checked={isPricePending} 
                        onChange={e => setIsPricePending(e.target.checked)} 
                      />
                      {t.pricePendingCheckbox}
                    </label>
                  </div>
                  {!isPricePending && (
                    <input 
                      type="number" 
                      value={price} 
                      onChange={e => setPrice(e.target.value)} 
                      placeholder="0.00" 
                      className="w-full bg-gray-900 border border-gray-600 rounded p-2 text-sm text-amber-400 font-bold" 
                    />
                  )}
                </div>

                {/* R&I Demontáž / Montáž - presne pod cenou za opravu */}
                <div className="bg-gray-900/60 p-3 rounded-lg border border-gray-700 space-y-1">
                  <label className="text-xs font-bold text-gray-300 flex items-center gap-1.5">
                    <i className="fa-solid fa-wrench text-amber-500 text-xs"></i>
                    <span>{t.riPriceLabel}</span>
                  </label>
                  <input 
                    type="number" 
                    value={riPrice} 
                    onChange={e => setRiPrice(e.target.value)} 
                    placeholder="0.00" 
                    className="w-full bg-gray-900 border border-gray-600 rounded p-2 text-sm text-amber-400 font-bold" 
                  />
                </div>
              </div>

              <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-black font-extrabold py-3.5 rounded-lg text-center mt-2 shadow tracking-wide">
                {t.saveVehicle}
              </button>
            </form>
          ) : activeTab === "projects" ? (
            <div className="space-y-4">
              <div className="bg-gray-800 p-4 rounded-xl border border-gray-700 space-y-3">
                <h3 className="text-xs font-bold text-amber-400 uppercase tracking-wider">Klienti a ich miesta</h3>
                {clients.map(c => (
                  <div key={c.id} className="border-b border-gray-700 pb-3">
                    <div className="flex justify-between items-center">
                      <p className="font-bold text-white text-sm">{c.name}</p>
                      {c.calc_prefix && (
                        <span className="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded font-mono font-bold">
                          Kód: {c.calc_prefix}
                        </span>
                      )}
                    </div>
                    <div className="pl-3 mt-1.5 space-y-1">
                      {projects.filter(p => p.client_id === c.id).map(p => (
                        <div key={p.id} className="text-xs text-gray-400 flex items-center gap-2">
                          <i className="fa-solid fa-location-dot text-amber-500 text-[10px]"></i>
                          <span>{p.name}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          ) : (
            <div className="space-y-3">
              {/* Vyhľadávacie pole pre rýchle nájdenie auta */}
              <div className="relative">
                <i className="fa-solid fa-magnifying-glass absolute left-3 top-3 text-xs text-gray-400"></i>
                <input 
                  type="text" 
                  value={searchTerm} 
                  onChange={e => setSearchTerm(e.target.value)} 
                  placeholder={t.searchPlaceholder} 
                  className="w-full bg-gray-800 border border-gray-700 rounded-xl pl-8 pr-3 py-2 text-xs text-white focus:border-amber-500"
                />
              </div>

              <div className="space-y-2">
                {filteredVehicles.length === 0 ? (
                  <div className="bg-gray-800 p-6 rounded-xl border border-gray-700 text-center text-gray-400 text-xs">
                    {t.noVehicles}
                  </div>
                ) : (
                  filteredVehicles.map(v => (
                    <div key={v.id} className="bg-gray-800 p-3 rounded-xl border border-gray-700 flex justify-between items-center">
                      <div>
                        <div className="flex items-center gap-2">
                          <span className="text-xs font-bold text-amber-400 font-mono">
                            {v.client_calc_no || "Bez kalkulácie"}
                          </span>
                          <span className="text-xs font-bold text-white">{v.brand} {v.model} ({v.ecv})</span>
                        </div>
                        <p className="text-[10px] text-gray-400 font-mono">VIN: {v.vin}</p>
                        {v.ri_price > 0 && (
                          <p className="text-[10px] text-amber-500/80 font-bold">R&I: +{v.ri_price} €</p>
                        )}
                      </div>
                      <div className="text-right">
                        <span className="text-xs bg-amber-500/20 text-amber-300 font-bold px-2 py-1 rounded inline-block">
                          {v.is_price_pending ? "Neznáma" : `${Number(v.price) + Number(v.ri_price || 0)} €`}
                        </span>
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
