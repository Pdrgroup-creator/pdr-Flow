<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DentFlow PDR Pro</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const TRANSLATIONS = {
      SK: {
        title: "DentFlow PDR",
        subtitle: "SaaS Inspektor & Cenníky",
        tabOrders: "Zákazky",
        tabClients: "Zákazníci",
        scanBtn: "Spustiť skenovanie vozidla",
        scanProcess: "Proces: 1. VIN ➔ 2. ŠPZ ➔ 3. Fotka auta zozadu",
        clientLabel: "Zákazník (Firma)",
        projectLabel: "Zákazka / Park / Miesto",
        ecv: "ŠPZ / EČV",
        vin: "VIN kód",
        priceLabel: "Cena opravy",
        unknownPrice: "Neznáma (0.00)",
        saveOrder: "Uložiť zákazku",
        addClientBtn: "+ Nový zákazník",
        newClientTitle: "Vytvoriť Kartu Zákazníka",
        clientName: "Názov firmy / Meno",
        ico: "IČO / DIČ",
        phone: "Telefón",
        email: "E-mail",
        saveClient: "Uložiť zákazníka",
        myClients: "Moje klientske karty"
      },
      DE: {
        title: "DentFlow PDR",
        subtitle: "SaaS Inspektor & Preislisten",
        tabOrders: "Aufträge",
        tabClients: "Kunden",
        scanBtn: "Fahrzeug-Scan starten",
        scanProcess: "Ablauf: 1. FIN ➔ 2. Kennzeichen ➔ 3. Heckfoto",
        clientLabel: "Kunde (Firma)",
        projectLabel: "Auftrag / Park / Standort",
        ecv: "Kennzeichen",
        vin: "FIN / Fahrgestellnr.",
        priceLabel: "Reparaturpreis",
        unknownPrice: "Unbekannt (0.00)",
        saveOrder: "Auftrag speichern",
        addClientBtn: "+ Neuer Kunde",
        newClientTitle: "Kundenkarte erstellen",
        clientName: "Firmenname / Name",
        ico: "Steuer-ID",
        phone: "Telefon",
        email: "E-Mail",
        saveClient: "Kunde speichern",
        myClients: "Meine Kundenkartei"
      },
      EN: {
        title: "DentFlow PDR",
        subtitle: "SaaS Inspector & Pricing",
        tabOrders: "Orders",
        tabClients: "Clients",
        scanBtn: "Start Vehicle Scan",
        scanProcess: "Process: 1. VIN ➔ 2. License Plate ➔ 3. Rear Photo",
        clientLabel: "Client (Company)",
        projectLabel: "Job / Location / Project",
        ecv: "License Plate",
        vin: "VIN Number",
        priceLabel: "Repair Price",
        unknownPrice: "Unknown (0.00)",
        saveOrder: "Save Order",
        addClientBtn: "+ New Client",
        newClientTitle: "Create Client Card",
        clientName: "Company Name / Person",
        ico: "Tax ID",
        phone: "Phone",
        email: "E-mail",
        saveClient: "Save Client",
        myClients: "My Client Cards"
      }
    };

    function App() {
      const [lang, setLang] = useState("SK");
      const [activeTab, setActiveTab] = useState("orders");
      const t = TRANSLATIONS[lang];

      // Klientske karty a ich zákazky (projekty s cenníkmi)
      const [clientsData, setClientsData] = useState([
        {
          id: 1,
          name: "KHS Global",
          ico: "12345678",
          phone: "+421 905 111 222",
          email: "flota@khs.com",
          projects: [
            {
              id: 101,
              name: "Mníchov Logistický Park",
              priceType: "categories",
              categories: [
                { label: "Malé poškodenie", price: 150 },
                { label: "Stredné poškodenie", price: 320 },
                { label: "Veľké / Strecha", price: 650 }
              ]
            },
            {
              id: 102,
              name: "Trnava - Sklad Autohaus",
              priceType: "fixed",
              fixedPrice: 200
            }
          ]
        },
        {
          id: 2,
          name: "Bežné Autoservisy / Súkromní",
          ico: "87654321",
          phone: "+421 903 333 444",
          email: "info@dielna.sk",
          projects: [
            {
              id: 201,
              name: "Bežná oprava v teréne",
              priceType: "open"
            }
          ]
        }
      ]);

      // Výbery vo formulári
      const [selectedClientId, setSelectedClientId] = useState(1);
      const [selectedProjectId, setSelectedProjectId] = useState(101);
      const [defaultProjectId, setDefaultProjectId] = useState(101);

      // Správa zákazníkov form
      const [showNewClientForm, setShowNewClientForm] = useState(false);
      const [newClientData, setNewClientData] = useState({ name: "", ico: "", phone: "", email: "" });

      // Form stav zákazky
      const [ecv, setEcv] = useState("");
      const [vin, setVin] = useState("");
      const [selectedCategoryPrice, setSelectedCategoryPrice] = useState(null);
      const [isUnknownPrice, setIsUnknownPrice] = useState(true);
      const [customPrice, setCustomPrice] = useState("");

      const currentClient = useMemo(() => clientsData.find(c => c.id === Number(selectedClientId)), [clientsData, selectedClientId]);
      const currentProject = useMemo(() => currentClient?.projects.find(p => p.id === Number(selectedProjectId)), [currentClient, selectedProjectId]);

      useEffect(() => {
        if (currentProject) {
          if (currentProject.priceType === 'categories' && currentProject.categories.length > 0) {
            setSelectedCategoryPrice(currentProject.categories[0].price);
          } else if (currentProject.priceType === 'fixed') {
            setSelectedCategoryPrice(currentProject.fixedPrice);
          } else {
            setIsUnknownPrice(true);
            setCustomPrice("");
          }
        }
      }, [selectedProjectId, currentProject]);

      const handleAddClient = (e) => {
        e.preventDefault();
        if (!newClientData.name) return;
        const newClient = {
          id: Date.now(),
          ...newClientData,
          projects: [{ id: Date.now() + 1, name: "Všeobecná zákazka", priceType: "open" }]
        };
        setClientsData([...clientsData, newClient]);
        setSelectedClientId(newClient.id);
        setSelectedProjectId(newClient.projects[0].id);
        setNewClientData({ name: "", ico: "", phone: "", email: "" });
        setShowNewClientForm(false);
        setActiveTab("orders");
      };

      return (
        <div className="max-w-md mx-auto p-4 pb-24">
          <header className="flex justify-between items-center mb-4 border-b border-gray-700 pb-3">
            <div>
              <h1 className="text-xl font-bold text-amber-500">{t.title}</h1>
              <p className="text-xs text-gray-400">{t.subtitle}</p>
            </div>
            
            <div className="flex bg-gray-800 border border-gray-600 rounded p-1 gap-1">
              {["SK", "DE", "EN"].map(l => (
                <button
                  key={l}
                  onClick={() => setLang(l)}
                  className={`px-2 py-0.5 text-xs font-bold rounded ${lang === l ? 'bg-amber-500 text-black' : 'text-gray-400 hover:text-white'}`}
                >
                  {l}
                </button>
              ))}
            </div>
          </header>

          <div className="flex bg-gray-800 p-1 rounded-xl mb-4 border border-gray-700">
            <button 
              onClick={() => setActiveTab("orders")} 
              className={`flex-1 py-2 text-xs font-bold rounded-lg ${activeTab === 'orders' ? 'bg-amber-500 text-black' : 'text-gray-400'}`}
            >
              <i className="fa-solid fa-car mr-1"></i>{t.tabOrders}
            </button>
            <button 
              onClick={() => setActiveTab("clients")} 
              className={`flex-1 py-2 text-xs font-bold rounded-lg ${activeTab === 'clients' ? 'bg-amber-500 text-black' : 'text-gray-400'}`}
            >
              <i className="fa-solid fa-address-book mr-1"></i>{t.tabClients} ({clientsData.length})
            </button>
          </div>

          {activeTab === "orders" ? (
            <form className="bg-gray-800 p-4 rounded-xl border border-gray-700 space-y-4">
              <div className="bg-amber-500/10 border border-amber-500/30 p-3 rounded-lg text-center space-y-1">
                <button type="button" className="w-full bg-amber-500 text-black font-bold py-2 rounded text-sm flex justify-center items-center gap-2">
                  <i className="fa-solid fa-camera"></i>
                  <span>{t.scanBtn}</span>
                </button>
                <p className="text-[10px] text-gray-400">{t.scanProcess}</p>
              </div>

              <div>
                <div className="flex justify-between items-center mb-1">
                  <label className="text-xs text-gray-400">{t.clientLabel}</label>
                  <button 
                    type="button" 
                    onClick={() => { setActiveTab("clients"); setShowNewClientForm(true); }}
                    className="text-xs text-amber-400 font-semibold hover:underline"
                  >
                    {t.addClientBtn}
                  </button>
                </div>
                <select 
                  value={selectedClientId} 
                  onChange={e => {
                    setSelectedClientId(e.target.value);
                    const firstProj = clientsData.find(c => c.id === Number(e.target.value))?.projects[0];
                    if (firstProj) setSelectedProjectId(firstProj.id);
                  }} 
                  className="w-full bg-gray-900 border border-gray-600 rounded p-2 text-sm text-white font-semibold"
                >
                  {clientsData.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                </select>
              </div>

              <div>
                <label className="block text-xs text-gray-400 mb-1">{t.projectLabel}</label>
                <div className="flex gap-2">
                  <select 
                    value={selectedProjectId} 
                    onChange={e => setSelectedProjectId(e.target.value)} 
                    className="w-full bg-gray-900 border border-gray-600 rounded p-2 text-sm text-amber-400 font-bold"
                  >
                    {(currentClient?.projects || []).map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                  </select>
                  
                  <button 
                    type="button" 
                    onClick={() => setDefaultProjectId(selectedProjectId)}
                    className={`px-3 py-2 rounded border ${defaultProjectId === Number(selectedProjectId) ? 'bg-amber-500 border-amber-400 text-black font-bold' : 'bg-gray-700 border-gray-600 text-gray-300'}`}
                  >
                    <i className="fa-solid fa-star"></i>
                  </button>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block text-xs text-gray-400 mb-1">{t.ecv}</label>
                  <input type="text" value={ecv} onChange={e => setEcv(e.target.value)} placeholder="BL-123AB" className="w-full bg-gray-900 border border-gray-600 rounded p-2 text-sm uppercase text-amber-400 font-bold" />
                </div>
                <div>
                  <label className="block text-xs text-gray-400 mb-1">{t.vin}</label>
                  <input type="text" value={vin} onChange={e => setVin(e.target.value)} placeholder="WVWZZZ..." className="w-full bg-gray-900 border border-gray-600 rounded p-2 text-xs uppercase" />
                </div>
              </div>

              {/* DYNAMICKÝ CENNÍK */}
              {currentProject?.priceType === 'categories' && (
                <div className="bg-gray-900/80 p-3 rounded-lg border border-amber-500/40 space-y-2">
                  <label className="block text-xs text-amber-300 font-medium">{t.priceLabel} (Cenník):</label>
                  <div className="grid grid-cols-1 gap-2">
                    {currentProject.categories.map((cat, idx) => (
                      <button
                        key={idx}
                        type="button"
                        onClick={() => setSelectedCategoryPrice(cat.price)}
                        className={`p-2 rounded-lg border text-left flex justify-between items-center transition-all ${selectedCategoryPrice === cat.price ? 'bg-amber-500 border-amber-400 text-black font-bold' : 'bg-gray-800 border-gray-700 text-gray-300'}`}
                      >
                        <span className="text-xs">{cat.label}</span>
                        <span className="text-sm font-black">{cat.price} €</span>
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {currentProject?.priceType === 'fixed' && (
                <div className="bg-gray-900/80 p-3 rounded-lg border border-green-500/40 flex justify-between items-center">
                  <div>
                    <p className="text-xs text-gray-400">Fixná cena pre zákazku:</p>
                    <p className="text-lg font-black text-green-400">{currentProject.fixedPrice} € / diel</p>
                  </div>
                  <span className="text-[10px] bg-green-900/50 text-green-300 border border-green-700 px-2 py-1 rounded">Auto-Cena</span>
                </div>
              )}

              {currentProject?.priceType === 'open' && (
                <div>
                  <label className="block text-xs text-gray-400 mb-1">{t.priceLabel}</label>
                  {isUnknownPrice ? (
                    <button 
                      type="button"
                      onClick={() => setIsUnknownPrice(false)}
                      className="w-full bg-gray-900 border border-amber-500/50 text-amber-400 rounded p-2 text-left text-sm font-semibold flex justify-between items-center"
                    >
                      <span>{t.unknownPrice}</span>
                      <span className="text-xs bg-amber-500/20 px-2 py-1 rounded text-amber-300">Zadať sumu</span>
                    </button>
                  ) : (
                    <div className="flex w-full gap-2">
                      <input 
                        type="number" 
                        value={customPrice} 
                        onChange={e => setCustomPrice(e.target.value)}
                        placeholder="0.00"
                        className="w-full bg-gray-900 border border-gray-600 rounded p-2 text-lg font-bold text-amber-400"
                      />
                      <button type="button" onClick={() => setIsUnknownPrice(true)} className="px-2 bg-gray-700 text-gray-300 rounded text-xs">X</button>
                    </div>
                  )}
                </div>
              )}

              <button type="button" className="w-full bg-amber-500 text-black font-bold py-3 rounded-lg text-center mt-2">
                {t.saveOrder}
              </button>
            </form>
          ) : (
            <div className="space-y-4">
              {showNewClientForm ? (
                <form onSubmit={handleAddClient} className="bg-gray-800 p-4 rounded-xl border border-amber-500/50 space-y-3">
                  <div className="flex justify-between items-center border-b border-gray-700 pb-2">
                    <h3 className="font-bold text-amber-400 text-sm">{t.newClientTitle}</h3>
                    <button type="button" onClick={() => setShowNewClientForm(false)} className="text-xs text-gray-400">✕ Zrušiť</button>
                  </div>
                  <div>
                    <label className="block text-[10px] text-gray-400 mb-1">{t.clientName}</label>
                    <input type="text" value={newClientData.name} onChange={e => setNewClientData({...newClientData, name: e.target.value})} className="w-full bg-gray-900 border border-gray-600 rounded p-2 text-sm text-white" required />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-[10px] text-gray-400 mb-1">{t.ico}</label>
                      <input type="text" value={newClientData.ico} onChange={e => setNewClientData({...newClientData, ico: e.target.value})} className="w-full bg-gray-900 border border-gray-600 rounded p-2 text-xs text-white" />
                    </div>
                    <div>
                      <label className="block text-[10px] text-gray-400 mb-1">{t.phone}</label>
                      <input type="text" value={newClientData.phone} onChange={e => setNewClientData({...newClientData, phone: e.target.value})} className="w-full bg-gray-900 border border-gray-600 rounded p-2 text-xs text-white" />
                    </div>
                  </div>
                  <button type="submit" className="w-full bg-amber-500 text-black font-bold py-2 rounded text-xs">
                    {t.saveClient}
                  </button>
                </form>
              ) : (
                <button onClick={() => setShowNewClientForm(true)} className="w-full bg-gray-800 border border-amber-500 text-amber-400 font-bold py-2.5 rounded-lg text-xs">
                  + {t.newClientTitle}
                </button>
              )}

              <div className="space-y-2">
                <h3 className="text-xs font-semibold text-gray-400">{t.myClients}</h3>
                {clientsData.map(c => (
                  <div key={c.id} className="bg-gray-800 p-3 rounded-xl border border-gray-700 space-y-1">
                    <div className="flex justify-between items-start">
                      <p className="font-bold text-amber-400 text-sm">{c.name}</p>
                      {c.ico && <span className="text-[10px] bg-gray-700 text-gray-300 px-1.5 py-0.5 rounded">IČO: {c.ico}</span>}
                    </div>
                    <p className="text-xs text-gray-400"><i className="fa-solid fa-folder-open mr-1"></i>Projekty: {c.projects.length}</p>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
