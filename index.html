<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PDR FlowBoard Pro</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>
  <style>
    body { background-color: #111827; margin: 0; padding: 0; }
    .login-container {
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid #374151;
      border-radius: 1rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .bottom-sheet {
      animation: slideUp 0.25s ease-out forwards;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col justify-between font-sans select-none">
  <div id="root" class="flex-1 flex flex-col justify-center items-center p-3"></div>

  <footer class="py-3 text-center text-xs text-gray-500 border-t border-gray-800 bg-gray-950/60">
    PDR FlowBoard &copy; 2026 | Powered by P<span class="text-amber-500 font-black">3</span>D<span class="text-amber-500 font-black">R</span>0
  </footer>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const SUPABASE_URL = "https://hzmipgjpjhibxmkdadvf.supabase.co";
    const SUPABASE_KEY = "sb_publishable_5lQPiP19Qy2xwDq6eUXDmQ_MB5IYkHQ";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const COLOR_DATA = {
      SK: ["Biela", "Čierna", "Sivá / Strieborná", "Modrá", "Červená", "Zelená", "Hnedá / Bronz"],
      EN: ["White", "Black", "Grey / Silver", "Blue", "Red", "Green", "Brown / Bronze"],
      DE: ["Weiß", "Schwarz", "Grau / Silber", "Blau", "Rot", "Grün", "Braun / Bronze"]
    };

    function App() {
      const [lang, setLang] = useState(() => localStorage.getItem("pdr_lang") || "SK");
      const [activeTab, setActiveTab] = useState("vehicles");
      const colorOptions = COLOR_DATA[lang];

      const [currentUser, setCurrentUser] = useState(null);
      const [loadingUser, setLoadingUser] = useState(true);
      const [authError, setAuthError] = useState("");

      const [clients, setClients] = useState([]);
      const [projects, setProjects] = useState([]);
      const [vehicles, setVehicles] = useState([]);

      // Pamäť posledného výberu
      const [selectedClientId, setSelectedClientId] = useState(() => localStorage.getItem("pdr_last_client") || "");
      const [selectedProjectId, setSelectedProjectId] = useState(() => localStorage.getItem("pdr_last_project") || "");

      // Detail zobrazenia (Bottom Sheet)
      const [activeBottomSheet, setActiveBottomSheet] = useState(null);
      const [selectedVehicleDetail, setSelectedVehicleDetail] = useState(null);

      // Správa na karte Klienti & Miesta
      const [selectedClientDetailId, setSelectedClientDetailId] = useState(null);
      const [locationSearchFilter, setLocationSearchFilter] = useState("");

      const [showNewClientForm, setShowNewClientForm] = useState(false);
      const [newClientName, setNewClientName] = useState("");
      const [newClientPrefix, setNewClientPrefix] = useState("");
      const [newClientAutoNum, setNewClientAutoNum] = useState(true);
      const [newClientAddress, setNewClientAddress] = useState("");
      const [newClientIco, setNewClientIco] = useState("");
      const [newClientPhone, setNewClientPhone] = useState("");

      // Nové miesto
      const [addingProjectClientId, setAddingProjectClientId] = useState(null);
      const [newProjectName, setNewProjectName] = useState("");
      const [newProjectAddress, setNewProjectAddress] = useState("");
      const [newProjectPhone, setNewProjectPhone] = useState("");
      const [newProjectPricingMode, setNewProjectPricingMode] = useState("free");
      const [newProjectFixedPrice, setNewProjectFixedPrice] = useState("");
      const [newProjectCategories, setNewProjectCategories] = useState("Kat 1:120, Kat 2:250, Kat 3:450");
      const [newProjectTechPdrPercent, setNewProjectTechPdrPercent] = useState("100");
      const [newProjectTechRiPercent, setNewProjectTechRiPercent] = useState("100");
      const [newProjectAwRate, setNewProjectAwRate] = useState("");

      const [searchTerm, setSearchTerm] = useState("");

      // Kamery a fotky
      const cameraInputRef = useRef(null);
      const cardClientInputRef = useRef(null);
      const cardProjectInputRef = useRef(null);
      const damagePhotoInputRef = useRef(null);

      const [scanStep, setScanStep] = useState(0);
      const [vinPhoto, setVinPhoto] = useState(null);
      const [rearPhoto, setRearPhoto] = useState(null);
      const [sheetPhoto, setSheetPhoto] = useState(null);
      const [damagePhotos, setDamagePhotos] = useState([]); // max 5
      const [isAnalyzing, setIsAnalyzing] = useState(false);

      // Polia vozidla
      const [clientCalcNo, setClientCalcNo] = useState("");
      const [vin, setVin] = useState("");
      const [ecv, setEcv] = useState("");
      const [hasNoEcv, setHasNoEcv] = useState(false);
      const [brand, setBrand] = useState("");
      const [model, setModel] = useState("");
      const [color, setColor] = useState(colorOptions[2]);

      // Cenové polia
      const [priceInputMode, setPriceInputMode] = useState("euro"); // 'euro' | 'aw'
      const [price, setPrice] = useState("");
      const [awCount, setAwCount] = useState("");
      const [selectedCategoryLabel, setSelectedCategoryLabel] = useState("");
      const [riPrice, setRiPrice] = useState("");
      const [isPricePending, setIsPricePending] = useState(false);
      const [damageNote, setDamageNote] = useState("");

      useEffect(() => {
        const fetchUserProfile = async (session) => {
          if (!session?.user) {
            setCurrentUser(null);
            setLoadingUser(false);
            return;
          }
          setCurrentUser({ id: session.user.id, email: session.user.email });
          setLoadingUser(false);
        };

        supabase.auth.getSession().then(({ data: { session } }) => fetchUserProfile(session));
        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => fetchUserProfile(session));
        return () => subscription.unsubscribe();
      }, []);

      const loadData = async () => {
        try {
          const { data: cData } = await supabase.from("clients").select("*").order("name");
          if (cData) {
            setClients(cData);
            if (!selectedClientId && cData.length > 0) {
              setSelectedClientId(cData[0].id);
              localStorage.setItem("pdr_last_client", cData[0].id);
            }
          }
          const { data: pData } = await supabase.from("projects").select("*").order("name");
          if (pData) setProjects(pData);

          const { data: vData } = await supabase.from("vehicles").select("*").order("created_at", { ascending: false });
          if (vData) setVehicles(vData);
        } catch (e) {
          console.error("Data load err:", e);
        }
      };

      useEffect(() => {
        if (currentUser) loadData();
      }, [currentUser]);

      const availableProjects = useMemo(() => {
        return projects.filter(p => p.client_id === selectedClientId);
      }, [projects, selectedClientId]);

      useEffect(() => {
        if (availableProjects.length > 0) {
          const found = availableProjects.find(p => p.id === selectedProjectId);
          if (!found) {
            setSelectedProjectId(availableProjects[0].id);
            localStorage.setItem("pdr_last_project", availableProjects[0].id);
          }
        } else {
          setSelectedProjectId("");
        }
      }, [availableProjects, selectedClientId]);

      const handleClientChange = (cId) => {
        setSelectedClientId(cId);
        localStorage.setItem("pdr_last_client", cId);
      };

      const handleProjectChange = (pId) => {
        setSelectedProjectId(pId);
        localStorage.setItem("pdr_last_project", pId);
      };

      const currentSelectedProject = useMemo(() => {
        return projects.find(p => p.id === selectedProjectId);
      }, [projects, selectedProjectId]);

      // Prepočet ceny pri zmene AW
      const handleAwChange = (val) => {
        setAwCount(val);
        const count = parseFloat(val);
        if (!isNaN(count) && currentSelectedProject?.aw_rate) {
          const calculated = (count * parseFloat(currentSelectedProject.aw_rate)).toFixed(2);
          setPrice(calculated);
          setIsPricePending(false);
        } else {
          setPrice("");
          setIsPricePending(true);
        }
      };

      // Výpočet odhadovaného zárobku technika
      const techEarned = useMemo(() => {
        const pdrP = parseFloat(currentSelectedProject?.tech_pdr_percent ?? 100) / 100;
        const riP = parseFloat(currentSelectedProject?.tech_ri_percent ?? 100) / 100;
        const pdrVal = parseFloat(price) || 0;
        const riVal = parseFloat(riPrice) || 0;
        return (pdrVal * pdrP + riVal * riP).toFixed(2);
      }, [price, riPrice, currentSelectedProject]);

      // Automatické číslovanie
      useEffect(() => {
        if (!selectedClientId) return;
        const currentClient = clients.find(c => c.id === selectedClientId);
        const currentYear = new Date().getFullYear();

        if (currentClient && currentClient.auto_numbering && currentClient.calc_prefix) {
          const clientProjectIds = projects.filter(p => p.client_id === selectedClientId).map(p => p.id);
          const clientVehiclesThisYear = vehicles.filter(v => 
            clientProjectIds.includes(v.project_id) && 
            v.client_calc_no && 
            v.client_calc_no.includes(`/${currentYear}/`)
          );
          const nextSeq = String(clientVehiclesThisYear.length + 1).padStart(3, '0');
          setClientCalcNo(`${currentClient.calc_prefix}/${currentYear}/${nextSeq}`);
        } else {
          setClientCalcNo("");
        }
      }, [selectedClientId, clients, projects, vehicles]);

      // Pridanie fotky poškodenia
      const handleDamagePhotoAdd = (e) => {
        const file = e.target.files[0];
        if (!file || damagePhotos.length >= 5) return;
        const photoUrl = URL.createObjectURL(file);
        setDamagePhotos([...damagePhotos, photoUrl]);
      };

      const handleCreateProject = async (clientId) => {
        if (!newProjectName.trim()) return;

        let parsedCategories = null;
        if (newProjectPricingMode === 'categories') {
          parsedCategories = newProjectCategories.split(',').map(item => {
            const [l, p] = item.split(':');
            return { label: (l || "").trim(), price: Number(p) || 0 };
          }).filter(c => c.label);
        }

        const { data, error } = await supabase.from("projects").insert([{ 
          client_id: clientId, 
          name: newProjectName.trim(), 
          address: newProjectAddress.trim() || null,
          phone: newProjectPhone.trim() || null,
          pricing_mode: newProjectPricingMode,
          fixed_price: newProjectPricingMode === 'fixed' ? Number(newProjectFixedPrice) || 0 : null,
          pricing_categories: parsedCategories,
          tech_pdr_percent: parseFloat(newProjectTechPdrPercent) || 100,
          tech_ri_percent: parseFloat(newProjectTechRiPercent) || 100,
          aw_rate: newProjectAwRate ? parseFloat(newProjectAwRate) : null,
          created_by: currentUser.id 
        }]).select();

        if (!error && data) {
          setProjects([...projects, data[0]]);
          if (clientId === selectedClientId) handleProjectChange(data[0].id);
          setNewProjectName("");
          setNewProjectAddress("");
          setNewProjectPhone("");
          setNewProjectPricingMode("free");
          setNewProjectFixedPrice("");
          setNewProjectTechPdrPercent("100");
          setNewProjectTechRiPercent("100");
          setNewProjectAwRate("");
          setAddingProjectClientId(null);
        } else if (error) {
          alert("Chyba: " + error.message);
        }
      };

      const handleSaveVehicle = async (e) => {
        e.preventDefault();
        if (!selectedProjectId) {
          alert("Vyberte najprv platného Klienta a Miesto.");
          return;
        }

        const currentYear = new Date().getFullYear();
        const techPrefix = (currentUser.email.split('@')[0].split('.')[1] || currentUser.email.substring(0, 3)).toUpperCase().substring(0, 4);
        const internalSeq = String(vehicles.length + 1).padStart(3, '0');
        const generatedInternalRecordNo = `${techPrefix}/${currentYear}/${internalSeq}`;

        const newVehicleRecord = {
          project_id: selectedProjectId,
          created_by: currentUser.id,
          internal_record_no: generatedInternalRecordNo,
          client_calc_no: clientCalcNo || null,
          price_category: selectedCategoryLabel || null,
          ri_price: Number(riPrice) || 0.00,
          vin: vin || "N/A",
          ecv: hasNoEcv ? "Bez ŠPZ" : (ecv || "N/A"),
          has_no_ecv: hasNoEcv,
          brand: brand || "Neznáma",
          model: model || "Neznámy",
          color: color,
          price: isPricePending ? 0 : (Number(price) || 0),
          is_price_pending: isPricePending,
          aw_count: awCount ? parseFloat(awCount) : null,
          tech_pdr_percent: currentSelectedProject?.tech_pdr_percent ?? 100,
          tech_ri_percent: currentSelectedProject?.tech_ri_percent ?? 100,
          note: damageNote.trim() || null,
          note_created_at: damageNote.trim() ? new Date().toISOString() : null,
          damage_photos: damagePhotos
        };

        const { data, error } = await supabase.from("vehicles").insert([newVehicleRecord]).select();

        if (error) {
          alert("Chyba pri ukladaní: " + error.message);
        } else if (data) {
          setVehicles([data[0], ...vehicles]);
          alert("Vozidlo bolo úspešne uložené!");
          setVin("");
          setEcv("");
          setBrand("");
          setModel("");
          setPrice("");
          setAwCount("");
          setRiPrice("");
          setIsPricePending(false);
          setDamageNote("");
          setDamagePhotos([]);
          setVinPhoto(null);
          setRearPhoto(null);
          setSheetPhoto(null);
        }
      };

      const filteredVehicles = useMemo(() => {
        if (!searchTerm.trim()) return vehicles;
        const term = searchTerm.toLowerCase();
        return vehicles.filter(v => 
          (v.client_calc_no && v.client_calc_no.toLowerCase().includes(term)) ||
          (v.vin && v.vin.toLowerCase().includes(term)) ||
          (v.ecv && v.ecv.toLowerCase().includes(term)) ||
          (v.brand && v.brand.toLowerCase().includes(term)) ||
          (v.model && v.model.toLowerCase().includes(term))
        );
      }, [vehicles, searchTerm]);

      if (loadingUser) {
        return <div className="text-center p-8 text-amber-500 font-bold"><i className="fa-solid fa-spinner fa-spin text-2xl"></i></div>;
      }

      if (!currentUser) {
        return <div className="p-4 text-center text-xs text-gray-400">Prihláste sa pre prístup k PDR FlowBoard.</div>;
      }

      return (
        <div className="max-w-md mx-auto w-full p-2 pb-24">
          <input type="file" accept="image/*" capture="environment" ref={cameraInputRef} className="hidden" />
          <input type="file" accept="image/*" capture="environment" ref={damagePhotoInputRef} onChange={handleDamagePhotoAdd} className="hidden" />

          {/* DETAIL VOZIDLA (Modálna karta) */}
          {selectedVehicleDetail && (
            <div className="fixed inset-0 bg-black/85 z-50 flex flex-col justify-end">
              <div className="fixed inset-0" onClick={() => setSelectedVehicleDetail(null)}></div>
              <div className="relative bg-gray-900 border-t border-amber-500/50 rounded-t-2xl p-4 shadow-2xl z-10 bottom-sheet max-h-[90vh] overflow-y-auto space-y-3">
                <div className="w-12 h-1 bg-gray-700 rounded-full mx-auto"></div>
                <div className="flex justify-between items-start border-b border-gray-800 pb-2">
                  <div>
                    <span className="text-[10px] font-bold text-amber-400 font-mono">{selectedVehicleDetail.client_calc_no || "Bez čísla kalkulácie"}</span>
                    <h3 className="text-base font-black text-white">{selectedVehicleDetail.brand} {selectedVehicleDetail.model} ({selectedVehicleDetail.ecv})</h3>
                    <p className="text-[10px] text-gray-400 font-mono">VIN: {selectedVehicleDetail.vin}</p>
                  </div>
                  <button onClick={() => setSelectedVehicleDetail(null)} className="text-gray-400 hover:text-white p-1">
                    <i className="fa-solid fa-circle-xmark text-xl"></i>
                  </button>
                </div>

                {selectedVehicleDetail.note && (
                  <div className="p-2.5 bg-amber-500/10 border border-amber-500/30 rounded-xl space-y-1">
                    <div className="flex justify-between items-center text-[9px] font-bold text-amber-400">
                      <span><i className="fa-solid fa-shield-halved mr-1"></i> VSTUPNÁ POZNÁMKA (DÔKAZ)</span>
                      <span>{selectedVehicleDetail.note_created_at ? new Date(selectedVehicleDetail.note_created_at).toLocaleString() : ''}</span>
                    </div>
                    <p className="text-xs text-gray-200">{selectedVehicleDetail.note}</p>
                  </div>
                )}

                <div className="space-y-1">
                  <p className="text-[10px] font-bold text-gray-400 uppercase">Fotodokumentácia vozidla</p>
                  <div className="grid grid-cols-3 gap-1.5">
                    {vinPhoto && <img src={vinPhoto} className="h-20 w-full object-cover rounded border border-gray-700" alt="VIN" />}
                    {rearPhoto && <img src={rearPhoto} className="h-20 w-full object-cover rounded border border-gray-700" alt="Auto" />}
                    {sheetPhoto && <img src={sheetPhoto} className="h-20 w-full object-cover rounded border border-gray-700" alt="Hárok" />}
                    {selectedVehicleDetail.damage_photos?.map((url, i) => (
                      <img key={i} src={url} className="h-20 w-full object-cover rounded border border-amber-500/60" alt="Poškodenie" />
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* HLAVIČKA A PREPÍNANIE ZÁLOŽIEK */}
          <header className="flex justify-between items-center mb-3 border-b border-gray-700 pb-2.5">
            <div>
              <h1 className="text-base font-black tracking-tight">
                <span className="text-amber-500">PDR</span> <span className="text-gray-200">FlowBoard</span>
              </h1>
              <p className="text-[10px] text-gray-400">{currentUser.email}</p>
            </div>
          </header>

          <div className="flex bg-gray-800 p-1 rounded-xl mb-3 border border-gray-700">
            <button onClick={() => setActiveTab("vehicles")} className={`flex-1 py-2 text-xs font-bold rounded-lg ${activeTab === 'vehicles' ? 'bg-amber-500 text-black' : 'text-gray-400'}`}>
              <i className="fa-solid fa-car mr-1"></i>Vozidlá
            </button>
            <button onClick={() => setActiveTab("projects")} className={`flex-1 py-2 text-xs font-bold rounded-lg ${activeTab === 'projects' ? 'bg-amber-500 text-black' : 'text-gray-400'}`}>
              <i className="fa-solid fa-warehouse mr-1"></i>Klienti & Miesta
            </button>
            <button onClick={() => setActiveTab("reports")} className={`flex-1 py-2 text-xs font-bold rounded-lg ${activeTab === 'reports' ? 'bg-amber-500 text-black' : 'text-gray-400'}`}>
              <i className="fa-solid fa-chart-pie mr-1"></i>Súpis & Report
            </button>
          </div>

          {activeTab === "vehicles" ? (
            <form onSubmit={handleSaveVehicle} className="bg-gray-800 p-4 rounded-xl border border-gray-700 space-y-3.5">
              
              {/* VÝBER KLIENTA A MIESTA */}
              <div className="space-y-2 bg-gray-900/60 p-2.5 rounded-lg border border-gray-700">
                <select value={selectedClientId} onChange={e => handleClientChange(e.target.value)} className="w-full bg-gray-900 border border-gray-600 rounded p-1.5 text-xs text-white font-semibold">
                  {clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                </select>
                <select value={selectedProjectId} onChange={e => handleProjectChange(e.target.value)} className="w-full bg-gray-900 border border-gray-600 rounded p-1.5 text-xs text-amber-400 font-bold">
                  {availableProjects.map(p => (
                    <option key={p.id} value={p.id}>{p.name} {p.address ? `— ${p.address}` : ''}</option>
                  ))}
                </select>
                <input type="text" value={clientCalcNo} onChange={e => setClientCalcNo(e.target.value)} placeholder="Číslo kalkulácie (Klient)" className="w-full bg-gray-900 border border-amber-500/60 rounded p-1.5 text-xs text-amber-300 font-mono font-bold" />
              </div>

              {/* ÚDAJE O VOZIDLE */}
              <div className="grid grid-cols-2 gap-2">
                <input type="text" value={vin} onChange={e => setVin(e.target.value)} placeholder="VIN kód" className="bg-gray-900 border border-gray-600 rounded p-1.5 text-xs text-amber-400 font-mono font-bold uppercase" />
                <input type="text" value={hasNoEcv ? "Bez ŠPZ" : ecv} disabled={hasNoEcv} onChange={e => setEcv(e.target.value)} placeholder="ŠPZ" className="bg-gray-900 border border-gray-600 rounded p-1.5 text-xs uppercase text-amber-400 font-bold" />
              </div>
              <div className="grid grid-cols-2 gap-2">
                <input type="text" value={brand} onChange={e => setBrand(e.target.value)} placeholder="Značka" className="bg-gray-900 border border-gray-600 rounded p-1.5 text-xs text-white" />
                <input type="text" value={model} onChange={e => setModel(e.target.value)} placeholder="Model" className="bg-gray-900 border border-gray-600 rounded p-1.5 text-xs text-white" />
              </div>

              {/* FINANCIE: EUR VS AW S AUTOMATICKÝM PREPOČTOM */}
              <div className="p-3 bg-gray-900/80 rounded-xl border border-gray-700 space-y-2.5">
                <div className="flex justify-between items-center">
                  <div className="flex bg-gray-950 p-0.5 rounded border border-gray-700 text-[10px]">
                    <button type="button" onClick={() => setPriceInputMode("euro")} className={`px-2 py-0.5 font-bold rounded ${priceInputMode === 'euro' ? 'bg-amber-500 text-black' : 'text-gray-400'}`}>Suma €</button>
                    <button type="button" onClick={() => setPriceInputMode("aw")} className={`px-2 py-0.5 font-bold rounded ${priceInputMode === 'aw' ? 'bg-amber-500 text-black' : 'text-gray-400'}`}>AW Jednotky</button>
                  </div>
                  <label className="text-[10px] text-amber-400 flex items-center gap-1 cursor-pointer font-bold">
                    <input type="checkbox" checked={isPricePending} onChange={e => setIsPricePending(e.target.checked)} />
                    Cena neznáma
                  </label>
                </div>

                {priceInputMode === "aw" ? (
                  <div className="space-y-1">
                    <div className="flex gap-2">
                      <input type="number" value={awCount} onChange={e => handleAwChange(e.target.value)} placeholder="Zadaj počet AW" className="flex-1 bg-gray-900 border border-amber-500/60 rounded p-1.5 text-xs text-amber-300 font-bold" />
                      <div className="p-1.5 bg-gray-800 rounded border border-gray-700 text-[10px] text-gray-300 flex items-center">
                        Sadzba: {currentSelectedProject?.aw_rate ? `${currentSelectedProject.aw_rate} €/AW` : 'Nenastavená'}
                      </div>
                    </div>
                    {!currentSelectedProject?.aw_rate && (
                      <p className="text-[9px] text-yellow-400 italic">Sadzba za 1 AW nie je pre toto miesto nastavená. AW sa uložia, cena zostane v stave Čaká na ocenenie.</p>
                    )}
                  </div>
                ) : (
                  <input type="number" value={price} onChange={e => setPrice(e.target.value)} placeholder="PDR Cena (€)" className="w-full bg-gray-900 border border-gray-600 rounded p-1.5 text-xs text-amber-400 font-bold" />
                )}

                <input type="number" value={riPrice} onChange={e => setRiPrice(e.target.value)} placeholder="R&I Cena (Demontáž €)" className="w-full bg-gray-900 border border-gray-600 rounded p-1.5 text-xs text-amber-400 font-bold" />

                {/* DISKRÉTNY NÁHĽAD ZÁROBKU TECHNIKA */}
                <div className="flex justify-between items-center text-[10px] text-gray-400 pt-1 border-t border-gray-800">
                  <span>Podiel: PDR {currentSelectedProject?.tech_pdr_percent ?? 100}% | R&I {currentSelectedProject?.tech_ri_percent ?? 100}%</span>
                  <span className="text-amber-400 font-extrabold">Tvoj podiel: ~{techEarned} €</span>
                </div>
              </div>

              {/* OCHRANNÁ POZNÁMKA S FOTKAMI POŠKODENIA (MAX 5) */}
              <div className="p-2.5 bg-gray-900/60 rounded-xl border border-gray-700 space-y-2">
                <input type="text" value={damageNote} onChange={e => setDamageNote(e.target.value)} placeholder="Poznámka / Vstupné poškodenie (časová pečiatka)" className="w-full bg-gray-900 border border-gray-700 rounded p-1.5 text-xs text-gray-200" />
                <div className="flex justify-between items-center">
                  <button type="button" onClick={() => { if (damagePhotoInputRef.current) damagePhotoInputRef.current.click(); }} disabled={damagePhotos.length >= 5} className="bg-gray-800 hover:bg-gray-700 border border-amber-500/40 text-amber-400 font-bold py-1 px-2.5 rounded text-[10px] flex items-center gap-1.5">
                    <i className="fa-solid fa-camera"></i>
                    <span>+ Foto poškodenia ({damagePhotos.length}/5)</span>
                  </button>
                  {damagePhotos.length > 0 && <span className="text-[10px] text-green-400 font-bold"><i className="fa-solid fa-check mr-1"></i>Nahraté</span>}
                </div>
              </div>

              <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-black font-extrabold py-3 rounded-lg text-xs shadow tracking-wide uppercase">
                Uložiť vozidlo
              </button>
            </form>
          ) : activeTab === "projects" ? (
            <div className="space-y-3">
              {clients.map(c => {
                const clientProjects = projects.filter(p => p.client_id === c.id);
                const isOpen = selectedClientDetailId === c.id;
                return (
                  <div key={c.id} className="bg-gray-800 rounded-xl border border-gray-700 overflow-hidden">
                    <div onClick={() => setSelectedClientDetailId(isOpen ? null : c.id)} className="p-3 flex justify-between items-center cursor-pointer hover:bg-gray-750">
                      <div>
                        <h4 className="font-extrabold text-white text-sm">{c.name}</h4>
                        <p className="text-[10px] text-gray-400">{clientProjects.length} pobočiek / miest</p>
                      </div>
                      <i className={`fa-solid ${isOpen ? 'fa-chevron-up' : 'fa-chevron-down'} text-xs text-gray-400`}></i>
                    </div>

                    {isOpen && (
                      <div className="p-3 bg-gray-900/70 border-t border-gray-700 space-y-2">
                        <button onClick={() => setAddingProjectClientId(addingProjectClientId === c.id ? null : c.id)} className="w-full bg-amber-500 text-black font-extrabold py-1.5 rounded text-xs shadow">
                          + Pridať miesto pod {c.name}
                        </button>

                        {addingProjectClientId === c.id && (
                          <div className="bg-gray-950 p-2.5 rounded-xl border border-amber-500/50 space-y-2">
                            <input type="text" value={newProjectName} onChange={e => setNewProjectName(e.target.value)} placeholder="Názov miesta / servisu" className="w-full bg-gray-900 border border-gray-700 rounded p-1 text-xs text-white" />
                            <input type="text" value={newProjectAddress} onChange={e => setNewProjectAddress(e.target.value)} placeholder="Presná adresa" className="w-full bg-gray-900 border border-gray-700 rounded p-1 text-xs text-gray-200" />
                            
                            <div className="grid grid-cols-2 gap-1.5 pt-1">
                              <div>
                                <label className="text-[8px] text-gray-400">% technika (PDR)</label>
                                <input type="number" value={newProjectTechPdrPercent} onChange={e => setNewProjectTechPdrPercent(e.target.value)} placeholder="100" className="w-full bg-gray-900 border border-gray-700 rounded p-1 text-xs text-amber-400 font-bold" />
                              </div>
                              <div>
                                <label className="text-[8px] text-gray-400">% technika (R&I)</label>
                                <input type="number" value={newProjectTechRiPercent} onChange={e => setNewProjectTechRiPercent(e.target.value)} placeholder="100" className="w-full bg-gray-900 border border-gray-700 rounded p-1 text-xs text-amber-400 font-bold" />
                              </div>
                            </div>

                            <div>
                              <label className="text-[8px] text-gray-400">Sadzba za 1 AW v € (voliteľné)</label>
                              <input type="number" value={newProjectAwRate} onChange={e => setNewProjectAwRate(e.target.value)} placeholder="Napr. 8.50" className="w-full bg-gray-900 border border-gray-700 rounded p-1 text-xs text-amber-400 font-bold" />
                            </div>

                            <button type="button" onClick={() => handleCreateProject(c.id)} className="w-full bg-amber-500 text-black font-extrabold py-1.5 text-xs rounded">Uložiť miesto</button>
                          </div>
                        )}

                        <div className="space-y-1">
                          {clientProjects.map(p => (
                            <div key={p.id} className="text-xs text-gray-300 p-2 rounded bg-gray-950/80 border border-gray-800 flex justify-between items-center">
                              <div>
                                <span className="font-bold text-white">{p.name}</span>
                                {p.address && <p className="text-[9px] text-gray-400">{p.address}</p>}
                                <p className="text-[8px] text-amber-400/80">Podiel: PDR {p.tech_pdr_percent}% | R&I {p.tech_ri_percent}% {p.aw_rate ? `| ${p.aw_rate}€/AW` : ''}</p>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          ) : (
            /* ZÁLOŽKA SÚPIS A REPORTY (PÁROVACÍ SÚPIS PRE VYÚČTOVANIE) */
            <div className="space-y-3">
              <input type="text" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} placeholder="Rýchle hľadanie kalkulácie, VIN, ŠPZ..." className="w-full bg-gray-800 border border-gray-700 rounded-xl p-2 text-xs text-white focus:border-amber-500" />
              
              <div className="space-y-1.5">
                {filteredVehicles.map(v => (
                  <div key={v.id} onClick={() => setSelectedVehicleDetail(v)} className="bg-gray-800 p-2.5 rounded-xl border border-gray-700 flex justify-between items-center cursor-pointer hover:border-amber-500/50">
                    <div>
                      <div className="flex items-center gap-1.5">
                        <span className="text-xs font-bold text-amber-400 font-mono">{v.client_calc_no || "Bez kalkulácie"}</span>
                        <span className="text-xs font-bold text-white">{v.brand} {v.model}</span>
                      </div>
                      <p className="text-[9px] text-gray-400 font-mono">VIN: {v.vin} | ŠPZ: {v.ecv}</p>
                      {v.note && <p className="text-[9px] text-yellow-400 truncate max-w-[200px]"><i className="fa-solid fa-shield-halved mr-1"></i>{v.note}</p>}
                    </div>
                    <div className="text-right">
                      {v.is_price_pending ? (
                        <span className="text-[10px] bg-yellow-500/20 text-yellow-300 font-bold px-1.5 py-0.5 rounded">
                          {v.aw_count ? `${v.aw_count} AW` : 'Neznáma'}
                        </span>
                      ) : (
                        <div>
                          <span className="text-xs bg-amber-500/20 text-amber-300 font-bold px-2 py-0.5 rounded">
                            {(Number(v.price) + Number(v.ri_price || 0)).toFixed(2)} €
                          </span>
                          <p className="text-[8px] text-gray-400 mt-0.5">Podiel: ~{((Number(v.price) * (v.tech_pdr_percent/100)) + (Number(v.ri_price || 0) * (v.tech_ri_percent/100))).toFixed(2)} €</p>
                        </div>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
