<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDR FlowBoard Pro</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const COLOR_DATA = {
      SK: ["Biela", "Čierna", "Sivá / Strieborná", "Modrá", "Červená", "Zelená", "Hnedá / Bronz"],
      DE: ["Weiß", "Schwarz", "Grau / Silber", "Blau", "Rot", "Grün", "Braun / Bronze"],
      EN: ["White", "Black", "Grey / Silver", "Blue", "Red", "Green", "Brown / Bronze"]
    };

    const TRANSLATIONS = {
      SK: {
        title: "PDR FlowBoard",
        subtitle: "SaaS Inspektor & Cenníky",
        tabOrders: "Zákazky",
        tabClients: "Zákazníci",
        tabReports: "Reports",
        scanBtn: "Scan Car",
        step1Label: "1. Odfotiť VIN kód",
        step2Label: "2. Odfotiť auto zozadu",
        clientLabel: "Zákazník (Firma)",
        projectLabel: "Zákazka / Park / Miesto",
        defaultProjectNotice: "✓ Predvolená zákazka",
        ecv: "ŠPZ / EČV",
        noEcvCheckbox: "Bez ŠPZ",
        vin: "VIN kód (Skontrolujte/Opravte)",
        brand: "Značka",
        model: "Model",
        color: "Farba karosérie",
        priceLabel: "Cena opravy (Cenník)",
        unknownPrice: "Neznáma (0.00)",
        saveOrder: "Uložiť zákazku",
        addClientBtn: "+ Nový zákazník",
        newClientTitle: "Vytvoriť Kartu Zákazníka",
        clientName: "Názov firmy / Meno",
        ico: "IČO / DIČ",
        phone: "Telefón",
        email: "E-mail",
        saveClient: "Uložiť zákazníka",
        myClients: "Moje klientske karty",
        noEcvNotice: "Bez ŠPZ / Nové vozidlo",
        catSmall: "Malé poškodenie",
        catMedium: "Stredné poškodenie",
        catLarge: "Veľké / Strecha",
        // Reports preklady
        filterClient: "Všetci zákazníci",
        filterProject: "Všetky projekty",
        filterMonth: "Všetky mesiace",
        generateReport: "Vytvoriť report (PDF / Export)",
        noReports: "Žiadne záznamy nevyhovujú filtru.",
        totalFiltered: "Celkom položiek"
      },
      DE: {
        title: "PDR FlowBoard",
        subtitle: "SaaS Inspektor & Preislisten",
        tabOrders: "Aufträge",
        tabClients: "Kunden",
        tabReports: "Reports",
        scanBtn: "Scan Car",
        step1Label: "1. FIN fotografieren",
        step2Label: "2. Heckfoto aufnehmen",
        clientLabel: "Kunde (Firma)",
        projectLabel: "Auftrag / Park / Standort",
        defaultProjectNotice: "✓ Standardauftrag",
        ecv: "Kennzeichen",
        noEcvCheckbox: "Ohne KZ",
        vin: "FIN / Fahrgestellnr.",
        brand: "Marke",
        model: "Modell",
        color: "Fahrzeugfarbe",
        priceLabel: "Reparaturpreis (Preisliste)",
        unknownPrice: "Unbekannt (0.00)",
        saveOrder: "Auftrag speichern",
        addClientBtn: "+ Neuer Kunde",
        newClientTitle: "Kundenkarte erstellen",
        clientName: "Firmenname / Name",
        ico: "Steuer-ID",
        phone: "Telefon",
        email: "E-Mail",
        saveClient: "Kunde speichern",
        myClients: "Meine Kundenkartei",
        noEcvNotice: "Ohne Kennzeichen / Neufahrzeug",
        catSmall: "Kleiner Schaden",
        catMedium: "Mittlerer Schaden",
        catLarge: "Groß / Dach",
        filterClient: "Alle Kunden",
        filterProject: "Alle Projekte",
        filterMonth: "Alle Monate",
        generateReport: "Report erstellen (PDF / Export)",
        noReports: "Keine Einträge für diesen Filter.",
        totalFiltered: "Einträge gesamt"
      },
      EN: {
        title: "PDR FlowBoard",
        subtitle: "SaaS Inspector & Pricing",
        tabOrders: "Orders",
        tabClients: "Clients",
        tabReports: "Reports",
        scanBtn: "Scan Car",
        step1Label: "1. Capture VIN Code",
        step2Label: "2. Capture Rear Vehicle Photo",
        clientLabel: "Client (Company)",
        projectLabel: "Job / Location / Project",
        defaultProjectNotice: "✓ Default project",
        ecv: "License Plate",
        noEcvCheckbox: "No Plate",
        vin: "VIN Number",
        brand: "Make",
        model: "Model",
        color: "Body Color",
        priceLabel: "Repair Price (Pricelist)",
        unknownPrice: "Unknown (0.00)",
        saveOrder: "Save Order",
        addClientBtn: "+ New Client",
        newClientTitle: "Create Client Card",
        clientName: "Company Name / Person",
        ico: "Tax ID",
        phone: "Phone",
        email: "E-mail",
        saveClient: "Save Client",
        myClients: "My Client Cards",
        noEcvNotice: "No Plate / New Vehicle",
        catSmall: "Small Damage",
        catMedium: "Medium Damage",
        catLarge: "Heavy / Roof",
        filterClient: "All Clients",
        filterProject: "All Projects",
        filterMonth: "All Months",
        generateReport: "Generate Report (PDF / Export)",
        noReports: "No records match the filter.",
        totalFiltered: "Total items"
      }
    };

    function App() {
      const [lang, setLang] = useState("SK");
      const [activeTab, setActiveTab] = useState("orders");
      const t = TRANSLATIONS[lang];
      const colorOptions = COLOR_DATA[lang];

      const cameraInputRef = useRef(null);

      const [scanStep, setScanStep] = useState(0);
      const [vinPhoto, setVinPhoto] = useState(null);
      const [rearPhoto, setRearPhoto] = useState(null);
      const [isAnalyzing, setIsAnalyzing] = useState(false);

      const [clientsData, setClientsData] = useState([
        {
          id: 1,
          name: "KHS Global",
          ico: "12345678",
          phone: "+421 905 111 222",
          email: "flota@khs.com",
          projects: [
            {
              id: 101,
              name: "Mníchov Logistický Park",
              priceType: "categories",
              categories: [
                { key: "catSmall", price: 150 },
                { key: "catMedium", price: 320 },
                { key: "catLarge", price: 650 }
              ]
            },
            {
              id: 102,
              name: "Trnava - Sklad Autohaus",
              priceType: "fixed",
              fixedPrice: 200
            }
          ]
        },
        {
          id: 2,
          name: "Bežné Autoservisy / Súkromní",
          ico: "87654321",
          phone: "+421 903 333 444",
          email: "info@dielna.sk",
          projects: [
            {
              id: 201,
              name: "Bežná oprava v teréne",
              priceType: "open"
            }
          ]
        }
      ]);

      // Ukážkové uložené záznamy pre Reports
      const [ordersList, setOrdersList] = useState([
        {
          id: 1,
          clientId: 1,
          clientName: "KHS Global",
          projectId: 101,
          projectName: "Mníchov Logistický Park",
          vin: "WVWZZZ3CZWE987654",
          ecv: "BL-555YY",
          brand: "Volkswagen",
          model: "Passat Variant",
          color: "Sivá / Strieborná",
          price: 320,
          date: "2026-03-15",
          monthYear: "2026-03"
        },
        {
          id: 2,
          clientId: 1,
          clientName: "KHS Global",
          projectId: 102,
          projectName: "Trnava - Sklad Autohaus",
          vin: "WAUZZZ4G5FN123789",
          ecv: "TT-222AA",
          brand: "Audi",
          model: "A6 Avant",
          color: "Čierna",
          price: 200,
          date: "2026-03-20",
          monthYear: "2026-03"
        },
        {
          id: 3,
          clientId: 2,
          clientName: "Bežné Autoservisy / Súkromní",
          projectId: 201,
          projectName: "Bežná oprava v teréne",
          vin: "WBA3A5C50EF654321",
          ecv: "KE-111XF",
          brand: "BMW",
          model: "Series 3",
          color: "Modrá",
          price: 450,
          date: "2026-02-10",
          monthYear: "2026-02"
        }
      ]);

      const [selectedClientId, setSelectedClientId] = useState(1);
      const [selectedProjectId, setSelectedProjectId] = useState(101);
      const [defaultProjectId, setDefaultProjectId] = useState(101);

      const [showNewClientForm, setShowNewClientForm] = useState(false);
      const [newClientData, setNewClientData] = useState({ name: "", ico: "", phone: "", email: "" });

      const [ecv, setEcv] = useState("");
      const [vin, setVin] = useState("");
      const [brand, setBrand] = useState("");
      const [model, setModel] = useState("");
      const [color, setColor] = useState(colorOptions[2]);
      const [hasNoEcv, setHasNoEcv] = useState(false);

      const [selectedCategoryPrice, setSelectedCategoryPrice] = useState(null);
      const [isUnknownPrice, setIsUnknownPrice] = useState(true);
      const [customPrice, setCustomPrice] = useState("");

      // Filtre pre záložku Reports
      const [reportFilterClient, setReportFilterClient] = useState("all");
      const [reportFilterProject, setReportFilterProject] = useState("all");
      const [reportFilterMonth, setReportFilterMonth] = useState("all");

      const currentClient = useMemo(() => clientsData.find(c => c.id === Number(selectedClientId)), [clientsData, selectedClientId]);
      const currentProject = useMemo(() => currentClient?.projects.find(p => p.id === Number(selectedProjectId)), [currentClient, selectedProjectId]);

      // Dostupné projekty pre vybraného klienta vo filtri reportov
      const reportProjectsList = useMemo(() => {
        if (reportFilterClient === "all") {
          return clientsData.flatMap(c => c.projects);
        }
        const cl = clientsData.find(c => c.id === Number(reportFilterClient));
        return cl ? cl.projects : [];
      }, [reportFilterClient, clientsData]);

      // Filtrované záznamy pre Reports
      const filteredReports = useMemo(() => {
        return ordersList.filter(ord => {
          if (reportFilterClient !== "all" && ord.clientId !== Number(reportFilterClient)) return false;
          if (reportFilterProject !== "all" && ord.projectId !== Number(reportFilterProject)) return false;
          if (reportFilterMonth !== "all" && ord.monthYear !== reportFilterMonth) return false;
          return true;
        });
      }, [ordersList, reportFilterClient, reportFilterProject, reportFilterMonth]);

      useEffect(() => {
        setColor(colorOptions[2]);
      }, [lang]);

      useEffect(() => {
        if (currentProject) {
          if (currentProject.priceType === 'categories' && currentProject.categories.length > 0) {
            setSelectedCategoryPrice(currentProject.categories[0].price);
          } else if (currentProject.priceType === 'fixed') {
            setSelectedCategoryPrice(currentProject.fixedPrice);
          } else {
            setIsUnknownPrice(true);
            setCustomPrice("");
          }
        }
      }, [selectedProjectId, currentProject]);

      const startScanning = () => {
        setScanStep(1);
        triggerCamera();
      };

      const triggerCamera = () => {
        if (cameraInputRef.current) {
          cameraInputRef.current.click();
        }
      };

      const handlePhotoCapture = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const photoUrl = URL.createObjectURL(file);

        if (scanStep === 1) {
          setVinPhoto(photoUrl);
          setIsAnalyzing(true);
          
          setTimeout(() => {
            setVin("WVWZZZ3CZWE987654");
            setIsAnalyzing(false);
          }, 1000);

        } else if (scanStep === 2) {
          setRearPhoto(photoUrl);
          setIsAnalyzing(true);

          setTimeout(() => {
            setEcv("BL-555YY");
            setBrand("Volkswagen");
            setModel("Passat Variant");
            setIsAnalyzing(false);
            setScanStep(0);
          }, 1200);
        }
      };

      const handleAddClient = (e) => {
        e.preventDefault();
        if (!newClientData.name) return;
        const newClient = {
          id: Date.now(),
          ...newClientData,
          projects: [{ id: Date.now() + 1, name: "Všeobecná zákazka", priceType: "open" }]
        };
        setClientsData([...clientsData, newClient]);
        setSelectedClientId(newClient.id);
        setSelectedProjectId(newClient.projects[0].id);
        setNewClientData({ name: "", ico: "", phone: "", email: "" });
        setShowNewClientForm(false);
        setActiveTab("orders");
      };

      // Uloženie novej zákazky a pridanie do Reports
      const handleSaveOrder = (e) => {
        e.preventDefault();
        const finalPrice = currentProject?.priceType === 'open' 
          ? (isUnknownPrice ? 0 : Number(customPrice)) 
          : selectedCategoryPrice;

        const newOrder = {
          id: Date.now(),
          clientId: currentClient.id,
          clientName: currentClient.name,
          projectId: currentProject.id,
          projectName: currentProject.name,
          vin: vin || "N/A",
          ecv: hasNoEcv ? "Bez ŠPZ" : (ecv || "N/A"),
          brand: brand || "Neznáma",
          model: model || "Neznámy",
          color: color,
          price: finalPrice || 0,
          date: new Date().toISOString().split('T')[0],
          monthYear: new Date().toISOString().slice(0, 7)
        };

        setOrdersList([newOrder, ...ordersList]);
        alert("Zákazka úspešne uložená do reportov!");
        // Reset formulára
        setVin("");
        setEcv("");
        setBrand("");
        setModel("");
        setVinPhoto(null);
        setRearPhoto(null);
      };

      return (
        <div className="max-w-md mx-auto p-4 pb-24">
          <input 
            type="file" 
            accept="image/*" 
            capture="environment" 
            ref={cameraInputRef} 
            onChange={handlePhotoCapture} 
            className="hidden" 
          />

          <header className="flex justify-between items-center mb-4 border-b border-gray-700 pb-3">
            <div>
              <h1 className="text-xl font-bold text-amber-500">{t.title}</h1>
              <p className="text-xs text-gray-400">{t.subtitle}</p>
            </div>
            
            <div className="flex bg-gray-800 border border-gray-600 rounded p-1 gap-1">
              {["SK", "DE", "EN"].map(l => (
                <button
                  key={l}
                  onClick={() => setLang(l)}
                  className={`px-2 py-0.5 text-xs font-bold rounded ${lang === l ? 'bg-amber-500 text-black' : 'text-gray-400 hover:text-white'}`}
                >
                  {l}
                </button>
              ))}
            </div>
          </header>

          {/* HLAVNÁ NAVIGÁCIA (3 ZÁLOŽKY) */}
          <div className="flex bg-gray-800 p-1 rounded-xl mb-4 border border-gray-700">
            <button 
              onClick={() => setActiveTab("orders")} 
              className={`flex-1 py-2 text-[11px] font-bold rounded-lg ${activeTab === 'orders' ? 'bg-amber-500 text-black' : 'text-gray-400'}`}
            >
              <i className="fa-solid fa-car mr-1"></i>{t.tabOrders}
            </button>
            <button 
              onClick={() => setActiveTab("clients")} 
              className={`flex-1 py-2 text-[11px] font-bold rounded-lg ${activeTab === 'clients' ? 'bg-amber-500 text-black' : 'text-gray-400'}`}
            >
              <i className="fa-solid fa-address-book mr-1"></i>{t.tabClients}
            </button>
            <button 
              onClick={() => setActiveTab("reports")} 
              className={`flex-1 py-2 text-[11px] font-bold rounded-lg ${activeTab === 'reports' ? 'bg-amber-500 text-black' : 'text-gray-400'}`}
            >
              <i className="fa-solid fa-chart-pie mr-1"></i>{t.tabReports} ({ordersList.length})
            </button>
          </div>

          {activeTab === "orders" ? (
            <form onSubmit={handleSaveOrder} className="bg-gray-800 p-4 rounded-xl border border-gray-700 space-y-4">
              <div className="bg-amber-500/10 border border-amber-500/30 p-3 rounded-lg text-center space-y-3">
                <button 
                  type="button" 
                  onClick={startScanning}
                  className="w-full bg-amber-500 hover:bg-amber-400 text-black font-extrabold py-3.5 rounded-lg text-base flex justify-center items-center gap-2 shadow-lg transition-all tracking-wide"
                >
                  <i className="fa-solid fa-camera text-xl"></i>
                  <span>{t.scanBtn}</span>
                </button>

                {scanStep > 0 && (
                  <div className="bg-gray-900/90 p-3 rounded-lg border border-amber-500/50 space-y-2">
                    <div className="flex justify-between items-center text-xs font-bold">
                      <span className={scanStep === 1 ? "text-amber-400 font-black" : "text-gray-400"}>{t.step1Label}</span>
                      <span className={scanStep === 2 ? "text-amber-400 font-black" : "text-gray-400"}>{t.step2Label}</span>
                    </div>
                    
                    {isAnalyzing ? (
                      <p className="text-xs text-amber-300 animate-pulse"><i className="fa-solid fa-spinner fa-spin mr-1"></i> Analyzujem fotku...</p>
                    ) : scanStep === 1 && vin ? (
                      <div className="space-y-2 pt-1 border-t border-gray-800">
                        <p className="text-xs text-gray-300">Skontrolujte prečítaný VIN kód:</p>
                        <input 
                          type="text" 
                          value={vin} 
                          onChange={e => setVin(e.target.value)}
                          className="w-full text-center text-sm font-mono font-bold text-amber-400 bg-black/60 py-1.5 px-2 rounded border border-amber-500/50 uppercase"
                        />
                        <button 
                          type="button" 
                          onClick={() => { setScanStep(2); triggerCamera(); }}
                          className="w-full bg-amber-500 text-black font-bold py-2 rounded text-xs mt-1"
                        >
                          Pokračovať na Krok 2 ➔
                        </button>
                      </div>
                    ) : null}
                  </div>
                )}

                <div className="flex gap-2 justify-center pt-1">
                  {vinPhoto && (
                    <div className="relative w-16 h-16 rounded overflow-hidden border border-amber-500">
                      <img src={vinPhoto} className="w-full h-full object-cover" />
                      <span className="absolute bottom-0 right-0 bg-black/80 text-[8px] text-amber-300 px-1 font-bold">VIN</span>
                    </div>
                  )}
                  {rearPhoto && (
                    <div className="relative w-16 h-16 rounded overflow-hidden border border-amber-500">
                      <img src={rearPhoto} className="w-full h-full object-cover" />
                      <span className="absolute bottom-0 right-0 bg-black/80 text-[8px] text-amber-300 px-1 font-bold">Zadná</span>
                    </div>
                  )}
                </div>
              </div>

              <div>
                <div className="flex justify-between items-center mb-1">
                  <label className="text-xs text-gray-400">{t.clientLabel}</label>
                  <button 
                    type="button" 
                    onClick={() => { setActiveTab("clients"); setShowNewClientForm(true); }}
                    className="text-xs text-amber-400 font-semibold hover:underline"
                  >
                    {t.addClientBtn}
                  </button>
                </div>
                <select 
                  value={selectedClientId} 
                  onChange={e => {
                    setSelectedClientId(e.target.value);
                    const firstProj = clientsData.find(c => c.id === Number(e.target.value))?.projects[0];
                    if (firstProj) setSelectedProjectId(firstProj.id);
                  }} 
                  className="w-full bg-gray-900 border border-gray-600 rounded p-2 text-sm text-white font-semibold"
                >
                  {clientsData.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                </select>
              </div>

              <div>
                <label className="block text-xs text-gray-400 mb-1">{t.projectLabel}</label>
                <div className="flex gap-2">
                  <select 
                    value={selectedProjectId} 
                    onChange={e => setSelectedProjectId(e.target.value)} 
                    className="w-full bg-gray-900 border border-gray-600 rounded p-2 text-sm text-amber-400 font-bold"
                  >
                    {(currentClient?.projects || []).map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                  </select>
                  
                  <button 
                    type="button" 
                    onClick={() => setDefaultProjectId(selectedProjectId)}
                    className={`px-3 py-2 rounded border ${defaultProjectId === Number(selectedProjectId) ? 'bg-amber-500 border-amber-400 text-black font-bold' : 'bg-gray-700 border-gray-600 text-gray-300'}`}
                  >
                    <i className="fa-solid fa-star"></i>
                  </button>
                </div>
                {defaultProjectId === Number(selectedProjectId) && (
                  <p className="text-[10px] text-green-400 mt-1">{t.defaultProjectNotice}</p>
                )}
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block text-xs text-gray-400 mb-1">{t.vin}</label>
                  <input type="text" value={vin} onChange={e => setVin(e.target.value)} placeholder="WVWZZZ..." className="w-full bg-gray-900 border border-gray-600 rounded p-2 text-xs uppercase text-amber-400 font-mono font-bold" />
                </div>
                <div>
                  <div className="flex justify-between items-center mb-1">
                    <label className="text-xs text-gray-400">{t.ecv}</label>
                    <label className="text-[9px] text-gray-400 flex items-center gap-1 cursor-pointer">
                      <input type="checkbox" checked={hasNoEcv} onChange={e => setHasNoEcv(e.target.checked)} />
                      {t.noEcvCheckbox}
                    </label>
                  </div>
                  <input 
                    type="text" 
                    value={hasNoEcv ? t.noEcvNotice : ecv} 
                    disabled={hasNoEcv}
                    onChange={e => setEcv(e.target.value)} 
                    placeholder="BL-123AB" 
                    className={`w-full bg-gray-900 border border-gray-600 rounded p-2 text-sm uppercase text-amber-400 font-bold ${hasNoEcv ? 'opacity-50 text-gray-400' : ''}`} 
                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block text-[10px] text-gray-400 mb-1">{t.brand}</label>
                  <input type="text" value={brand} onChange={e => setBrand(e.target.value)} placeholder="Volkswagen" className="w-full bg-gray-900 border border-gray-600 rounded p-2 text-xs text-white" />
                </div>
                <div>
                  <label className="block text-[10px] text-gray-400 mb-1">{t.model}</label>
                  <input type="text" value={model} onChange={e => setModel(e.target.value)} placeholder="Passat" className="w-full bg-gray-900 border border-gray-600 rounded p-2 text-xs text-white" />
                </div>
              </div>

              <div>
                <label className="block text-xs text-gray-400 mb-1">{t.color}</label>
                <div className="flex gap-1 overflow-x-auto pb-1 mb-1">
                  {colorOptions.map(c => (
                    <button
                      key={c}
                      type="button"
                      onClick={() => setColor(c)}
                      className={`px-2.5 py-1 text-[10px] rounded border whitespace-nowrap ${color === c ? 'bg-amber-500 border-amber-400 text-black font-bold' : 'bg-gray-900 border-gray-700 text-gray-300'}`}
                    >
                      {c}
                    </button>
                  ))}
                </div>
                <input type="text" value={color} onChange={e => setColor(e.target.value)} className="w-full bg-gray-900 border border-gray-600 rounded p-2 text-xs text-white" />
              </div>

              {currentProject?.priceType === 'categories' && (
                <div className="bg-gray-900/80 p-3 rounded-lg border border-amber-500/40 space-y-2">
                  <label className="block text-xs text-amber-300 font-medium">{t.priceLabel}:</label>
                  <div className="grid grid-cols-1 gap-2">
                    {currentProject.categories.map((cat, idx) => (
                      <button
                        key={idx}
                        type="button"
                        onClick={() => setSelectedCategoryPrice(cat.price)}
                        className={`p-2 rounded-lg border text-left flex justify-between items-center transition-all ${selectedCategoryPrice === cat.price ? 'bg-amber-500 border-amber-400 text-black font-bold' : 'bg-gray-800 border-gray-700 text-gray-300'}`}
                      >
                        <span className="text-xs">{t[cat.key]}</span>
                        <span className="text-sm font-black">{cat.price} €</span>
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {currentProject?.priceType === 'fixed' && (
                <div className="bg-gray-900/80 p-3 rounded-lg border border-green-500/40 flex justify-between items-center">
                  <div>
                    <p className="text-xs text-gray-400">Fixná cena pre zákazku:</p>
                    <p className="text-lg font-black text-green-400">{currentProject.fixedPrice} € / diel</p>
                  </div>
                  <span className="text-[10px] bg-green-900/50 text-green-300 border border-green-700 px-2 py-1 rounded">Auto-Cena</span>
                </div>
              )}

              {currentProject?.priceType === 'open' && (
                <div>
                  <label className="block text-xs text-gray-400 mb-1">{t.priceLabel}</label>
                  {isUnknownPrice ? (
                    <button 
                      type="button"
                      onClick={() => setIsUnknownPrice(false)}
                      className="w-full bg-gray-900 border border-amber-500/50 text-amber-400 rounded p-2 text-left text-sm font-semibold flex justify-between items-center"
                    >
                      <span>{t.unknownPrice}</span>
                      <span className="text-xs bg-amber-500/20 px-2 py-1 rounded text-amber-300">Zadať sumu</span>
                    </button>
                  ) : (
                    <div className="flex w-full gap-2">
                      <input 
                        type="number" 
                        value={customPrice} 
                        onChange={e => setCustomPrice(e.target.value)}
                        placeholder="0.00"
                        className="w-full bg-gray-900 border border-gray-600 rounded p-2 text-lg font-bold text-amber-400"
                      />
                      <button type="button" onClick={() => setIsUnknownPrice(true)} className="px-2 bg-gray-700 text-gray-300 rounded text-xs">X</button>
                    </div>
                  )}
                </div>
              )}

              <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-black font-bold py-3 rounded-lg text-center mt-2 shadow">
                {t.saveOrder}
              </button>
            </form>
          ) : activeTab === "clients" ? (
            <div className="space-y-4">
              {showNewClientForm ? (
                <form onSubmit={handleAddClient} className="bg-gray-800 p-4 rounded-xl border border-amber-500/50 space-y-3">
                  <div className="flex justify-between items-center border-b border-gray-700 pb-2">
                    <h3 className="font-bold text-amber-400 text-sm">{t.newClientTitle}</h3>
                    <button type="button" onClick={() => setShowNewClientForm(false)} className="text-xs text-gray-400">✕ Zrušiť</button>
                  </div>
                  <div>
                    <label className="block text-[10px] text-gray-400 mb-1">{t.clientName}</label>
                    <input type="text" value={newClientData.name} onChange={e => setNewClientData({...newClientData, name: e.target.value})} className="w-full bg-gray-900 border border-gray-600 rounded p-2 text-sm text-white" required />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-[10px] text-gray-400 mb-1">{t.ico}</label>
                      <input type="text" value={newClientData.ico} onChange={e => setNewClientData({...newClientData, ico: e.target.value})} className="w-full bg-gray-900 border border-gray-600 rounded p-2 text-xs text-white" />
                    </div>
                    <div>
                      <label className="block text-[10px] text-gray-400 mb-1">{t.phone}</label>
                      <input type="text" value={newClientData.phone} onChange={e => setNewClientData({...newClientData, phone: e.target.value})} className="w-full bg-gray-900 border border-gray-600 rounded p-2 text-xs text-white" />
                    </div>
                  </div>
                  <button type="submit" className="w-full bg-amber-500 text-black font-bold py-2 rounded text-xs">
                    {t.saveClient}
                  </button>
                </form>
              ) : (
                <button onClick={() => setShowNewClientForm(true)} className="w-full bg-gray-800 border border-amber-500 text-amber-400 font-bold py-2.5 rounded-lg text-xs">
                  + {t.newClientTitle}
                </button>
              )}

              <div className="space-y-2">
                <h3 className="text-xs font-semibold text-gray-400">{t.myClients}</h3>
                {clientsData.map(c => (
                  <div key={c.id} className="bg-gray-800 p-3 rounded-xl border border-gray-700 space-y-1">
                    <div className="flex justify-between items-start">
                      <p className="font-bold text-amber-400 text-sm">{c.name}</p>
                      {c.ico && <span className="text-[10px] bg-gray-700 text-gray-300 px-1.5 py-0.5 rounded">IČO: {c.ico}</span>}
                    </div>
                    <p className="text-xs text-gray-400"><i className="fa-solid fa-folder-open mr-1"></i>Projekty / Zákazky: {c.projects.length}</p>
                  </div>
                ))}
              </div>
            </div>
          ) : (
            /* ZÁLOŽKA REPORTS (PREHĽADY A FILTRE) */
            <div className="space-y-4">
              {/* PANEL FILTROV */}
              <div className="bg-gray-800 p-3 rounded-xl border border-gray-700 space-y-2">
                <div className="grid grid-cols-1 gap-2">
                  {/* Filter zákazníka */}
                  <div>
                    <label className="block text-[10px] text-gray-400 mb-1"><i className="fa-solid fa-filter mr-1"></i>{t.clientLabel}</label>
                    <select 
                      value={reportFilterClient} 
                      onChange={e => {
                        setReportFilterClient(e.target.value);
                        setReportFilterProject("all"); // Reset projektu pri zmene klienta
                      }} 
                      className="w-full bg-gray-900 border border-gray-600 rounded p-2 text-xs text-white font-semibold"
                    >
                      <option value="all">{t.filterClient}</option>
                      {clientsData.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                    </select>
                  </div>

                  {/* Filter projektu / zákazky */}
                  <div>
                    <label className="block text-[10px] text-gray-400 mb-1"><i className="fa-solid fa-folder mr-1"></i>{t.projectLabel}</label>
                    <select 
                      value={reportFilterProject} 
                      onChange={e => setReportFilterProject(e.target.value)} 
                      className="w-full bg-gray-900 border border-gray-600 rounded p-2 text-xs text-amber-400 font-bold"
                    >
                      <option value="all">{t.filterProject}</option>
                      {reportProjectsList.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                    </select>
                  </div>

                  {/* Filter mesiaca a roka */}
                  <div>
                    <label className="block text-[10px] text-gray-400 mb-1"><i className="fa-solid fa-calendar mr-1"></i>Mesiac / Rok</label>
                    <select 
                      value={reportFilterMonth} 
                      onChange={e => setReportFilterMonth(e.target.value)} 
                      className="w-full bg-gray-900 border border-gray-600 rounded p-2 text-xs text-white"
                    >
                      <option value="all">{t.filterMonth}</option>
                      <option value="2026-03">Marec 2026</option>
                      <option value="2026-02">Február 2026</option>
                      <option value="2026-01">Január 2026</option>
                    </select>
                  </div>
                </div>

                {/* TLAČIDLO VYTVORIŤ REPORT */}
                <button 
                  type="button" 
                  onClick={() => alert(`Generujem report pre ${filteredReports.length} záznamov...`)}
                  className="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-2.5 rounded-lg text-xs flex justify-center items-center gap-2 mt-2 shadow"
                >
                  <i className="fa-solid fa-file-pdf text-sm"></i>
                  <span>{t.generateReport}</span>
                </button>
              </div>

              {/* VÝPIS ZÁZNAMOV PODĽA FILTRA */}
              <div className="space-y-2">
                <div className="flex justify-between items-center text-xs text-gray-400 px-1">
                  <span>{t.totalFiltered}:</span>
                  <span className="font-bold text-amber-400">{filteredReports.length}</span>
                </div>

                {filteredReports.length === 0 ? (
                  <div className="bg-gray-800 p-6 rounded-xl border border-gray-700 text-center text-gray-400 text-xs">
                    {t.noReports}
                  </div>
                ) : (
                  filteredReports.map(ord => (
                    <div key={ord.id} className="bg-gray-800 p-3 rounded-xl border border-gray-700 space-y-2">
                      <div className="flex justify-between items-start border-b border-gray-700 pb-1.5">
                        <div>
                          <p className="font-bold text-amber-400 text-xs">{ord.clientName}</p>
                          <p className="text-[10px] text-gray-400"><i className="fa-solid fa-location-dot mr-1"></i>{ord.projectName}</p>
                        </div>
                        <span className="text-xs bg-amber-500/20 text-amber-300 font-black px-2 py-0.5 rounded border border-amber-500/40">
                          {ord.price} €
                        </span>
                      </div>

                      <div className="grid grid-cols-2 gap-2 text-xs">
                        <div>
                          <span className="text-[10px] text-gray-400 block">Vozidlo:</span>
                          <span className="font-bold text-white">{ord.brand} {ord.model}</span>
                        </div>
                        <div>
                          <span className="text-[10px] text-gray-400 block">ŠPZ / VIN:</span>
                          <span className="font-mono text-[11px] text-amber-300">{ord.ecv}</span>
                        </div>
                      </div>

                      <div className="flex justify-between items-center text-[10px] text-gray-400 pt-1 border-t border-gray-700/60">
                        <span>Farba: {ord.color}</span>
                        <span>Dátum: {ord.date}</span>
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
