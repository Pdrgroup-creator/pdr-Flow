  <footer class="py-2.5 text-center text-xs text-gray-500 border-t border-gray-800 bg-gray-950/60">
    PDR FlowBoard &copy; 2026 | Powered by P<span class="text-amber-500 font-black">3</span>D<span class="text-amber-500 font-black">R</span>0
  </footer>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const SUPABASE_URL = "https://hzmipgjpjhibxmkdadvf.supabase.co";
    const SUPABASE_KEY = "sb_publishable_5lQPiP19Qy2xwDq6eUXDmQ_MB5IYkHQ";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const COLOR_OPTIONS = ["Biela", "Čierna", "Sivá / Strieborná", "Modrá", "Červená", "Zelená", "Hnedá / Bronz"];

    // Klientska kompresia na max 1600 px (JPEG 0.78)
    const compressImage = (file) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const maxDim = 1600;
            let width = img.width;
            let height = img.height;

            if (width > maxDim || height > maxDim) {
              if (width > height) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              } else {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }

            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob(
              (blob) => {
                if (blob) resolve(blob);
                else reject(new Error("Canvas kompresia zlyhala"));
              },
              "image/jpeg",
              0.78
            );
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    };

    function App() {
      const [currency, setCurrency] = useState(() => localStorage.getItem("pdr_curr") || "EUR");
      const [activeTab, setActiveTab] = useState("vehicles");
      const currSymbol = currency === "EUR" ? "€" : "$";

      const [currentUser, setCurrentUser] = useState(null);
      const [loadingUser, setLoadingUser] = useState(true);

      const [clients, setClients] = useState([]);
      const [projects, setProjects] = useState([]);
      const [vehicles, setVehicles] = useState([]);

      const [selectedClientId, setSelectedClientId] = useState(() => localStorage.getItem("pdr_last_client") || "");
      const [selectedProjectId, setSelectedProjectId] = useState(() => localStorage.getItem("pdr_last_project") || "");

      // Bottom Sheet & Editácia
      const [activeBottomSheet, setActiveBottomSheet] = useState(null);
      const [isEditingSheet, setIsEditingSheet] = useState(false);
      const [sheetEditData, setSheetEditData] = useState({});

      const [selectedVehicleDetail, setSelectedVehicleDetail] = useState(null);
      const [isUploading, setIsUploading] = useState(false);
      const [uploadStatusText, setUploadStatusText] = useState("");

      // Doplnenie ceny pre uzavreté auto s neznámou cenou
      const [latePriceInput, setLatePriceInput] = useState("");

      // Správa Klientov a Miest
      const [selectedClientDetailId, setSelectedClientDetailId] = useState(null);
      const [showArchivedProjects, setShowArchivedProjects] = useState(false);
      const [showNewClientForm, setShowNewClientForm] = useState(false);
      const [newClientName, setNewClientName] = useState("");
      const [newClientPrefix, setNewClientPrefix] = useState("");
      const [newClientAutoNum, setNewClientAutoNum] = useState(true);
      const [newClientAddress, setNewClientAddress] = useState("");
      const [newClientPhone, setNewClientPhone] = useState("");

      // Nové miesto a interaktívny generátor kategórií
      const [addingProjectClientId, setAddingProjectClientId] = useState(null);
      const [newProjectName, setNewProjectName] = useState("");
      const [newProjectAddress, setNewProjectAddress] = useState("");
      const [newProjectPricingMode, setNewProjectPricingMode] = useState("free");
      const [newProjectFixedPrice, setNewProjectFixedPrice] = useState("");
      const [projectCategoriesList, setProjectCategoriesList] = useState([]);
      const [tempCategoryPrice, setTempCategoryPrice] = useState("");
      const [newProjectTechPdrPercent, setNewProjectTechPdrPercent] = useState("100");
      const [newProjectTechRiPercent, setNewProjectTechRiPercent] = useState("100");
      const [newProjectAwRate, setNewProjectAwRate] = useState("");

      // Filtre v reporte
      const [repClientFilter, setRepClientFilter] = useState("all");
      const [repProjectFilter, setRepProjectFilter] = useState("all");
      const [repDateRange, setRepDateRange] = useState("all");
      const [repSearchQuery, setRepSearchQuery] = useState("");

      // Formulár vozidla
      const cameraInputRef = useRef(null);
      const damagePhotoInputRef = useRef(null);

      const [scanStep, setScanStep] = useState(0);
      const [vinFile, setVinFile] = useState(null);
      const [rearFile, setRearFile] = useState(null);
      const [sheetFile, setSheetFile] = useState(null);
      const [damageFiles, setDamageFiles] = useState([]);

      const [vinPreview, setVinPreview] = useState(null);
      const [rearPreview, setRearPreview] = useState(null);
      const [sheetPreview, setSheetPreview] = useState(null);

      const [clientCalcNo, setClientCalcNo] = useState("");
      const [vin, setVin] = useState("");
      const [ecv, setEcv] = useState("");
      const [hasNoEcv, setHasNoEcv] = useState(false);
      const [brand, setBrand] = useState("");
      const [model, setModel] = useState("");
      const [color, setColor] = useState("Sivá / Strieborná");

      // Ceny a AW
      const [price, setPrice] = useState("");
      const [awCount, setAwCount] = useState("");
      const [selectedCategoryLabel, setSelectedCategoryLabel] = useState("");
      const [riPrice, setRiPrice] = useState("");
      const [isPricePending, setIsPricePending] = useState(false);
      const [damageNote, setDamageNote] = useState("");

      // Inicializácia prihlásenia
      useEffect(() => {
        let mounted = true;
        supabase.auth.getSession().then(({ data: { session } }) => {
          if (mounted) {
            if (session?.user) setCurrentUser({ id: session.user.id, email: session.user.email });
            setLoadingUser(false);
          }
        });
        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          if (mounted) {
            setCurrentUser(session?.user ? { id: session.user.id, email: session.user.email } : null);
            setLoadingUser(false);
          }
        });
        return () => { mounted = false; subscription.unsubscribe(); };
      }, []);

      const loadData = async () => {
        try {
          const { data: cData } = await supabase.from("clients").select("*").order("name");
          if (cData) {
            setClients(cData);
            if (!selectedClientId && cData.length > 0) {
              setSelectedClientId(cData[0].id);
              localStorage.setItem("pdr_last_client", cData[0].id);
            }
          }
          const { data: pData } = await supabase.from("projects").select("*").order("name");
          if (pData) setProjects(pData);

          const { data: vData } = await supabase.from("vehicles").select("*").order("created_at", { ascending: false });
          if (vData) setVehicles(vData);
        } catch (e) {
          console.error(e);
        }
      };

      useEffect(() => {
        if (currentUser) loadData();
      }, [currentUser]);

      const availableProjects = useMemo(() => {
        return projects.filter(p => p.client_id === selectedClientId && p.is_active !== false);
      }, [projects, selectedClientId]);

      useEffect(() => {
        if (availableProjects.length > 0) {
          const found = availableProjects.find(p => p.id === selectedProjectId);
          if (!found) {
            setSelectedProjectId(availableProjects[0].id);
            localStorage.setItem("pdr_last_project", availableProjects[0].id);
          }
        } else {
          setSelectedProjectId("");
        }
      }, [availableProjects, selectedClientId]);

      const currentSelectedProject = useMemo(() => {
        return projects.find(p => p.id === selectedProjectId);
      }, [projects, selectedProjectId]);

      // Správanie cien podľa režimu miesta
      useEffect(() => {
        if (!currentSelectedProject) return;

        if (currentSelectedProject.pricing_mode === "fixed" && currentSelectedProject.fixed_price) {
          setPrice(String(currentSelectedProject.fixed_price));
          setAwCount("");
          setSelectedCategoryLabel("");
          setIsPricePending(false);
        } else if (currentSelectedProject.pricing_mode === "categories") {
          const cats = currentSelectedProject.pricing_categories || [];
          if (cats.length > 0) {
            setSelectedCategoryLabel(cats[0].label);
            setPrice(String(cats[0].price));
            setAwCount("");
            setIsPricePending(false);
          }
        } else if (currentSelectedProject.pricing_mode === "free") {
          setSelectedCategoryLabel("");
        }
      }, [currentSelectedProject]);

      // DUÁLNA LOGIKA CENA vs AW (Vzájomné blokovanie v režime FREE)
      const isTypingPrice = Boolean(price && price.trim() !== "");
      const isTypingAw = Boolean(awCount && awCount.trim() !== "");
      const isAwRateMissing = currentSelectedProject?.pricing_mode === "free" && isTypingAw && !currentSelectedProject?.aw_rate;

      const handleDirectPriceChange = (val) => {
        setPrice(val);
        if (val && val.trim() !== "") {
          setAwCount(""); // Deaktivácia a vyčistenie AW
          setIsPricePending(false);
        }
      };

      const handleAwChange = (val) => {
        setAwCount(val);
        if (val && val.trim() !== "") {
          const count = parseFloat(val);
          if (!isNaN(count) && currentSelectedProject?.aw_rate) {
            setPrice((count * parseFloat(currentSelectedProject.aw_rate)).toFixed(2));
            setIsPricePending(false);
          } else {
            setPrice(""); // Sadzba chýba, cena zostáva neznáma
          }
        } else {
          setPrice("");
        }
      };

      // Stav možnosti uzavretia zákazky
      const canCloseRecord = useMemo(() => {
        if (isPricePending) return true; // Explicitné odloženie ceny povoľuje uzavretie
        if (currentSelectedProject?.pricing_mode === "free" && isTypingAw && isAwRateMissing) {
          return false; // Chýbajúca sadzba bez zaškrtnutia blokuje uzavretie
        }
        return true;
      }, [isPricePending, currentSelectedProject, isTypingAw, isAwRateMissing]);

      const techEarned = useMemo(() => {
        const pdrP = parseFloat(currentSelectedProject?.tech_pdr_percent ?? 100) / 100;
        const riP = parseFloat(currentSelectedProject?.tech_ri_percent ?? 100) / 100;
        const pdrVal = parseFloat(price) || 0;
        const riVal = parseFloat(riPrice) || 0;
        return (pdrVal * pdrP + riVal * riP).toFixed(2);
      }, [price, riPrice, currentSelectedProject]);

      // Automatické poradové číslovanie kalkulácie
      useEffect(() => {
        if (!selectedClientId) return;
        const client = clients.find(c => c.id === selectedClientId);
        const currentYear = new Date().getFullYear();

        if (client && client.auto_numbering && client.calc_prefix) {
          const prefixMatch = `${client.calc_prefix}/${currentYear}/`;
          const clientProjectIds = projects.filter(p => p.client_id === selectedClientId).map(p => p.id);
          
          let maxSeq = 0;
          vehicles.forEach(v => {
            if (clientProjectIds.includes(v.project_id) && v.client_calc_no && v.client_calc_no.startsWith(prefixMatch)) {
              const numPart = parseInt(v.client_calc_no.replace(prefixMatch, ""), 10);
              if (!isNaN(numPart) && numPart > maxSeq) maxSeq = numPart;
            }
          });
          setClientCalcNo(`${prefixMatch}${String(maxSeq + 1).padStart(3, "0")}`);
        } else {
          setClientCalcNo("");
        }
      }, [selectedClientId, clients, projects, vehicles]);

      // Generátor kategórií (Cat 1: 350 €)
      const handleAddCategoryItem = () => {
        const p = parseFloat(tempCategoryPrice);
        if (isNaN(p) || p <= 0) return alert("Zadajte platnú sumu.");
        if (projectCategoriesList.length >= 10) return alert("Maximum je 10 kategórií.");

        const nextCat = { label: `Cat ${projectCategoriesList.length + 1}`, price: p };
        setProjectCategoriesList([...projectCategoriesList, nextCat]);
        setTempCategoryPrice("");
      };

      const handleRemoveCategoryItem = (idx) => {
        const reindexed = projectCategoriesList.filter((_, i) => i !== idx).map((c, i) => ({ ...c, label: `Cat ${i + 1}` }));
        setProjectCategoriesList(reindexed);
      };

      // Foto záchyt (Kamera aj Galéria)
      const handlePhotoCapture = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        if (scanStep === 1) {
          setVinFile(file);
          setVinPreview(URL.createObjectURL(file));
          setTimeout(() => setVin("WVWZZZ3CZWE987654"), 400);
        } else if (scanStep === 2) {
          setRearFile(file);
          setRearPreview(URL.createObjectURL(file));
          setTimeout(() => {
            setEcv("BL-555YY");
            setBrand("Volkswagen");
            setModel("Passat Variant");
          }, 400);
        } else if (scanStep === 3) {
          setSheetFile(file);
          setSheetPreview(URL.createObjectURL(file));
          setScanStep(0);
        }
      };

      const handleDamagePhotoAdd = (e) => {
        const file = e.target.files[0];
        if (!file || damageFiles.length >= 5) return;
        setDamageFiles([...damageFiles, file]);
      };

      const uploadSingleFile = async (file, path) => {
        const compressedBlob = await compressImage(file);
        const { error } = await supabase.storage.from("vehicle-photos").upload(path, compressedBlob, {
          contentType: "image/jpeg",
          upsert: true
        });
        if (error) throw error;
        const { data } = supabase.storage.from("vehicle-photos").getPublicUrl(path);
        return data.publicUrl;
      };

      // Uloženie auta s kontrolou uzavretia
      const handleSaveVehicle = async (e) => {
        e.preventDefault();
        if (!selectedProjectId) return alert("Vyberte najprv platného Klienta a Miesto.");

        if (!canCloseRecord) {
          return alert("Zákazku nie je možné uzavrieť: Chýba sadzba AW na karte Miesta. Doplňte sadzbu alebo označte 'Cena neznáma'.");
        }

        setIsUploading(true);
        setUploadStatusText("Komprimujem fotky na 1600px...");

        try {
          const timestamp = Date.now();
          const uid = currentUser.id;

          let vinUrl = null, rearUrl = null, sheetUrl = null;
          const damageUrls = [];

          if (vinFile) vinUrl = await uploadSingleFile(vinFile, `${uid}/${timestamp}_vin.jpg`);
          if (rearFile) rearUrl = await uploadSingleFile(rearFile, `${uid}/${timestamp}_rear.jpg`);
          if (sheetFile) sheetUrl = await uploadSingleFile(sheetFile, `${uid}/${timestamp}_sheet.jpg`);

          for (let i = 0; i < damageFiles.length; i++) {
            const dUrl = await uploadSingleFile(damageFiles[i], `${uid}/${timestamp}_dmg_${i + 1}.jpg`);
            damageUrls.push(dUrl);
          }

          const currentYear = new Date().getFullYear();
          const techPrefix = (currentUser.email.split("@")[0].substring(0, 4)).toUpperCase();
          const internalRecordNo = `${techPrefix}/${currentYear}/${String(vehicles.length + 1).padStart(3, "0")}`;

          const finalStatus = isPricePending ? "pending_price" : (isAwRateMissing ? "pending_rate" : "completed");

          const newVehicleRecord = {
            project_id: selectedProjectId,
            created_by: currentUser.id,
            internal_record_no: internalRecordNo,
            client_calc_no: clientCalcNo || null,
            price_category: selectedCategoryLabel || null,
            ri_price: Number(riPrice) || 0.00,
            vin: vin || "N/A",
            ecv: hasNoEcv ? "Bez ŠPZ" : (ecv || "N/A"),
            has_no_ecv: hasNoEcv,
            brand: brand || "Neznáma",
            model: model || "Neznámy",
            color: color,
            currency: currency,
            price: isPricePending ? 0 : (Number(price) || 0),
            is_price_pending: isPricePending,
            aw_count: (currentSelectedProject?.pricing_mode === "free" && awCount) ? parseFloat(awCount) : null,
            tech_pdr_percent: currentSelectedProject?.tech_pdr_percent ?? 100,
            tech_ri_percent: currentSelectedProject?.tech_ri_percent ?? 100,
            note: damageNote.trim() || null,
            note_created_at: damageNote.trim() ? new Date().toISOString() : null,
            photo_vin_url: vinUrl,
            photo_rear_url: rearUrl,
            photo_sheet_url: sheetUrl,
            damage_photos: damageUrls,
            status: finalStatus
          };

          const { data, error } = await supabase.from("vehicles").insert([newVehicleRecord]).select();
          if (error) throw error;

          setVehicles([data[0], ...vehicles]);
          alert("Vozidlo a fotografie boli úspešne uložené!");

          setVin("");
          setEcv("");
          setBrand("");
          setModel("");
          if (currentSelectedProject?.pricing_mode === "free") setPrice("");
          setAwCount("");
          setRiPrice("");
          setIsPricePending(false);
          setDamageNote("");
          setVinFile(null);
          setRearFile(null);
          setSheetFile(null);
          setDamageFiles([]);
          setVinPreview(null);
          setRearPreview(null);
          setSheetPreview(null);
        } catch (err) {
          alert("Chyba: " + err.message);
        } finally {
          setIsUploading(false);
          setUploadStatusText("");
        }
      };

      // Spätné doplnenie ceny pre uzavreté auto s neznámou cenou
      const handleSaveLatePrice = async (vehicleId) => {
        const val = parseFloat(latePriceInput);
        if (isNaN(val) || val <= 0) return alert("Zadajte platnú sumu.");

        const { error } = await supabase.from("vehicles").update({
          price: val,
          is_price_pending: false,
          status: "completed"
        }).eq("id", vehicleId);

        if (!error) {
          setVehicles(vehicles.map(v => v.id === vehicleId ? { ...v, price: val, is_price_pending: false, status: "completed" } : v));
          setSelectedVehicleDetail(prev => prev ? { ...prev, price: val, is_price_pending: false, status: "completed" } : null);
          setLatePriceInput("");
          alert("Cena bola úspešne doplnená a zákazka definitívne uzatvorená.");
        } else {
          alert("Chyba zápisu ceny: " + error.message);
        }
      };

      // Otvorenie a úprava údajov v Bottom Sheete
      const handleOpenSheet = (type, data) => {
        setActiveBottomSheet({ type, data });
        setSheetEditData({ ...data });
        setIsEditingSheet(false);
      };

      const handleSaveSheetEdit = async () => {
        const isClient = activeBottomSheet.type === "client";
        const table = isClient ? "clients" : "projects";

        const { error } = await supabase.from(table).update(sheetEditData).eq("id", sheetEditData.id);
        if (!error) {
          if (isClient) {
            setClients(clients.map(c => c.id === sheetEditData.id ? sheetEditData : c));
          } else {
            setProjects(projects.map(p => p.id === sheetEditData.id ? sheetEditData : p));
          }
          setActiveBottomSheet({ type: activeBottomSheet.type, data: sheetEditData });
          setIsEditingSheet(false);
          alert("Údaje boli úspešne aktualizované.");
        } else {
          alert("Chyba: " + error.message);
        }
      };

      // Filtrovaný súpis pre Reporty
      const reportVehicles = useMemo(() => {
        return vehicles.filter(v => {
          if (repClientFilter !== "all") {
            const project = projects.find(p => p.id === v.project_id);
            if (!project || project.client_id !== repClientFilter) return false;
          }
          if (repProjectFilter !== "all" && v.project_id !== repProjectFilter) return false;

          if (repDateRange === "week") {
            const d = new Date(); d.setDate(d.getDate() - 7);
            if (new Date(v.created_at) < d) return false;
          } else if (repDateRange === "month") {
            const d = new Date(); d.setDate(d.getDate() - 30);
            if (new Date(v.created_at) < d) return false;
          }

          if (repSearchQuery.trim()) {
            const q = repSearchQuery.toLowerCase();
            return (
              (v.client_calc_no && v.client_calc_no.toLowerCase().includes(q)) ||
              (v.vin && v.vin.toLowerCase().includes(q)) ||
              (v.ecv && v.ecv.toLowerCase().includes(q)) ||
              (v.brand && v.brand.toLowerCase().includes(q)) ||
              (v.model && v.model.toLowerCase().includes(q))
            );
          }
          return true;
        });
      }, [vehicles, projects, repClientFilter, repProjectFilter, repDateRange, repSearchQuery]);

      const reportTotals = useMemo(() => {
        let pdrTotal = 0, riTotal = 0, techTotal = 0;
        reportVehicles.forEach(v => {
          const p = Number(v.price) || 0;
          const r = Number(v.ri_price) || 0;
          pdrTotal += p;
          riTotal += r;
          techTotal += (p * ((v.tech_pdr_percent ?? 100) / 100)) + (r * ((v.tech_ri_percent ?? 100) / 100));
        });
        return {
          count: reportVehicles.length,
          gross: (pdrTotal + riTotal).toFixed(2),
          tech: techTotal.toFixed(2)
        };
      }, [reportVehicles]);

      const toggleCurrency = () => {
        const next = currency === "EUR" ? "USD" : "EUR";
        setCurrency(next);
        localStorage.setItem("pdr_curr", next);
      };

      if (loadingUser) {
        return <div className="p-8 text-amber-500 font-bold text-center"><i className="fa-solid fa-spinner fa-spin text-2xl"></i></div>;
      }

      return (
        <div className="max-w-md mx-auto w-full p-2 pb-24">
          {/* Univerzálne vstupy pre súbory (Kamera aj Knižnica fotiek) */}
          <input type="file" accept="image/*" ref={cameraInputRef} onChange={handlePhotoCapture} className="hidden" />
          <input type="file" accept="image/*" ref={damagePhotoInputRef} onChange={handleDamagePhotoAdd} className="hidden" />

          {/* NAHRÁVANIE OVERLAY */}
          {isUploading && (
            <div className="fixed inset-0 bg-black/90 z-50 flex flex-col justify-center items-center p-6 space-y-3 text-center">
              <i className="fa-solid fa-cloud-arrow-up text-amber-500 text-4xl animate-bounce"></i>
              <p className="text-white font-extrabold text-sm">{uploadStatusText}</p>
            </div>

                }`}
              >
                {isUploading ? "Nahrávam..." : (!canCloseRecord ? "Blokované (Doplňte sadzbu AW)" : "Uložiť vozidlo")}
              </button>
            </form>
          ) : activeTab === "projects" ? (
            /* 2. KARTA: KLIENTI & MIESTA */
            <div className="space-y-3">
              <button onClick={() => setShowNewClientForm(!showNewClientForm)} className="w-full bg-amber-500 hover:bg-amber-400 text-black font-extrabold py-2 px-3 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow">
                <i className="fa-solid fa-plus"></i>
                <span>+ Nový Klient</span>
              </button>

              {showNewClientForm && (
                <form onSubmit={async (e) => {
                  e.preventDefault();
                  if (!newClientName.trim()) return;
                  const { data, error } = await supabase.from("clients").insert([{ 
                    name: newClientName.trim(), 
                    calc_prefix: newClientPrefix.trim() ? newClientPrefix.trim().toUpperCase() : null,
                    auto_numbering: newClientAutoNum,
                    address: newClientAddress.trim() || null,
                    phone: newClientPhone.trim() || null,
                    created_by: currentUser.id 
                  }]).select();
                  if (!error && data) {
                    setClients([...clients, data[0]]);
                    setSelectedClientId(data[0].id);
                    setNewClientName("");
                    setShowNewClientForm(false);
                  }
                }} className="bg-gray-800 p-3.5 rounded-xl border border-amber-500/50 space-y-2">
                  <input type="text" value={newClientName} onChange={e => setNewClientName(e.target.value)} placeholder="Názov firmy" className="w-full bg-gray-900 border border-gray-600 rounded p-1.5 text-xs text-white" required />
                  <div className="grid grid-cols-2 gap-2">
                    <input type="text" value={newClientPrefix} onChange={e => setNewClientPrefix(e.target.value)} placeholder="Predpona (DNK)" className="bg-gray-900 border border-gray-600 rounded p-1.5 text-xs text-amber-400 font-mono uppercase" />
                    <input type="text" value={newClientPhone} onChange={e => setNewClientPhone(e.target.value)} placeholder="Telefón" className="bg-gray-900 border border-gray-600 rounded p-1.5 text-xs text-white" />
                  </div>
                  <button type="submit" className="w-full bg-amber-500 text-black font-extrabold py-1.5 rounded text-xs shadow">Uložiť klienta</button>
                </form>
              )}

              <div className="space-y-2.5">
                {clients.map(c => {
                  const clientProjects = projects.filter(p => p.client_id === c.id && (showArchivedProjects ? true : p.is_active !== false));
                  const isOpen = selectedClientDetailId === c.id;

                  return (
                    <div key={c.id} className="bg-gray-800 rounded-xl border border-gray-700 overflow-hidden">
                      <div onClick={() => setSelectedClientDetailId(isOpen ? null : c.id)} className="p-3 flex justify-between items-center cursor-pointer hover:bg-gray-750">
                        <div>
                          <h4 className="font-extrabold text-white text-sm">{c.name}</h4>
                          <p className="text-[10px] text-gray-400">{clientProjects.length} miest</p>
                        </div>
                        <div className="flex items-center gap-2">
                          <button type="button" onClick={(e) => { e.stopPropagation(); handleOpenSheet("client", c); }} className="text-xs px-2 py-1 rounded border bg-gray-900 text-amber-400 border-gray-700 font-bold">
                            <i className="fa-solid fa-address-card"></i>
                          </button>
                          <i className={`fa-solid ${isOpen ? "fa-chevron-up" : "fa-chevron-down"} text-xs text-gray-400`}></i>
                        </div>
                      </div>

                      {isOpen && (
                        <div className="p-3 bg-gray-900/70 border-t border-gray-700 space-y-2.5">
                          <button onClick={() => { setAddingProjectClientId(addingProjectClientId === c.id ? null : c.id); setProjectCategoriesList([]); }} className="w-full bg-amber-500 text-black font-extrabold py-1.5 rounded text-xs shadow">
                            + Pridať miesto pod {c.name}
                          </button>

                          {addingProjectClientId === c.id && (
                            <div className="bg-gray-950 p-2.5 rounded-xl border border-amber-500/50 space-y-2">
                              <input type="text" value={newProjectName} onChange={e => setNewProjectName(e.target.value)} placeholder="Názov miesta" className="w-full bg-gray-900 border border-gray-700 rounded p-1 text-xs text-white" />
                              <input type="text" value={newProjectAddress} onChange={e => setNewProjectAddress(e.target.value)} placeholder="Adresa servisu" className="w-full bg-gray-900 border border-gray-700 rounded p-1 text-xs text-gray-200" />
                              
                              <div className="grid grid-cols-3 gap-1">
                                {["free", "fixed", "categories"].map(mode => (
                                  <button key={mode} type="button" onClick={() => setNewProjectPricingMode(mode)} className={`py-1 text-[9px] font-bold rounded uppercase border ${newProjectPricingMode === mode ? "bg-amber-500 text-black border-amber-400" : "bg-gray-900 text-gray-300 border-gray-700"}`}>
                                    {mode}
                                  </button>
                                ))}
                              </div>

                              {newProjectPricingMode === "fixed" && (
                                <input type="number" inputMode="decimal" value={newProjectFixedPrice} onChange={e => setNewProjectFixedPrice(e.target.value)} placeholder={`Fixná sadzba (${currSymbol})`} className="w-full bg-gray-900 border border-gray-700 rounded p-1 text-xs text-amber-300 font-bold" />
                              )}

                              {/* GENERÁTOR KATEGÓRIÍ (Cat 1: 350 €) */}
                              {newProjectPricingMode === "categories" && (
                                <div className="p-2 bg-gray-900 rounded border border-gray-700 space-y-2">
                                  <div className="flex gap-1.5">
                                    <input 
                                      type="number" 
                                      inputMode="decimal"
                                      value={tempCategoryPrice} 
                                      onChange={e => setTempCategoryPrice(e.target.value)} 
                                      placeholder={`Suma pre Cat ${projectCategoriesList.length + 1} (${currSymbol})`}
                                      className="flex-1 bg-gray-950 border border-amber-500/50 rounded p-1 text-xs text-amber-400 font-bold"
                                    />
                                    <button type="button" onClick={handleAddCategoryItem} className="bg-amber-500 text-black font-extrabold px-3 py-1 text-xs rounded shadow">
                                      + Pridať Cat
                                    </button>
                                  </div>

                                  <div className="flex flex-wrap gap-1">
                                    {projectCategoriesList.map((cat, i) => (
                                      <span key={i} className="inline-flex items-center gap-1 bg-gray-950 border border-amber-500/40 text-amber-300 px-2 py-0.5 rounded text-[10px] font-bold">
                                        {cat.label}: {cat.price} {currSymbol}
                                        <button type="button" onClick={() => handleRemoveCategoryItem(i)} className="text-red-400 hover:text-red-200 ml-1">×</button>
                                      </span>
                                    ))}
                                  </div>
                                </div>
                              )}

                              <div className="grid grid-cols-2 gap-1.5">
                                <input type="number" inputMode="decimal" value={newProjectTechPdrPercent} onChange={e => setNewProjectTechPdrPercent(e.target.value)} placeholder="% PDR (100)" className="bg-gray-900 border border-gray-700 rounded p-1 text-xs text-amber-400 font-bold" />
                                <input type="number" inputMode="decimal" value={newProjectAwRate} onChange={e => setNewProjectAwRate(e.target.value)} placeholder={`Sadzba AW (${currSymbol})`} className="bg-gray-900 border border-gray-700 rounded p-1 text-xs text-amber-400 font-bold" />
                              </div>

                              <button type="button" onClick={async () => {
                                if (!newProjectName.trim()) return;
                                const { data, error } = await supabase.from("projects").insert([{ 
                                  client_id: c.id, 
                                  name: newProjectName.trim(), 
                                  address: newProjectAddress.trim() || null,
                                  pricing_mode: newProjectPricingMode,
                                  fixed_price: newProjectPricingMode === "fixed" ? Number(newProjectFixedPrice) || 0 : null,
                                  pricing_categories: newProjectPricingMode === "categories" ? projectCategoriesList : null,
                                  tech_pdr_percent: parseFloat(newProjectTechPdrPercent) || 100,
                                  tech_ri_percent: parseFloat(newProjectTechRiPercent) || 100,
                                  aw_rate: newProjectAwRate ? parseFloat(newProjectAwRate) : null,
                                  is_active: true,
                                  created_by: currentUser.id 
                                }]).select();

                                if (!error && data) {
                                  setProjects([...projects, data[0]]);
                                  setSelectedProjectId(data[0].id);
                                  setNewProjectName("");
                                  setProjectCategoriesList([]);
                                  setAddingProjectClientId(null);
                                }
                              }} className="w-full bg-amber-500 text-black font-extrabold py-1.5 text-xs rounded">Uložiť miesto</button>
                            </div>
                          )}

                          <div className="space-y-1">
                            {clientProjects.map(p => (
                              <div key={p.id} className="text-xs p-2 rounded border bg-gray-950 border-gray-800 flex justify-between items-center">
                                <div>
                                  <span className="font-bold text-white">{p.name}</span>
                                  <span className="ml-1 text-[8px] uppercase bg-gray-800 text-amber-400 px-1 rounded font-bold">{p.pricing_mode}</span>
                                </div>
                                <button type="button" onClick={() => handleOpenSheet("project", p)} className="text-[10px] px-2 py-1 bg-gray-900 border border-gray-700 rounded text-amber-400 font-bold">
                                  Detail / Edit
                                </button>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          ) : (
            /* 3. KARTA: REPORTY */
            <div className="space-y-3">
              <input 
                type="text" 
                value={repSearchQuery} 
                onChange={e => setRepSearchQuery(e.target.value)} 
                placeholder="Rýchle hľadanie (Audi Q5, VIN, ŠPZ)..." 
                className="w-full bg-gray-800 border border-gray-700 rounded-lg p-1.5 text-xs text-white"
              />

              <div className="grid grid-cols-2 gap-2 text-center">
                <div className="bg-gray-800 p-2 rounded-xl border border-gray-700">
                  <span className="text-[9px] text-gray-400 uppercase font-bold">Fakturované</span>
                  <p className="text-sm font-black text-amber-400">{reportTotals.gross} {currSymbol}</p>
                </div>
                <div className="bg-gray-800 p-2 rounded-xl border border-amber-500/40 bg-amber-500/10">
                  <span className="text-[9px] text-amber-300 uppercase font-bold">Tvoj podiel</span>
                  <p className="text-sm font-black text-amber-400">~{reportTotals.tech} {currSymbol}</p>
                </div>
              </div>

              <div className="space-y-1.5">
                {reportVehicles.map(v => (
                  <div key={v.id} onClick={() => { setSelectedVehicleDetail(v); setLatePriceInput(""); }} className="bg-gray-800 p-2.5 rounded-xl border border-gray-700 flex justify-between items-center cursor-pointer hover:border-amber-500/50">
                    <div>
                      <div className="flex items-center gap-1.5">
                        <span className="text-xs font-bold text-amber-400 font-mono">{v.client_calc_no || "Bez kalkulácie"}</span>
                        <span className="text-xs font-bold text-white">{v.brand} {v.model}</span>
                      </div>
                      <p className="text-[9px] text-gray-400 font-mono">VIN: {v.vin} | {v.ecv}</p>
                    </div>
                    <div className="text-right">
                      {v.is_price_pending ? (
                        <span className="text-[10px] bg-yellow-500/20 text-yellow-300 font-bold px-2 py-0.5 rounded border border-yellow-500/30">
                          {v.aw_count ? `${v.aw_count} AW` : "Cena neznáma"}
                        </span>
                      ) : (
                        <span className="text-xs bg-amber-500/20 text-amber-300 font-bold px-2 py-0.5 rounded">
                          {(Number(v.price) + Number(v.ri_price || 0)).toFixed(2)} {currSymbol}
                        </span>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
